name: tmp canonical structural context benchmark

on:
  push:
    branches:
      - agent/tmp-composer-cache-paired-benchmark

permissions:
  contents: read

jobs:
  paired-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PRODUCTION_REF: 2f61bcdcd5fcf6ef2eda9de9993e381bc34878a4
      SAMPLE_COUNT: '256'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Run paired production versus patched candidate
        shell: bash
        run: |
          set -euo pipefail
          results="$RUNNER_TEMP/canonical-structural-context-results.jsonl"
          : > "$results"

          apply_candidate_patch() {
            python - <<'PY'
          from pathlib import Path
          p = Path('src/curriculum/formal-syntax-utterance.ts')
          s = p.read_text()

          import_needle = 'import { FORMAL_SYNTAX_RULES } from "../syntax/grammar.js";\n'
          import_repl = 'import { DEFAULT_DERIVATION_BOUNDS } from "../syntax/features.js";\n' + import_needle
          if import_needle not in s:
              raise SystemExit('grammar import needle missing')
          s = s.replace(import_needle, import_repl, 1)

          marker = '''export function prepareFormalSyntaxLexicon(\n  eligibleEntries: readonly CatalogEntry[],\n  profiles: readonly RuntimeSyntaxProfile[],\n): PreparedFormalSyntaxLexicon {\n'''
          insert = '''interface CanonicalStructuralSamplingContextEntry {\n  readonly bounds: DerivationBounds;\n  readonly context: PreparedStructuralSamplingContext;\n}\n\nconst canonicalStructuralSamplingContextCache = new Map<\n  string,\n  CanonicalStructuralSamplingContextEntry\n>();\n\nfunction derivationBoundsCacheKey(bounds: DerivationBounds): string {\n  return [\n    bounds.maximumPhraseDepth,\n    bounds.maximumClauseNesting,\n    bounds.maximumClausesPerSentence,\n    bounds.maximumCoordinationItems,\n    bounds.maximumConsecutiveModifiers,\n    bounds.maximumComplementsPerPredicate,\n    bounds.maximumLexicalEntriesPerUtterance,\n  ].join("|");\n}\n\nfunction canonicalStructuralSamplingContext(\n  bounds: DerivationBounds | undefined,\n): CanonicalStructuralSamplingContextEntry {\n  const sourceBounds = bounds ?? DEFAULT_DERIVATION_BOUNDS;\n  const key = derivationBoundsCacheKey(sourceBounds);\n  const cached = canonicalStructuralSamplingContextCache.get(key);\n  if (cached !== undefined) return cached;\n  const stableBounds: DerivationBounds = { ...sourceBounds };\n  const prepared = {\n    bounds: stableBounds,\n    context: prepareStructuralSamplingContext(FORMAL_SYNTAX_RULES, stableBounds),\n  };\n  canonicalStructuralSamplingContextCache.set(key, prepared);\n  return prepared;\n}\n\n'''
          if marker not in s:
              raise SystemExit('lexicon marker missing')
          s = s.replace(marker, insert + marker, 1)

          old = '''  let preparedStructuralSamplingContext: PreparedStructuralSamplingContext | null = null;\n  const structuralSamplingContext = (): PreparedStructuralSamplingContext => {\n    preparedStructuralSamplingContext ??= prepareStructuralSamplingContext(rules, input.bounds);\n    return preparedStructuralSamplingContext;\n  };\n'''
          new = '''  let preparedStructuralSamplingContext: PreparedStructuralSamplingContext | null = null;\n  const structuralSamplingContext = (): PreparedStructuralSamplingContext => {\n    if (rules === FORMAL_SYNTAX_RULES) {\n      return canonicalStructuralSamplingContext(input.bounds).context;\n    }\n    preparedStructuralSamplingContext ??= prepareStructuralSamplingContext(rules, input.bounds);\n    return preparedStructuralSamplingContext;\n  };\n'''
          if old not in s:
              raise SystemExit('structural context block missing')
          s = s.replace(old, new, 1)

          old = '''    const shape = sampleStructuralDerivation({\n      rootCategory: "Sentence",\n      rules,\n      random: input.random,\n'''
          new = '''    const preparedSamplingContext = structuralSamplingContext();\n    const shape = sampleStructuralDerivation({\n      rootCategory: "Sentence",\n      rules,\n      random: input.random,\n'''
          if old not in s:
              raise SystemExit('shape start missing')
          s = s.replace(old, new, 1)

          old = '''      ...(input.bounds === undefined ? {} : { bounds: input.bounds }),\n'''
          new = '''      bounds: preparedSamplingContext.bounds,\n'''
          if old not in s:
              raise SystemExit('bounds option missing')
          s = s.replace(old, new, 1)

          old = '''    }, structuralSamplingContext());\n'''
          new = '''    }, preparedSamplingContext);\n'''
          if old not in s:
              raise SystemExit('context call missing')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          }

          measure() {
            local label="$1"
            local candidate="$2"
            git checkout --force "$PRODUCTION_REF" >/dev/null
            git clean -fdx >/dev/null
            if [[ "$candidate" == "yes" ]]; then
              apply_candidate_patch
            fi
            npm ci --include=dev --ignore-scripts >/dev/null
            npm run app:catalog >/dev/null
            cat > .tmp-product-environment-paired.ts <<'EOF'
          import { appendFileSync } from "node:fs";
          import { performance } from "node:perf_hooks";
          import {
            EVALUATION_CATALOG,
            PRACTICE_CATALOG,
            SYNTAX_PROFILES,
          } from "./src/app/generated/catalog.js";
          import { stableRuntimeDigest } from "./src/core/stable-id.js";
          import {
            createFreshProgressForEnvironment,
            createProductEnvironment,
            createProductState,
          } from "./src/product/session.js";

          const sampleCount = Number(process.env.SAMPLE_COUNT);
          const environmentStartedAt = performance.now();
          const environment = createProductEnvironment({
            practice: PRACTICE_CATALOG,
            evaluation: EVALUATION_CATALOG,
            syntaxProfiles: SYNTAX_PROFILES,
          });
          const environmentMs = Math.round(performance.now() - environmentStartedAt);
          const baseProgress = createFreshProgressForEnvironment(
            environment,
            "canonical-structural-context-paired",
            "guided",
            "standard",
          );
          const outputs: object[] = [];
          let attemptTotal = 0;
          const startedAt = performance.now();
          for (let round = 0; round < sampleCount; round += 1) {
            const state = createProductState(
              environment,
              { ...baseProgress, practiceRoundsCompleted: round },
              0,
            );
            const selection = state.round.selection;
            if (selection.generationAttempts !== 1) {
              throw new Error(`normal product round unexpectedly retried: ${selection.generationAttempts}`);
            }
            attemptTotal += selection.generationAttempts;
            outputs.push({
              id: selection.utterance.id,
              text: selection.utterance.text,
              root: selection.utterance.syntaxRootRuleId ?? null,
              profileIds: selection.utterance.syntaxProfileIds ?? [],
              generationAttempts: selection.generationAttempts,
              fallbackReasons: selection.grammarFallbackReasons,
            });
          }
          const row = {
            label: process.env.TARGET_LABEL,
            sampleCount,
            attemptTotal,
            outputDigest: stableRuntimeDigest(outputs),
            environmentMs,
            elapsedMs: Math.round(performance.now() - startedAt),
          };
          appendFileSync(process.env.RESULTS_PATH!, `${JSON.stringify(row)}\n`);
          console.log(JSON.stringify(row));
          EOF
            TARGET_LABEL="$label" RESULTS_PATH="$results" node --import tsx .tmp-product-environment-paired.ts
          }

          measure production-1 no
          measure candidate-1 yes
          measure candidate-2 yes
          measure production-2 no
          measure production-3 no
          measure candidate-3 yes
          measure candidate-4 yes
          measure production-4 no

          RESULTS_PATH="$results" node <<'EOF'
          const fs = require('node:fs');
          const rows = fs.readFileSync(process.env.RESULTS_PATH, 'utf8').trim().split('\n').map(JSON.parse);
          const digests = new Set(rows.map((row) => row.outputDigest));
          const attempts = new Set(rows.map((row) => row.attemptTotal));
          const expectedAttempts = Number(process.env.SAMPLE_COUNT);
          if (digests.size !== 1) throw new Error(`output digest drift: ${JSON.stringify(rows)}`);
          if (attempts.size !== 1 || !attempts.has(expectedAttempts)) {
            throw new Error(`attempt-count drift: ${JSON.stringify(rows)}`);
          }
          const production = rows.filter((row) => row.label.startsWith('production'));
          const candidate = rows.filter((row) => row.label.startsWith('candidate'));
          const mean = (items, key) => items.reduce((sum, row) => sum + row[key], 0) / items.length;
          const median = (values) => {
            const sorted = [...values].sort((a, b) => a - b);
            return (sorted[1] + sorted[2]) / 2;
          };
          const productionTimes = production.map((row) => row.elapsedMs);
          const candidateTimes = candidate.map((row) => row.elapsedMs);
          const productionMeanMs = mean(production, 'elapsedMs');
          const candidateMeanMs = mean(candidate, 'elapsedMs');
          const productionMedianMs = median(productionTimes);
          const candidateMedianMs = median(candidateTimes);
          const pairedDeltas = production.map((row, index) => row.elapsedMs - candidate[index].elapsedMs);
          console.log(JSON.stringify({
            rows,
            outputDigest: rows[0].outputDigest,
            attemptTotal: rows[0].attemptTotal,
            productionTimes,
            candidateTimes,
            productionMeanMs: Math.round(productionMeanMs),
            candidateMeanMs: Math.round(candidateMeanMs),
            meanSpeedupPct: Number(((productionMeanMs - candidateMeanMs) / productionMeanMs * 100).toFixed(2)),
            productionMedianMs: Math.round(productionMedianMs),
            candidateMedianMs: Math.round(candidateMedianMs),
            medianSpeedupPct: Number(((productionMedianMs - candidateMedianMs) / productionMedianMs * 100).toFixed(2)),
            pairedDeltas,
            candidateFasterPairs: pairedDeltas.filter((delta) => delta > 0).length,
            productionEnvironmentMeanMs: Math.round(mean(production, 'environmentMs')),
            candidateEnvironmentMeanMs: Math.round(mean(candidate, 'environmentMs')),
          }, null, 2));
          EOF
