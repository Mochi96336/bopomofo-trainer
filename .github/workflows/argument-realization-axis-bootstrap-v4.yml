name: argument realization axis bootstrap v4

on:
  push:
    branches:
      - agent/argument-realization-axis-migration
    paths:
      - .github/workflows/argument-realization-axis-bootstrap-v4.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/argument-realization-axis-migration
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --include=dev --ignore-scripts
      - name: Apply corrected migration from bootstrap template
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/argument-realization-axis-bootstrap.yml').read_text()
          marker = '      - name: Apply ownership migration\n'
          start = source.index(marker)
          run = source.index('        run: |\n', start) + len('        run: |\n')
          next_step = source.find('\n      - name:', run)
          block = source[run:] if next_step < 0 else source[run:next_step + 1]
          apply = '\n'.join(line[10:] if line.startswith('          ') else line for line in block.splitlines()) + '\n'
          old = 'digest.slice(0, 13), 16) / 0x1_0000_0000_0000'
          new = 'digest.slice(0, 12), 16) / 281_474_976_710_656'
          if apply.count(old) != 1:
              raise SystemExit(f'expected one projection match, got {apply.count(old)}')
          Path('/tmp/apply-argument-realization.sh').write_text(apply.replace(old, new))
          PY
          bash /tmp/apply-argument-realization.sh
      - name: Set authoritative runtime grammar lock
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('data/grammar/formal-syntax-runtime-lock.json')
          lock = json.loads(path.read_text())
          lock['grammarRulesDigest'] = 'b3fca9b920eef418374d5b437ae05492ddb11fa2e40cd16294f2ba63af0129a5'
          path.write_text(json.dumps(lock, separators=(',', ':')) + '\n')
          PY
      - name: Repair test contracts for retired omission rules
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/syntax/argument-realization-axis-migration.test.ts')
          text = path.read_text()
          old = '                requiredProductionRuleIdsAnyOf: practice.requiredProductionRuleIdsAnyOf,\n'
          new = '                ...(practice.requiredProductionRuleIdsAnyOf === undefined\n                  ? {}\n                  : { requiredProductionRuleIdsAnyOf: practice.requiredProductionRuleIdsAnyOf }),\n'
          if text.count(old) != 3:
              raise SystemExit(f'expected three optional target test fields, got {text.count(old)}')
          path.write_text(text.replace(old, new), newline='\n')

          path = Path('tests/syntax/clause-model-v2.test.ts')
          text = path.read_text()
          old = '''    expect(CURRENT_CLAUSE_RULE_V2_MIGRATION["clause.subject-omission"].targetAxis)\n      .toBe("argument-realization");\n    expect(CURRENT_CLAUSE_RULE_V2_MIGRATION["clause.object-omission"].targetAxis)\n      .toBe("argument-realization");\n'''
          new = '''    expect(RETIRED_CLAUSE_RULE_V2_DECISIONS["clause.subject-omission"]).toMatchObject({\n      targetAxes: ["argument-realization"],\n      evidenceContract: "pinned-gsd-argument-realization-alternation-v1",\n    });\n    expect(RETIRED_CLAUSE_RULE_V2_DECISIONS["clause.object-omission"]).toMatchObject({\n      targetAxes: ["argument-realization"],\n      evidenceContract: "pinned-gsd-argument-realization-alternation-v1",\n    });\n'''
          if text.count(old) != 1:
              raise SystemExit('expected one stale omission migration assertion block')
          text = text.replace(old, new)
          old_counts = '''      "preserve-core": 7,\n      "move-to-axis": 3,\n      "rebuild-construction": 3,'''
          new_counts = '''      "preserve-core": 7,\n      "move-to-axis": 1,\n      "rebuild-construction": 3,'''
          if text.count(old_counts) != 1:
              raise SystemExit('expected one stale migration count block')
          path.write_text(text.replace(old_counts, new_counts), newline='\n')
          PY
      - name: Validate migration
        run: |
          npx vitest run tests/syntax/argument-realization-axis-migration.test.ts tests/curriculum/argument-realization-practice-ticket.test.ts tests/syntax/clause-model-v2.test.ts --reporter=verbose --testTimeout=30000
          npm run app:catalog
          npm run typecheck
      - name: Commit permanent source and tests only
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/syntax/sample.ts src/syntax/clause-rules.ts src/syntax/clause-model-v2.ts \
            src/curriculum/formal-syntax-taxonomy.ts src/curriculum/formal-syntax-sampling-policy.ts \
            src/curriculum/formal-syntax-utterance.ts src/curriculum/argument-realization-practice.ts \
            tests/syntax/argument-realization-axis-migration.test.ts \
            tests/curriculum/argument-realization-practice-ticket.test.ts \
            tests/syntax/clause-model-v2.test.ts \
            data/grammar/formal-syntax-runtime-lock.json
          git commit -m "refactor(syntax): move omission onto argument realization axis"
          git push origin HEAD:agent/argument-realization-axis-migration
