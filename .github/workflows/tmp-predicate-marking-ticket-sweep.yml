name: tmp predicate marking ticket sweep

on:
  push:
    branches:
      - agent/predicate-marking-practice-ticket-clean

permissions:
  contents: read

jobs:
  audit:
    strategy:
      fail-fast: false
      matrix:
        weight: ["0", "0.025", "0.03"]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci --include=dev --ignore-scripts
      - name: Generate app catalog
        run: npm run app:catalog
      - name: Measure ticket weight
        shell: bash
        run: |
          SAMPLE_COUNT=2048 NEGATION_TICKET_WEIGHT="${{ matrix.weight }}" \
            npx tsx scripts/tmp-predicate-marking-ticket-sweep.ts > "/tmp/ticket-${{ matrix.weight }}.json"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: predicate-marking-ticket-final-${{ matrix.weight }}
          path: /tmp/ticket-${{ matrix.weight }}.json
          if-no-files-found: error
