name: apply construction depth plumbing once

on:
  push:
    branches:
      - agent/formal-syntax-v2-construction-minimum-clause-depth

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/formal-syntax-v2-construction-minimum-clause-depth
      - name: Apply exact selector depth patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/curriculum/frequency-first-utterance.ts')
          source = path.read_text()
          replacements = [
              (
                  'import type { RuntimeSyntaxProfile } from "../syntax/types.js";',
                  'import { DEFAULT_DERIVATION_BOUNDS } from "../syntax/features.js";\nimport type { RuntimeSyntaxProfile } from "../syntax/types.js";',
              ),
              (
                  'export type FormalSyntaxCompositionOverride = Pick<\n  FormalSyntaxUtteranceInput,\n  "rules" | "samplingMode" | "structuralTarget"\n>;',
                  'export type FormalSyntaxCompositionOverride = Pick<\n  FormalSyntaxUtteranceInput,\n  "rules" | "samplingMode" | "structuralTarget"\n> & {\n  /** Minimum recursive clause budget required by an explicit construction. */\n  readonly minimumClauseNesting?: number;\n};',
              ),
              (
                  'function enrichSlotSelections(\n',
                  'function validatedConstructionClauseNesting(\n  input: FrequencyFirstUtteranceInput,\n): number {\n  const minimum = input.formalSyntaxComposition?.minimumClauseNesting;\n  if (minimum === undefined) return 1;\n  if (!Number.isInteger(minimum) || minimum < 0) {\n    throw new RangeError("formalSyntaxComposition minimumClauseNesting must be a non-negative integer");\n  }\n  if (minimum > DEFAULT_DERIVATION_BOUNDS.maximumClauseNesting) {\n    throw new RangeError("formalSyntaxComposition minimumClauseNesting exceeds formal grammar default");\n  }\n  return Math.max(1, minimum);\n}\n\nfunction composerCompositionOverride(\n  input: FrequencyFirstUtteranceInput,\n): Pick<FormalSyntaxUtteranceInput, "rules" | "samplingMode" | "structuralTarget"> {\n  const composition = input.formalSyntaxComposition;\n  if (composition === undefined) return {};\n  return {\n    ...(composition.rules === undefined ? {} : { rules: composition.rules }),\n    ...(composition.samplingMode === undefined ? {} : { samplingMode: composition.samplingMode }),\n    ...(composition.structuralTarget === undefined ? {} : { structuralTarget: composition.structuralTarget }),\n  };\n}\n\nfunction enrichSlotSelections(\n',
              ),
              (
                  '      ...(input.formalSyntaxComposition ?? {}),\n      bounds: {\n        maximumPhraseDepth: 3,\n        maximumClauseNesting: 1,',
                  '      ...composerCompositionOverride(input),\n      bounds: {\n        maximumPhraseDepth: 3,\n        maximumClauseNesting: validatedConstructionClauseNesting(input),',
              ),
          ]
          for old, new in replacements:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one replacement target, got {count}: {old[:90]!r}')
              source = source.replace(old, new)
          path.write_text(source)
          PY
          git diff --check
      - name: Commit source patch and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/apply-construction-depth-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/curriculum/frequency-first-utterance.ts .github/workflows/apply-construction-depth-once.yml
          git commit -m "feat(curriculum): honor explicit construction clause depth"
          git push origin HEAD:agent/formal-syntax-v2-construction-minimum-clause-depth
