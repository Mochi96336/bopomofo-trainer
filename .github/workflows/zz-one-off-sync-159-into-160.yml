name: one-off sync current #159 into #160

on:
  push:
    branches:
      - agent/analysis-v2-strategy-permutations-v2

permissions:
  contents: write

jobs:
  sync:
    if: ${{ github.event.before == '9494864a02e6a8a38f584ecbd5cbc9921d346f69' && contains(github.event.head_commit.message, '[install-sync-159-160]') }}
    runs-on: ubuntu-latest
    env:
      PARENT_SHA: 1a38ab3a002d77ee980e35c3c095ccdf6c3b81f3
      PARENT_BRANCH: agent/analysis-v2-feedback-polish
      CHILD_BRANCH: agent/analysis-v2-strategy-permutations-v2
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/analysis-v2-strategy-permutations-v2
          fetch-depth: 0

      - name: Guard locked parent and child heads
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "+refs/heads/${PARENT_BRANCH}:refs/remotes/origin/${PARENT_BRANCH}"
          git fetch origin "+refs/heads/${CHILD_BRANCH}:refs/remotes/origin/${CHILD_BRANCH}"
          test "$(git rev-parse "refs/remotes/origin/${PARENT_BRANCH}")" = "${PARENT_SHA}"
          test "$(git rev-parse "refs/remotes/origin/${CHILD_BRANCH}")" = "${GITHUB_SHA}"

      - name: Merge parent and reconcile owned semantics
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git merge --no-commit --no-ff -X ours "${PARENT_SHA}"
          test -z "$(git diff --name-only --diff-filter=U)"
          python <<'PY'
          from pathlib import Path

          def read(path: str) -> str:
              return Path(path).read_text(encoding='utf-8')

          def write(path: str, text: str) -> None:
              Path(path).write_text(text, encoding='utf-8')

          def replace_once(path: str, old: str, new: str) -> None:
              text = read(path)
              if old in text:
                  if text.count(old) != 1:
                      raise SystemExit(f'{path}: expected one old fragment, found {text.count(old)}')
                  write(path, text.replace(old, new))
                  return
              if new not in text:
                  raise SystemExit(f'{path}: neither old nor reconciled fragment found')

          # Measurement policy: #159 owns aggregate-5; #160 adds Strategy channels.
          replace_once(
              'src/measurement-v2/aggregate.ts',
              'export const PREVIOUS_MEASUREMENT_V2_POLICY_VERSION = "input-order-v2-aggregate-3" as const;\nexport const MEASUREMENT_V2_POLICY_VERSION = "input-order-v2-aggregate-4" as const;',
              'export const PREVIOUS_MEASUREMENT_V2_POLICY_VERSION = "input-order-v2-aggregate-3" as const;\nexport const BODY_ONLY_REVISIT_MEASUREMENT_V2_POLICY_VERSION = "input-order-v2-aggregate-4" as const;\nexport const MEASUREMENT_V2_POLICY_VERSION = "input-order-v2-aggregate-5" as const;',
          )

          # Keep #160 Strategy types, but inherit #159 tone-aware revisit meaning.
          replace_once(
              'src/measurement-v2/types.ts',
              '/**\n * Reappearance of the same conventional hand assignment inside one word body.\n * Tone keys and cross-word/syllable predecessors are deliberately excluded;\n * tone completion is owned by ToneCommitObservation instead.\n */',
              '/**\n * Reappearance of the same conventional hand assignment inside one syllable.\n * Accepted body components and the final accepted tone can both complete a\n * revisit; predecessors never cross a syllable or entry boundary.\n */',
          )

          # Compose #160 trajectory derivation with #159 tone-aware same-hand recurrence.
          path = 'src/measurement-v2/derive-observations.ts'
          text = read(path)
          helper = '''  const recordSameHandRevisit = (trace: InteractionTraceV2): void => {\n    if (activeRevisitSyllable !== trace.syllableOrdinal) {\n      resetBodyRevisitState(previousByHand, dirtyByHand, oppositeEventsSince);\n      activeRevisitSyllable = trace.syllableOrdinal;\n    }\n    const hand = explicitHand(trace.physicalCode);\n    if (hand === null) {\n      resetBodyRevisitState(previousByHand, dirtyByHand, oppositeEventsSince);\n      return;\n    }\n    const previousSameHand = previousByHand[hand];\n    if (previousSameHand !== null) {\n      sameHandRevisits.push({\n        traceSequence: trace.sequence,\n        hand,\n        boundary: "within-syllable",\n        timingMs: Math.max(0, trace.timestampMs - previousSameHand.timestampMs),\n        oppositeHandEventsBetween: oppositeEventsSince[hand],\n        clean: !dirtyByHand[hand],\n      });\n    }\n    previousByHand[hand] = trace;\n    dirtyByHand[hand] = false;\n    oppositeEventsSince[hand] = 0;\n    oppositeEventsSince[otherHand(hand)] += 1;\n  };\n\n'''
          if 'const recordSameHandRevisit = (trace: InteractionTraceV2)' not in text:
              anchor = '  const bodyEvents = new Map<number, InteractionTraceV2[]>();\n  const dirtyCoordination = new Set<number>();\n\n'
              if text.count(anchor) != 1:
                  raise SystemExit('derive-observations: helper insertion anchor drifted')
              text = text.replace(anchor, anchor + helper)

          old_body = '''      // Same-hand revisit is a word-body metric. Tone keys and earlier words\n      // must never become predecessors for this family.\n      if (activeRevisitSyllable !== trace.syllableOrdinal) {\n        resetBodyRevisitState(previousByHand, dirtyByHand, oppositeEventsSince);\n        activeRevisitSyllable = trace.syllableOrdinal;\n      }\n      const bodyHand = explicitHand(trace.physicalCode);\n      if (bodyHand === null) {\n        resetBodyRevisitState(previousByHand, dirtyByHand, oppositeEventsSince);\n      } else {\n        const previousSameHand = previousByHand[bodyHand];\n        if (previousSameHand !== null) {\n          sameHandRevisits.push({\n            traceSequence: trace.sequence,\n            hand: bodyHand,\n            boundary: "within-syllable",\n            timingMs: Math.max(0, trace.timestampMs - previousSameHand.timestampMs),\n            oppositeHandEventsBetween: oppositeEventsSince[bodyHand],\n            clean: !dirtyByHand[bodyHand],\n          });\n        }\n        previousByHand[bodyHand] = trace;\n        dirtyByHand[bodyHand] = false;\n        oppositeEventsSince[bodyHand] = 0;\n        oppositeEventsSince[otherHand(bodyHand)] += 1;\n      }\n'''
          new_body = '''      // Same-hand revisit follows accepted motor events inside one syllable.\n      // A later tone key may therefore complete a revisit before the state resets.\n      recordSameHandRevisit(trace);\n'''
          if old_body in text:
              if text.count(old_body) != 1:
                  raise SystemExit('derive-observations: duplicate body-only revisit block')
              text = text.replace(old_body, new_body)
          elif new_body not in text:
              raise SystemExit('derive-observations: accepted-component revisit block drifted')

          call = '      recordSameHandRevisit(trace);\n'
          call_count = text.count(call)
          if call_count == 1:
              anchor = '      bodyEvents.delete(trace.syllableOrdinal);\n'
              if text.count(anchor) != 1:
                  raise SystemExit('derive-observations: tone reset anchor drifted')
              text = text.replace(anchor, call + anchor)
          elif call_count != 2:
              raise SystemExit(f'derive-observations: expected 1 or 2 revisit calls, got {call_count}')
          write(path, text)

          # Aggregate-4 is a real #160 draft predecessor: preserve valid Strategy
          # channels while still resetting its body-only revisit family on migration.
          path = 'src/measurement-v2/serialize.ts'
          text = read(path)
          if '  BODY_ONLY_REVISIT_MEASUREMENT_V2_POLICY_VERSION,\n' not in text:
              anchor = 'import {\n'
              if text.count(anchor) < 1:
                  raise SystemExit('serialize: import anchor missing')
              text = text.replace(anchor, anchor + '  BODY_ONLY_REVISIT_MEASUREMENT_V2_POLICY_VERSION,\n', 1)
          old_versions = '''    || (value.policyVersion !== MEASUREMENT_V2_POLICY_VERSION\n      && value.policyVersion !== PREVIOUS_MEASUREMENT_V2_POLICY_VERSION\n      && value.policyVersion !== HANDSHAPE_MEASUREMENT_V2_POLICY_VERSION\n      && value.policyVersion !== LEGACY_MEASUREMENT_V2_POLICY_VERSION)'''
          new_versions = '''    || (value.policyVersion !== MEASUREMENT_V2_POLICY_VERSION\n      && value.policyVersion !== BODY_ONLY_REVISIT_MEASUREMENT_V2_POLICY_VERSION\n      && value.policyVersion !== PREVIOUS_MEASUREMENT_V2_POLICY_VERSION\n      && value.policyVersion !== HANDSHAPE_MEASUREMENT_V2_POLICY_VERSION\n      && value.policyVersion !== LEGACY_MEASUREMENT_V2_POLICY_VERSION)'''
          if old_versions in text:
              text = text.replace(old_versions, new_versions)
          elif new_versions not in text:
              raise SystemExit('serialize: supported-version boundary drifted')
          old_strategy = '  const currentStrategyEvidence = value.policyVersion === MEASUREMENT_V2_POLICY_VERSION;\n'
          new_strategy = '''  const currentStrategyEvidence = value.policyVersion === MEASUREMENT_V2_POLICY_VERSION\n    || value.policyVersion === BODY_ONLY_REVISIT_MEASUREMENT_V2_POLICY_VERSION;\n'''
          if old_strategy in text:
              text = text.replace(old_strategy, new_strategy)
          elif new_strategy not in text:
              raise SystemExit('serialize: Strategy evidence boundary drifted')
          if 'const legacySameHandRevisit = value.policyVersion !== MEASUREMENT_V2_POLICY_VERSION;' not in text:
              raise SystemExit('serialize: tone-aware revisit reset boundary missing')
          write(path, text)

          # #159 presentation owns genuine return-only revisit semantics; #160 owns Strategy.
          path = 'src/app/analysis-v2-model.ts'
          text = read(path)
          old = '''  const sameHandRevisits = joinMotorFamily(\n    measurements.motor.sameHandRevisits,\n    history?.motor.sameHandRevisits,\n  );\n'''
          new = '''  // Zero-opposite-hand revisits duplicate immediateHands (L→L / R→R).\n  // Keep them persisted, but show only genuine leave-and-return patterns here.\n  const sameHandRevisits = joinMotorFamily(\n    measurements.motor.sameHandRevisits,\n    history?.motor.sameHandRevisits,\n  ).filter((cell) => cell.scope.oppositeHandIntervened);\n'''
          if old in text:
              text = text.replace(old, new)
          elif '.filter((cell) => cell.scope.oppositeHandIntervened);' not in text:
              raise SystemExit('analysis-v2-model: return-only filter drifted')
          write(path, text)

          path = 'src/app/analysis-v2-panel.ts'
          text = read(path)
          old_fn = '''function revisitMovementDiagram(): string {\n  return `<div class="analysis-v2-movement-diagram" aria-label="同側再次出現；中間可能連續，也可能穿插另一側">\n    <div class="analysis-v2-movement-diagram-line"><span>同側</span><i>↗</i><span>同側</span><b>／</b><span>同側</span><i>↘</i><span>另一側</span><i>↗</i><span>同側</span></div>\n  </div>`;\n}\n'''
          new_fn = '''function revisitMovementDiagram(): string {\n  return `<div class="analysis-v2-movement-diagram" aria-label="同一音節內離開一側後回到原側；最後的聲調鍵也可以成為回返終點">\n    <div class="analysis-v2-movement-diagram-line"><span>同側</span><i>→</i><span>另一側</span><i>→</i><span>同側</span></div>\n  </div>`;\n}\n'''
          if old_fn in text:
              text = text.replace(old_fn, new_fn)
          elif new_fn not in text:
              # The line-art renderer may already own the shape, but the semantic
              # wrapper still must describe return-only behavior.
              text = text.replace('aria-label="同側再次出現；中間可能連續，也可能穿插另一側"', 'aria-label="同一音節內離開一側後回到原側；最後的聲調鍵也可以成為回返終點"')
          old_label = '''function revisitLabel(cell: AnalysisV2MotorCell<SameHandRevisitAggregateScope>): string {\n  const hand = cell.scope.hand === "left" ? "左" : "右";\n  if (!cell.scope.oppositeHandIntervened) return `${hand} · 連續`;\n  return `${hand} · 隔${cell.scope.hand === "left" ? "右" : "左"}側`;\n}\n'''
          new_label = '''function revisitLabel(cell: AnalysisV2MotorCell<SameHandRevisitAggregateScope>): string {\n  const hand = cell.scope.hand === "left" ? "左" : "右";\n  return `${hand} · 隔${cell.scope.hand === "left" ? "右" : "左"}側`;\n}\n'''
          if old_label in text:
              text = text.replace(old_label, new_label)
          elif new_label not in text:
              raise SystemExit('panel: revisit label drifted')
          text = text.replace(
              'const observedRevisits = model.coordination.sameHandRevisits.filter((cell) => cell.observations > 0);',
              'const observedRevisits = model.coordination.sameHandRevisits.filter(\n    (cell) => cell.observations > 0 && cell.scope.oppositeHandIntervened,\n  );',
          )
          text = text.replace('尚無字內同側再出手資料', '尚無同音節同側回返資料')
          text = text.replace('"同側再出手",', '"同側回返",')
          text = text.replace(
              '"只比較同一個字內的注音成分；聲調與跨字事件不列入。可比較資料依目前代表時間由慢到快排列。",',
              '"比較同一音節內離開一側後回到原側的時間；連續同手已由手別轉換的左→左／右→右呈現。最後的聲調鍵可以成為回返終點，不跨音節。可比較資料依目前代表時間由慢到快排列。",',
          )
          text = text.replace(
              '同側再出手只看同一字內的注音成分，不含聲調或跨字事件。',
              '同側回返只看同一音節內離開一側後再次回到該側的已接受手部事件，包含最後聲調但不跨音節或跨字；連續同手留在手別轉換，避免重複呈現同一筆相鄰時間。',
          )
          if '"同側再出手",' in text or '尚無字內同側再出手資料' in text:
              raise SystemExit('panel: stale same-side presentation copy remains')
          write(path, text)

          # Keep direct assertions aligned if the textual conflict chose #160's side.
          for path in [
              'tests/app/analysis-v2-panel.test.ts',
              'tests/browser/analysis-v2-feedback.browser.ts',
          ]:
              text = read(path).replace('同側再出手', '同側回返')
              write(path, text)

          # Lock the critical aggregate-4 → aggregate-5 Strategy migration contract.
          path = 'tests/measurement-v2/legacy-strategy-evidence.test.ts'
          text = read(path)
          if 'BODY_ONLY_REVISIT_MEASUREMENT_V2_POLICY_VERSION' not in text:
              text = text.replace(
                  'import {\n',
                  'import {\n  BODY_ONLY_REVISIT_MEASUREMENT_V2_POLICY_VERSION,\n',
                  1,
              )
          test_block = '''\n  it("preserves valid Strategy channels from aggregate-4 while resetting body-only revisit evidence", () => {\n    const legacy = withFutureStrategyEvidence(BODY_ONLY_REVISIT_MEASUREMENT_V2_POLICY_VERSION);\n    const motor = legacy.motor as Record<string, unknown>;\n    motor.sameHandRevisits = {\n      '["same-hand-revisit","left",true]': {\n        scope: { hand: "left", oppositeHandIntervened: true },\n        observations: 5,\n        timingSamples: 5,\n        currentTimeToTypeMs: 180,\n        bestTimeToTypeMs: 150,\n      },\n    };\n\n    const migrated = parseMeasurementSummaryV2(legacy, "guided", "zhuyin-standard", TOKENS);\n\n    expect(Object.keys(migrated?.strategy.inputOrderPermutations ?? {})).toHaveLength(1);\n    expect(migrated?.strategy.recentInputOrderTrajectories).toHaveLength(1);\n    expect(migrated?.motor.sameHandRevisits).toEqual({});\n  });\n'''
          if 'preserves valid Strategy channels from aggregate-4 while resetting body-only revisit evidence' not in text:
              anchor = '\n  it("still preserves those channels under the current policy", () => {'
              if text.count(anchor) != 1:
                  raise SystemExit('legacy Strategy test insertion anchor drifted')
              text = text.replace(anchor, test_block + anchor)
          write(path, text)
          PY

      - name: Validate reconciled stack before push
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run typecheck
          npx vitest run \
            tests/measurement-v2/legacy-strategy-evidence.test.ts \
            tests/measurement-v2/serialize.test.ts \
            tests/measurement-v2/derive-observations.test.ts \
            tests/app/analysis-v2-model.test.ts \
            tests/app/analysis-v2-panel.test.ts \
            --testTimeout=15000
          git diff --check

      - name: Commit and push real merge ancestry
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/zz-one-off-sync-159-into-160.yml
          git add -A
          git diff --cached --check
          git commit -m 'merge: sync current #159 into Strategy stack [sync-159-160]'
          git push origin "HEAD:${CHILD_BRANCH}"
