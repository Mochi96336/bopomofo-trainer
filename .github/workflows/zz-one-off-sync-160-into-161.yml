name: one-off sync current #160 into #161

on:
  push:
    branches:
      - agent/analysis-v2-immediate-token-history

permissions:
  contents: write

jobs:
  sync:
    if: ${{ github.event.before == '85b48820a1d81366cddf35efa0686aabc2f93368' && contains(github.event.head_commit.message, '[retry-sync-160-161]') }}
    runs-on: ubuntu-latest
    env:
      PARENT_SHA: 79fe520e8821f0df5530d17c623d691e44c7a812
      PARENT_BRANCH: agent/analysis-v2-strategy-permutations-v2
      CHILD_BRANCH: agent/analysis-v2-immediate-token-history
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/analysis-v2-immediate-token-history
          fetch-depth: 0

      - name: Guard locked parent and child heads
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "+refs/heads/${PARENT_BRANCH}:refs/remotes/origin/${PARENT_BRANCH}"
          git fetch origin "+refs/heads/${CHILD_BRANCH}:refs/remotes/origin/${CHILD_BRANCH}"
          test "$(git rev-parse "refs/remotes/origin/${PARENT_BRANCH}")" = "${PARENT_SHA}"
          test "$(git rev-parse "refs/remotes/origin/${CHILD_BRANCH}")" = "${GITHUB_SHA}"

      - name: Merge parent and reconcile schema 8
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git merge --no-commit --no-ff -X ours "${PARENT_SHA}"
          test -z "$(git diff --name-only --diff-filter=U)"
          python scripts/zz_one_off_sync_160_161.py
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/progress-history/motor-history.test.ts')
          text = path.read_text(encoding='utf-8')
          if 'sameHandRevisitAggregateKey,' not in text:
              anchor = '  immediateTokenAggregateKey,\n'
              if anchor not in text:
                  raise SystemExit('motor-history import anchor drifted')
              text = text.replace(anchor, anchor + '  sameHandRevisitAggregateKey,\n', 1)
              path.write_text(text, encoding='utf-8')
          PY

      - name: Validate schema and interaction contracts before push
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run typecheck
          npx vitest run \
            tests/progress-history/serialize.test.ts \
            tests/progress-history/revisit-migration.test.ts \
            tests/progress-history/motor-history.test.ts \
            tests/app/local-progress-history.test.ts \
            tests/app/analysis-v2-model.test.ts \
            tests/app/analysis-v2-panel.test.ts \
            tests/app/analysis-v2-speed-network.test.ts \
            tests/app/analysis-v2-speed-preview.test.ts \
            tests/measurement-v2/legacy-strategy-evidence.test.ts \
            tests/app/analysis-v2-strategy-permutation.test.ts \
            --testTimeout=15000
          git diff --check

      - name: Commit and push real merge ancestry
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/zz-one-off-sync-160-into-161.yml
          rm scripts/zz_one_off_sync_160_161.py
          git add -A
          git diff --cached --check
          git commit -m 'merge: sync current #160 and version exact history as schema 8 [sync-160-161]'
          git push origin "HEAD:${CHILD_BRANCH}"
