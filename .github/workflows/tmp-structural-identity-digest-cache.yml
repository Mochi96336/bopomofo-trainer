name: tmp structural identity digest cache benchmark

on:
  push:
    branches:
      - agent/tmp-structural-identity-digest-cache

permissions:
  contents: read

env:
  PRODUCTION_REF: 7b4535b2c371d296f0a15cd39b405bd579afe9d5
  SAMPLE_COUNT: 256

jobs:
  paired-benchmark:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Candidate correctness preflight
        shell: bash
        run: |
          set -euo pipefail
          git checkout --force "$PRODUCTION_REF"
          git clean -fdx
          npm ci --include=dev --ignore-scripts
          python - <<'PY'
          from pathlib import Path
          p = Path('src/syntax/sample.ts')
          s = p.read_text()

          old = '''function makeSlot(
            constituent: ProductionConstituent,
            requirements: SyntaxRequirements,
            occurrenceIndex: number,
            path: readonly string[],
          ): StructuralLexicalSlot {
          '''
          new = '''type StructuralIdentityDigestCache = Map<string, string>;

          function structuralIdentityDigest(
            source: string,
            cache: StructuralIdentityDigestCache,
          ): string {
            const existing = cache.get(source);
            if (existing !== undefined) return existing;
            const digest = stableRuntimeDigestCanonicalJson(source);
            cache.set(source, digest);
            return digest;
          }

          function makeSlot(
            constituent: ProductionConstituent,
            requirements: SyntaxRequirements,
            occurrenceIndex: number,
            path: readonly string[],
            identityDigestCache: StructuralIdentityDigestCache,
          ): StructuralLexicalSlot {
          '''
          if old not in s: raise SystemExit('makeSlot signature anchor missing')
          s = s.replace(old, new, 1)

          old = '    id: `syntax-slot:${stableRuntimeDigestCanonicalJson(identitySource)}`,'
          new = '    id: `syntax-slot:${structuralIdentityDigest(identitySource, identityDigestCache)}`,'
          if old not in s: raise SystemExit('slot digest anchor missing')
          s = s.replace(old, new, 1)

          old = '''  nestedProductionTargets: ReadonlyMap<string, ValidatedNestedProductionTarget>,
            fixedCounts?: ConstituentCounts,
          '''
          new = '''  nestedProductionTargets: ReadonlyMap<string, ValidatedNestedProductionTarget>,
            identityDigestCache: StructuralIdentityDigestCache,
            fixedCounts?: ConstituentCounts,
          '''
          if old not in s: raise SystemExit('sampleRuleChildren signature anchor missing')
          s = s.replace(old, new, 1)

          old = '''        const slot = makeSlot(
                  constituent,
                  childRequirements,
                  occurrenceIndex,
                  [...path, constituent.key],
                );
          '''
          new = '''        const slot = makeSlot(
                  constituent,
                  childRequirements,
                  occurrenceIndex,
                  [...path, constituent.key],
                  identityDigestCache,
                );
          '''
          if old not in s: raise SystemExit('makeSlot call anchor missing')
          s = s.replace(old, new, 1)

          old = '''        nestedProductionTargets,
                  false,
                  requestedChildRuleId,
          '''
          new = '''        nestedProductionTargets,
                  identityDigestCache,
                  false,
                  requestedChildRuleId,
          '''
          if old not in s: raise SystemExit('recursive sampleCategory call anchor missing')
          s = s.replace(old, new, 1)

          old = '''  nestedProductionTargets: ReadonlyMap<string, ValidatedNestedProductionTarget>,
            isRoot: boolean,
            requestedProductionRuleId?: string,
          ): Sampled | null {
          '''
          new = '''  nestedProductionTargets: ReadonlyMap<string, ValidatedNestedProductionTarget>,
            identityDigestCache: StructuralIdentityDigestCache,
            isRoot: boolean,
            requestedProductionRuleId?: string,
          ): Sampled | null {
          '''
          if old not in s: raise SystemExit('sampleCategory signature anchor missing')
          s = s.replace(old, new, 1)

          old = '''      nestedProductionTargets,
                fixedCounts,
                orderedLicensingAlternatives && !productiveBaAlternative,
          '''
          new = '''      nestedProductionTargets,
                identityDigestCache,
                fixedCounts,
                orderedLicensingAlternatives && !productiveBaAlternative,
          '''
          if old not in s: raise SystemExit('sampleRuleChildren call anchor missing')
          s = s.replace(old, new, 1)

          old = '      id: `syntax-node:${stableRuntimeDigestCanonicalJson(identitySource)}`,'
          new = '      id: `syntax-node:${structuralIdentityDigest(identitySource, identityDigestCache)}`,'
          if old not in s: raise SystemExit('node digest anchor missing')
          s = s.replace(old, new, 1)

          old = '''  const rulesByOutput = context.rulesByOutput;
            for (let attempt = 0; attempt < maximumAttempts; attempt += 1) {
          '''
          new = '''  const rulesByOutput = context.rulesByOutput;
            // Bound reuse to this sampler invocation. The cache is never shared across
            // product rounds, environments, or independent callers.
            const identityDigestCache: StructuralIdentityDigestCache = new Map();
            for (let attempt = 0; attempt < maximumAttempts; attempt += 1) {
          '''
          if old not in s: raise SystemExit('sampler cache lifetime anchor missing')
          s = s.replace(old, new, 1)

          old = '''      nestedProductionTargets,
                true,
              );
          '''
          new = '''      nestedProductionTargets,
                identityDigestCache,
                true,
              );
          '''
          if old not in s: raise SystemExit('root sampleCategory call anchor missing')
          s = s.replace(old, new, 1)

          p.write_text(s)
          PY
          npm run typecheck
          npx vitest run tests/syntax/sample.test.ts tests/syntax/nested-clause-order-stability.test.ts tests/curriculum/formal-syntax-utterance.test.ts tests/product/session.test.ts

      - name: Run exact-head paired benchmark
        shell: bash
        run: |
          set -euo pipefail
          results="$RUNNER_TEMP/structural-identity-digest-cache-results.jsonl"
          : > "$results"

          patch_candidate() {
            python - <<'PY'
          from pathlib import Path
          p = Path('src/syntax/sample.ts')
          s = p.read_text()
          replacements = [
            ('''function makeSlot(
            constituent: ProductionConstituent,
            requirements: SyntaxRequirements,
            occurrenceIndex: number,
            path: readonly string[],
          ): StructuralLexicalSlot {
          ''', '''type StructuralIdentityDigestCache = Map<string, string>;

          function structuralIdentityDigest(
            source: string,
            cache: StructuralIdentityDigestCache,
          ): string {
            const existing = cache.get(source);
            if (existing !== undefined) return existing;
            const digest = stableRuntimeDigestCanonicalJson(source);
            cache.set(source, digest);
            return digest;
          }

          function makeSlot(
            constituent: ProductionConstituent,
            requirements: SyntaxRequirements,
            occurrenceIndex: number,
            path: readonly string[],
            identityDigestCache: StructuralIdentityDigestCache,
          ): StructuralLexicalSlot {
          '''),
            ('    id: `syntax-slot:${stableRuntimeDigestCanonicalJson(identitySource)}`,', '    id: `syntax-slot:${structuralIdentityDigest(identitySource, identityDigestCache)}`,'),
            ('''  nestedProductionTargets: ReadonlyMap<string, ValidatedNestedProductionTarget>,
            fixedCounts?: ConstituentCounts,
          ''', '''  nestedProductionTargets: ReadonlyMap<string, ValidatedNestedProductionTarget>,
            identityDigestCache: StructuralIdentityDigestCache,
            fixedCounts?: ConstituentCounts,
          '''),
            ('''        const slot = makeSlot(
                  constituent,
                  childRequirements,
                  occurrenceIndex,
                  [...path, constituent.key],
                );
          ''', '''        const slot = makeSlot(
                  constituent,
                  childRequirements,
                  occurrenceIndex,
                  [...path, constituent.key],
                  identityDigestCache,
                );
          '''),
            ('''        nestedProductionTargets,
                  false,
                  requestedChildRuleId,
          ''', '''        nestedProductionTargets,
                  identityDigestCache,
                  false,
                  requestedChildRuleId,
          '''),
            ('''  nestedProductionTargets: ReadonlyMap<string, ValidatedNestedProductionTarget>,
            isRoot: boolean,
            requestedProductionRuleId?: string,
          ): Sampled | null {
          ''', '''  nestedProductionTargets: ReadonlyMap<string, ValidatedNestedProductionTarget>,
            identityDigestCache: StructuralIdentityDigestCache,
            isRoot: boolean,
            requestedProductionRuleId?: string,
          ): Sampled | null {
          '''),
            ('''      nestedProductionTargets,
                fixedCounts,
                orderedLicensingAlternatives && !productiveBaAlternative,
          ''', '''      nestedProductionTargets,
                identityDigestCache,
                fixedCounts,
                orderedLicensingAlternatives && !productiveBaAlternative,
          '''),
            ('      id: `syntax-node:${stableRuntimeDigestCanonicalJson(identitySource)}`,', '      id: `syntax-node:${structuralIdentityDigest(identitySource, identityDigestCache)}`,'),
            ('''  const rulesByOutput = context.rulesByOutput;
            for (let attempt = 0; attempt < maximumAttempts; attempt += 1) {
          ''', '''  const rulesByOutput = context.rulesByOutput;
            const identityDigestCache: StructuralIdentityDigestCache = new Map();
            for (let attempt = 0; attempt < maximumAttempts; attempt += 1) {
          '''),
            ('''      nestedProductionTargets,
                true,
              );
          ''', '''      nestedProductionTargets,
                identityDigestCache,
                true,
              );
          '''),
          ]
          for old, new in replacements:
              if old not in s:
                  raise SystemExit(f'candidate patch anchor missing: {old[:80]!r}')
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          }

          measure() {
            local label="$1"
            local candidate="$2"
            git checkout --force "$PRODUCTION_REF" >/dev/null
            git clean -fdx >/dev/null
            npm ci --include=dev --ignore-scripts >/dev/null
            if [[ "$candidate" == "1" ]]; then patch_candidate; fi
            npm run app:catalog >/dev/null
            cat > .tmp-product-environment-paired.ts <<'EOF'
          import { appendFileSync } from "node:fs";
          import { performance } from "node:perf_hooks";
          import { EVALUATION_CATALOG, PRACTICE_CATALOG, SYNTAX_PROFILES } from "./src/app/generated/catalog.js";
          import { stableRuntimeDigest } from "./src/core/stable-id.js";
          import { createFreshProgressForEnvironment, createProductEnvironment, createProductState } from "./src/product/session.js";

          const sampleCount = Number(process.env.SAMPLE_COUNT);
          const environmentStartedAt = performance.now();
          const environment = createProductEnvironment({ practice: PRACTICE_CATALOG, evaluation: EVALUATION_CATALOG, syntaxProfiles: SYNTAX_PROFILES });
          const environmentMs = Math.round(performance.now() - environmentStartedAt);
          const baseProgress = createFreshProgressForEnvironment(environment, "structural-identity-digest-cache-paired", "guided", "standard");
          const outputs: object[] = [];
          let attemptTotal = 0;
          const startedAt = performance.now();
          for (let round = 0; round < sampleCount; round += 1) {
            const state = createProductState(environment, { ...baseProgress, practiceRoundsCompleted: round }, 0);
            const selection = state.round.selection;
            if (selection.generationAttempts !== 1) throw new Error(`normal product round unexpectedly retried: ${selection.generationAttempts}`);
            attemptTotal += selection.generationAttempts;
            outputs.push({ id: selection.utterance.id, text: selection.utterance.text, root: selection.utterance.syntaxRootRuleId ?? null, profileIds: selection.utterance.syntaxProfileIds ?? [], generationAttempts: selection.generationAttempts, fallbackReasons: selection.grammarFallbackReasons });
          }
          const row = { label: process.env.TARGET_LABEL, sampleCount, attemptTotal, outputDigest: stableRuntimeDigest(outputs), environmentMs, elapsedMs: Math.round(performance.now() - startedAt) };
          appendFileSync(process.env.RESULTS_PATH!, `${JSON.stringify(row)}\n`);
          console.log(JSON.stringify(row));
          EOF
            TARGET_LABEL="$label" RESULTS_PATH="$results" node --import tsx .tmp-product-environment-paired.ts
          }

          measure production-1 0
          measure candidate-1 1
          measure candidate-2 1
          measure production-2 0
          measure production-3 0
          measure candidate-3 1
          measure candidate-4 1
          measure production-4 0

          RESULTS_PATH="$results" node <<'EOF'
          const fs = require('node:fs');
          const rows = fs.readFileSync(process.env.RESULTS_PATH, 'utf8').trim().split('\n').map(JSON.parse);
          const digests = new Set(rows.map((row) => row.outputDigest));
          const attempts = new Set(rows.map((row) => row.attemptTotal));
          const expectedAttempts = Number(process.env.SAMPLE_COUNT);
          if (digests.size !== 1) throw new Error(`output digest drift: ${JSON.stringify(rows)}`);
          if (attempts.size !== 1 || !attempts.has(expectedAttempts)) throw new Error(`attempt-count drift: ${JSON.stringify(rows)}`);
          const production = rows.filter((row) => row.label.startsWith('production'));
          const candidate = rows.filter((row) => row.label.startsWith('candidate'));
          const mean = (items, key) => items.reduce((sum, row) => sum + row[key], 0) / items.length;
          const median = (values) => { const sorted = [...values].sort((a, b) => a - b); return (sorted[1] + sorted[2]) / 2; };
          const productionTimes = production.map((row) => row.elapsedMs);
          const candidateTimes = candidate.map((row) => row.elapsedMs);
          const productionMeanMs = mean(production, 'elapsedMs');
          const candidateMeanMs = mean(candidate, 'elapsedMs');
          const productionMedianMs = median(productionTimes);
          const candidateMedianMs = median(candidateTimes);
          const pairedDeltas = production.map((row, index) => row.elapsedMs - candidate[index].elapsedMs);
          console.log(JSON.stringify({ rows, outputDigest: rows[0].outputDigest, attemptTotal: rows[0].attemptTotal, productionTimes, candidateTimes, productionMeanMs: Math.round(productionMeanMs), candidateMeanMs: Math.round(candidateMeanMs), meanSpeedupPct: Number(((productionMeanMs - candidateMeanMs) / productionMeanMs * 100).toFixed(2)), productionMedianMs: Math.round(productionMedianMs), candidateMedianMs: Math.round(candidateMedianMs), medianSpeedupPct: Number(((productionMedianMs - candidateMedianMs) / productionMedianMs * 100).toFixed(2)), pairedDeltas, candidateFasterPairs: pairedDeltas.filter((delta) => delta > 0).length, productionEnvironmentMeanMs: Math.round(mean(production, 'environmentMs')), candidateEnvironmentMeanMs: Math.round(mean(candidate, 'environmentMs')) }, null, 2));
          EOF
