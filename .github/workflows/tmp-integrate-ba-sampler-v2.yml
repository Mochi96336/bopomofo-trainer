name: tmp integrate BA sampler v2

on:
  push:
    branches:
      - agent/integrate-ba-sampler-v2

permissions:
  contents: write

jobs:
  integrate:
    if: ${{ !contains(github.event.head_commit.message, '[integrated-ba-sampler-v2]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Merge stable sampler stack and resolve sampler ownership
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          set +e
          git merge --no-commit --no-ff 2480d82bd9ef9f7f038963aee170fae8148dbcfd
          merge_status=$?
          set -e

          conflicts="$(git diff --name-only --diff-filter=U)"
          if [ -n "$conflicts" ] && [ "$conflicts" != "src/syntax/sample.ts" ]; then
            echo "Unexpected merge conflicts:"
            printf '%s\n' "$conflicts"
            exit 1
          fi
          if [ "$merge_status" -ne 0 ] && [ "$conflicts" != "src/syntax/sample.ts" ]; then
            echo "Merge failed outside the expected sample.ts integration point"
            exit 1
          fi

          # Start from #248's exact-count + stable keyed Clause sampler, then add
          # #235's BAPredicate licensing-fallback semantics explicitly.
          git checkout 2480d82bd9ef9f7f038963aee170fae8148dbcfd -- src/syntax/sample.ts

          python - <<'PY'
          from pathlib import Path

          path = Path("src/syntax/sample.ts")
          source = path.read_text()

          replacements = [
              (
                  '''const CLAUSE_LIKE = new Set<SyntaxCategory>([\n  "Sentence", "Clause", "OpenClause", "ClauseSequence", "RelativeClause", "ContentClause", "QuotedClause",\n]);\n\nfunction nextUnit(random: RandomSource): number {''',
                  '''const CLAUSE_LIKE = new Set<SyntaxCategory>([\n  "Sentence", "Clause", "OpenClause", "ClauseSequence", "RelativeClause", "ContentClause", "QuotedClause",\n]);\n\nconst DETERMINISTIC_MINIMUM_RANDOM: RandomSource = { next: () => 0 };\n\nfunction nextUnit(random: RandomSource): number {''',
              ),
              (
                  '''  nestedProductionTargets: ReadonlyMap<string, ValidatedNestedProductionTarget>,\n  fixedCounts?: ConstituentCounts,\n): SampledRuleChildren | null {''',
                  '''  nestedProductionTargets: ReadonlyMap<string, ValidatedNestedProductionTarget>,\n  fixedCounts?: ConstituentCounts,\n  deterministicCounts = false,\n): SampledRuleChildren | null {''',
              ),
              (
                  '''    const count = fixedCounts === undefined\n      ? target?.exactCount ?? (\n          constituent.minimum + chooseIndex(random, maximum - constituent.minimum + 1)\n        )\n      : fixedCounts[constituent.key] ?? 0;''',
                  '''    const count = fixedCounts === undefined\n      ? target?.exactCount ?? (\n          deterministicCounts\n            ? constituent.minimum\n            : constituent.minimum + chooseIndex(random, maximum - constituent.minimum + 1)\n        )\n      : fixedCounts[constituent.key] ?? 0;''',
              ),
              (
                  '''  const stableNestedClause = !isRoot\n    && category === "Clause"\n    && requestedProductionRuleId === undefined;\n  const candidates: readonly NestedClauseCandidate[] = stableNestedClause\n    ? stableNestedClauseCandidates(eligibleRules, random)\n    : shuffled(eligibleRules, random).map((rule) => ({ rule, random }));\n  for (const candidate of candidates) {\n    const { rule } = candidate;\n    const candidateRandom = candidate.random;\n    const order = rule.surfaceOrders[chooseIndex(candidateRandom, rule.surfaceOrders.length)];''',
                  '''  // BAPredicate alternatives are licensing fallbacks, not a product-probability\n  // dimension. Keep the reviewed path first; productive paths use a local\n  // deterministic source. Nested Clause candidates independently retain #248's\n  // fixed-cost keyed ordering and candidate-local substreams.\n  const orderedLicensingAlternatives = category === "BAPredicate";\n  const stableNestedClause = !orderedLicensingAlternatives\n    && !isRoot\n    && category === "Clause"\n    && requestedProductionRuleId === undefined;\n  const candidates: readonly NestedClauseCandidate[] = orderedLicensingAlternatives\n    ? eligibleRules.map((rule) => ({\n        rule,\n        random: rule.id === "ba-predicate.attested" ? random : DETERMINISTIC_MINIMUM_RANDOM,\n      }))\n    : stableNestedClause\n      ? stableNestedClauseCandidates(eligibleRules, random)\n      : shuffled(eligibleRules, random).map((rule) => ({ rule, random }));\n  for (const candidate of candidates) {\n    const { rule } = candidate;\n    const candidateRandom = candidate.random;\n    const productiveBaAlternative = orderedLicensingAlternatives\n      && rule.id !== "ba-predicate.attested";\n    const order = orderedLicensingAlternatives && rule.surfaceOrders.length === 1\n      ? rule.surfaceOrders[0]\n      : rule.surfaceOrders[chooseIndex(candidateRandom, rule.surfaceOrders.length)];''',
              ),
              (
                  '''      nestedProductionTargets,\n      fixedCounts,\n    );''',
                  '''      nestedProductionTargets,\n      fixedCounts,\n      orderedLicensingAlternatives && !productiveBaAlternative,\n    );''',
              ),
          ]

          for old, new in replacements:
              if source.count(old) != 1:
                  raise SystemExit(f"expected exactly one integration match, found {source.count(old)} for:\n{old}")
              source = source.replace(old, new, 1)

          path.write_text(source)
          PY

          git add -A
          if git diff --cached --quiet; then
            echo "No integration changes staged"
            exit 1
          fi
          git commit -m "test: integrate BA grammar with stable sampler [integrated-ba-sampler-v2]"
          git push origin HEAD:agent/integrate-ba-sampler-v2
