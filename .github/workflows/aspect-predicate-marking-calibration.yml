name: aspect predicate-marking calibration

on:
  pull_request:
    paths:
      - "scripts/audit-aspect-predicate-marking-calibration.ts"
      - "scripts/audit-aspect-predicate-marking-calibration-fast.ts"
      - ".github/workflows/aspect-predicate-marking-calibration.yml"
      - "src/curriculum/formal-syntax-sampling-policy.ts"
      - "src/curriculum/formal-syntax-utterance.ts"
      - "src/syntax/clause-rules.ts"
      - "src/syntax/grammar.ts"
      - "src/syntax/realize.ts"
      - "src/app/generated/catalog.ts"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  calibrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate packaged app catalog
        run: npm run app:catalog

      - name: Measure aspect predicate-marking calibration
        run: npx tsx scripts/audit-aspect-predicate-marking-calibration-fast.ts

      - name: Publish calibration summary
        if: always()
        run: |
          if [ -f aspect-calibration.md ]; then
            cat aspect-calibration.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload calibration artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aspect-predicate-marking-calibration
          path: |
            aspect-calibration.json
            aspect-calibration.md
          if-no-files-found: warn
