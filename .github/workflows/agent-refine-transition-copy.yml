name: agent-refine-transition-copy

on:
  push:
    branches:
      - agent/refine-transition-metric-copy

permissions:
  contents: write

jobs:
  patch-copy:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Refine transition metric copy
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/app/diagnostic-panel.ts")
          old = "同音節相鄰鍵的方向性時間；反向另計。"
          new = "同音節相鄰鍵的輸入間隔；僅計正確且連續的輸入。"
          text = path.read_text(encoding="utf-8")
          if text.count(old) != 1:
              raise SystemExit(f"expected exactly one copy match, found {text.count(old)}")
          path.write_text(text.replace(old, new), encoding="utf-8")
          Path(".github/workflows/agent-refine-transition-copy.yml").unlink()
          PY
      - name: Commit refined copy
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/diagnostic-panel.ts .github/workflows/agent-refine-transition-copy.yml
          git commit -m "fix: clarify transition timing copy"
          git push origin HEAD:agent/refine-transition-metric-copy
