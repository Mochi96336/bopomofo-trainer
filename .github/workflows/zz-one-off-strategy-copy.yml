name: one-off Strategy copy repair

on:
  push:
    branches:
      - agent/analysis-v2-strategy-permutations-v2

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[strategy-copy-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Restore two-part reorder wording
        shell: python
        run: |
          from pathlib import Path

          panel = Path('src/app/analysis-v2-panel.ts')
          text = panel.read_text(encoding='utf-8')
          replacements = {
              '前、後位置各累積 ${STRATEGY_LEAD_MIN_ROW_OBSERVATIONS} 個觀察後顯示位置偏移':
                  '前、後位置各累積 ${STRATEGY_LEAD_MIN_ROW_OBSERVATIONS} 個觀察後顯示換序輸入',
              '<strong><b>位置偏移</b><em>':
                  '<strong><b>換序輸入</b><em>',
              '位置偏移仍用累積位置觀察計算。':
                  '二注音完整字每次固定產生前位、後位各一個位置觀察；換序時兩個位置會成對互換，所以換序比例可由累積位置觀察等價計算。',
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one panel occurrence of {old!r}, got {count}')
              text = text.replace(old, new)
          panel.write_text(text, encoding='utf-8')

          test = Path('tests/browser/analysis-v2-strategy-layout.browser.ts')
          text = test.read_text(encoding='utf-8')
          old = 'await expect(analysis.locator(".analysis-v2-strategy-readout")).toContainText("位置偏移");'
          new = 'await expect(analysis.locator(".analysis-v2-strategy-readout")).toContainText("換序輸入");\n  await expect(analysis.locator(".analysis-v2-strategy-readout")).not.toContainText("位置偏移");'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one browser assertion, got {count}')
          test.write_text(text.replace(old, new), encoding='utf-8')
      - name: Commit repair
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/app/analysis-v2-panel.ts tests/browser/analysis-v2-strategy-layout.browser.ts
          git diff --cached --check
          git commit -m 'fix(analysis): restore two-part reorder wording [strategy-copy-applied]'
          git push
