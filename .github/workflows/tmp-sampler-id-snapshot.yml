name: tmp sampler identity snapshot

on:
  push:
    branches:
      - agent/tmp-sampler-id-snapshot

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci --include=dev --ignore-scripts
      - run: node --import tsx scripts/tmp-sampler-id-snapshot.ts
