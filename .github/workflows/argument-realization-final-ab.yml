name: argument realization final immutable A-B

on:
  push:
    branches:
      - agent/argument-realization-axis-migration
    paths:
      - .github/workflows/argument-realization-final-ab.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout immutable production baseline
        uses: actions/checkout@v6
        with:
          ref: e99122eb81aeb0995a12a9eef63fcfd3573e4848
          path: base

      - name: Checkout immutable calibrated behavior
        uses: actions/checkout@v6
        with:
          ref: 13ce7c7864274b67700bdacab5a9bd9a193f977e
          path: current

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install baseline dependencies
        working-directory: base
        run: npm ci

      - name: Install calibrated dependencies
        working-directory: current
        run: npm ci

      - name: Generate baseline packaged catalog
        working-directory: base
        run: npm run app:catalog

      - name: Generate calibrated packaged catalog
        working-directory: current
        run: npm run app:catalog

      - name: Expose audit-only structural roots
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          for root in (Path('base'), Path('current')):
              path = root / 'src/curriculum/formal-syntax-utterance.ts'
              text = path.read_text()
              needle = '      syntaxProfileIds: realization.syntaxProfileIds,\n'
              if text.count(needle) != 1:
                  raise SystemExit(f'unexpected formal-syntax candidate shape in {root}')
              path.write_text(text.replace(needle, needle + '      __auditStructuralRoot: shape.root,\n'))
          PY

      - name: Write shared 8192-seed probe
        shell: bash
        run: |
          cat > /tmp/argument-realization-final-ab-probe.ts <<'TS'
          import { writeFileSync } from "node:fs";
          import { PRACTICE_CATALOG, SYNTAX_PROFILES } from "../src/app/generated/catalog.js";
          import { PRODUCT_FORMAL_SYNTAX_SAMPLING_POLICY } from "../src/curriculum/formal-syntax-sampling-policy.js";
          import { composeFormalSyntaxUtterances } from "../src/curriculum/formal-syntax-utterance.js";
          import { createSeededRandom } from "../src/curriculum/random.js";
          import { sentenceConstructionClassification } from "../src/curriculum/formal-syntax-taxonomy.js";
          import type { StructuralSyntaxNode } from "../src/syntax/derive.js";

          const SAMPLE_COUNT = 8192;
          const SEED_NAMESPACE = "argument-realization-final-ab-v1";
          const LABEL = process.env.AB_LABEL ?? "unknown";
          const HEAD = process.env.AB_HEAD ?? "unknown";
          const MODE = process.env.AB_MODE ?? "unknown";
          const OUTPUT = process.env.AB_OUTPUT;
          if (!OUTPUT) throw new Error("AB_OUTPUT missing");
          if (MODE !== "baseline" && MODE !== "candidate") throw new Error(`invalid AB_MODE: ${MODE}`);

          const PRODUCT_BOUNDS = {
            maximumPhraseDepth: 3,
            maximumClauseNesting: 1,
            maximumClausesPerSentence: 2,
            maximumCoordinationItems: 2,
            maximumConsecutiveModifiers: 2,
            maximumComplementsPerPredicate: 1,
            maximumLexicalEntriesPerUtterance: 6,
          } as const;

          interface AuditCandidate {
            readonly __auditStructuralRoot?: StructuralSyntaxNode;
            readonly syntaxRootRuleId: string;
            readonly syntaxDerivationId: string;
            readonly syntaxProfileIds: readonly string[];
            readonly text: string;
          }

          function syntaxChildren(node: StructuralSyntaxNode): StructuralSyntaxNode[] {
            return node.children.filter((child): child is StructuralSyntaxNode => child.kind === "syntax-node");
          }
          function visit(node: StructuralSyntaxNode, out: StructuralSyntaxNode[]): void {
            out.push(node);
            for (const child of syntaxChildren(node)) visit(child, out);
          }
          function hasDirect(node: StructuralSyntaxNode, category: string): boolean {
            return syntaxChildren(node).some((child) => child.category === category);
          }

          const coreFrames = new Set(["clause.intransitive", "clause.transitive", "clause.ditransitive"]);
          const objectFrames = new Set(["clause.transitive", "clause.ditransitive"]);
          const legacySubjectRule = "clause.subject-omission";
          const legacyObjectRule = "clause.object-omission";

          const rows = [];
          for (let round = 0; round < SAMPLE_COUNT; round += 1) {
            const composition = composeFormalSyntaxUtterances({
              eligibleEntries: PRACTICE_CATALOG,
              profiles: SYNTAX_PROFILES,
              random: createSeededRandom(`${SEED_NAMESPACE}:${round}`),
              samplingMode: "product-family",
              samplingPolicy: PRODUCT_FORMAL_SYNTAX_SAMPLING_POLICY,
              minimumLexicalEntries: 2,
              maximumCandidates: 1,
              maximumAttempts: 64,
              bounds: PRODUCT_BOUNDS,
            });
            const candidate = (composition.candidates[0] ?? null) as AuditCandidate | null;
            const nodes: StructuralSyntaxNode[] = [];
            if (candidate?.__auditStructuralRoot !== undefined) visit(candidate.__auditStructuralRoot, nodes);

            const subject = MODE === "baseline"
              ? nodes.some((node) => node.productionRuleId === legacySubjectRule)
              : nodes.some((node) => coreFrames.has(node.productionRuleId) && !hasDirect(node, "Subject"));
            const object = MODE === "baseline"
              ? nodes.some((node) => node.productionRuleId === legacyObjectRule)
              : nodes.some((node) => objectFrames.has(node.productionRuleId)
                  && hasDirect(node, "Subject")
                  && !hasDirect(node, "Object"));
            const root = candidate?.syntaxRootRuleId ?? null;
            rows.push({
              success: candidate !== null,
              subject,
              object,
              any: subject || object,
              both: subject && object,
              root,
              family: root === null ? null : sentenceConstructionClassification(root)?.family ?? null,
              fallback: composition.fallbackReasons.join("\u0000"),
              derivation: candidate?.syntaxDerivationId ?? null,
              text: candidate?.text ?? null,
              profiles: (candidate?.syntaxProfileIds ?? []).join("\u0000"),
            });
          }

          const policy = PRODUCT_FORMAL_SYNTAX_SAMPLING_POLICY as unknown as {
            version: string;
            argumentRealizationPracticeWeights?: unknown;
          };
          writeFileSync(OUTPUT, `${JSON.stringify({
            label: LABEL,
            mode: MODE,
            head: HEAD,
            sampleCount: SAMPLE_COUNT,
            seedNamespace: SEED_NAMESPACE,
            policyVersion: policy.version,
            argumentRealizationPracticeWeights: policy.argumentRealizationPracticeWeights ?? null,
            bounds: PRODUCT_BOUNDS,
            rows,
          })}\n`);
          TS
          cp /tmp/argument-realization-final-ab-probe.ts base/scripts/.tmp-argument-realization-final-ab-probe.ts
          cp /tmp/argument-realization-final-ab-probe.ts current/scripts/.tmp-argument-realization-final-ab-probe.ts

      - name: Run immutable production baseline 8192 seeds
        working-directory: base
        env:
          AB_LABEL: production-main
          AB_MODE: baseline
          AB_HEAD: e99122eb81aeb0995a12a9eef63fcfd3573e4848
          AB_OUTPUT: ../argument-realization-final-ab-base.json
        run: npx tsx scripts/.tmp-argument-realization-final-ab-probe.ts

      - name: Run immutable calibrated candidate 8192 seeds
        working-directory: current
        env:
          AB_LABEL: calibrated-argument-realization-axis
          AB_MODE: candidate
          AB_HEAD: 13ce7c7864274b67700bdacab5a9bd9a193f977e
          AB_OUTPUT: ../argument-realization-final-ab-current.json
        run: npx tsx scripts/.tmp-argument-realization-final-ab-probe.ts

      - name: Compare immutable outputs
        shell: bash
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path

          base = json.loads(Path('argument-realization-final-ab-base.json').read_text())
          current = json.loads(Path('argument-realization-final-ab-current.json').read_text())
          if base['sampleCount'] != 8192 or current['sampleCount'] != 8192:
              raise SystemExit('sample count drift')
          if base['seedNamespace'] != current['seedNamespace']:
              raise SystemExit('seed namespace mismatch')
          if base['bounds'] != current['bounds']:
              raise SystemExit('product bounds mismatch')

          def summarize(rows):
              roots = Counter()
              families = Counter()
              fallbacks = Counter()
              result = Counter()
              for row in rows:
                  for key in ('success', 'subject', 'object', 'any', 'both'):
                      result[key] += int(row[key])
                  if row['root'] is not None:
                      roots[row['root']] += 1
                  if row['family'] is not None:
                      families[row['family']] += 1
                  if row['fallback']:
                      for reason in row['fallback'].split('\0'):
                          fallbacks[reason] += 1
              return {
                  'sampleCount': len(rows),
                  **dict(result),
                  'subjectShare': result['subject'] / len(rows),
                  'objectShare': result['object'] / len(rows),
                  'anyShare': result['any'] / len(rows),
                  'bothShare': result['both'] / len(rows),
                  'roots': dict(sorted(roots.items())),
                  'families': dict(sorted(families.items())),
                  'fallbacks': dict(sorted(fallbacks.items())),
              }

          def tv(left, right, n):
              keys = set(left) | set(right)
              return sum(abs(left.get(k, 0) - right.get(k, 0)) for k in keys) / (2 * n)

          baseline = summarize(base['rows'])
          calibrated = summarize(current['rows'])
          n = base['sampleCount']
          counters = Counter()
          for before, after in zip(base['rows'], current['rows']):
              counters['successMismatch'] += before['success'] != after['success']
              for key in ('subject', 'object', 'any', 'both'):
                  if before[key] != after[key]:
                      counters[f'{key}Changed'] += 1
                      counters[f'{key}ToAbsent' if before[key] else f'absentTo{key.title()}'] += 1
              counters['rootChanged'] += before['root'] != after['root']
              counters['familyChanged'] += before['family'] != after['family']
              counters['fallbackChanged'] += before['fallback'] != after['fallback']
              counters['derivationChanged'] += before['derivation'] != after['derivation']
              counters['textChanged'] += before['text'] != after['text']
              counters['profilesChanged'] += before['profiles'] != after['profiles']

          report = {
              'schemaVersion': 'argument-realization-final-ab-v1',
              'sampleCount': n,
              'seedNamespace': base['seedNamespace'],
              'bounds': base['bounds'],
              'baselineHead': base['head'],
              'currentBehaviorHead': current['head'],
              'baselinePolicyVersion': base['policyVersion'],
              'baselineArgumentRealizationWeights': base['argumentRealizationPracticeWeights'],
              'currentPolicyVersion': current['policyVersion'],
              'currentArgumentRealizationWeights': current['argumentRealizationPracticeWeights'],
              'baseline': baseline,
              'calibrated': calibrated,
              'drift': {
                  'successDelta': calibrated['success'] - baseline['success'],
                  'subjectDelta': calibrated['subject'] - baseline['subject'],
                  'subjectShareDelta': calibrated['subjectShare'] - baseline['subjectShare'],
                  'objectDelta': calibrated['object'] - baseline['object'],
                  'objectShareDelta': calibrated['objectShare'] - baseline['objectShare'],
                  'anyDelta': calibrated['any'] - baseline['any'],
                  'bothDelta': calibrated['both'] - baseline['both'],
                  'rootTv': tv(baseline['roots'], calibrated['roots'], n),
                  'familyTv': tv(baseline['families'], calibrated['families'], n),
                  **dict(counters),
              },
          }

          pct = lambda x: f'{100*x:.3f}%'
          d = report['drift']
          md = '\n'.join([
              '# Argument realization final immutable A/B',
              '',
              f"- Production baseline: `{report['baselineHead']}` ({report['baselinePolicyVersion']})",
              f"- Calibrated behavior: `{report['currentBehaviorHead']}` ({report['currentPolicyVersion']})",
              f"- Seeds: **{n}** (`{report['seedNamespace']}`)",
              f"- Candidate weights: **{report['currentArgumentRealizationWeights']}**",
              f"- Subject surface: **{baseline['subject']}/{n} ({pct(baseline['subjectShare'])}) -> {calibrated['subject']}/{n} ({pct(calibrated['subjectShare'])})**, delta **{d['subjectDelta']} ({pct(d['subjectShareDelta'])})**",
              f"- Object surface: **{baseline['object']}/{n} ({pct(baseline['objectShare'])}) -> {calibrated['object']}/{n} ({pct(calibrated['objectShare'])})**, delta **{d['objectDelta']} ({pct(d['objectShareDelta'])})**",
              f"- Any omission surface: **{baseline['any']} -> {calibrated['any']}**, delta **{d['anyDelta']}**; both: **{baseline['both']} -> {calibrated['both']}**, delta **{d['bothDelta']}**",
              f"- Success: **{baseline['success']} -> {calibrated['success']}**, mismatch **{d.get('successMismatch', 0)}/{n}**",
              f"- Root TV: **{pct(d['rootTv'])}**; family TV: **{pct(d['familyTv'])}**",
              f"- Subject classification changed: **{d.get('subjectChanged', 0)}**; object classification changed: **{d.get('objectChanged', 0)}**",
              f"- Root changed: **{d.get('rootChanged', 0)}**; family changed: **{d.get('familyChanged', 0)}**",
              f"- Fallback changed: **{d.get('fallbackChanged', 0)}**",
              f"- Derivation changed: **{d.get('derivationChanged', 0)}**; text changed: **{d.get('textChanged', 0)}**; profiles changed: **{d.get('profilesChanged', 0)}**",
              '',
              'This compares two immutable checkouts with their own production composer, grammar, taxonomy, and policy. Subject/object omission here is a structural product-surface meter, not a corpus-frequency or grammar-legality claim.',
          ]) + '\n'

          Path('argument-realization-final-ab.json').write_text(json.dumps(report, indent=2, ensure_ascii=False) + '\n')
          Path('argument-realization-final-ab.md').write_text(md)
          print(md)

          if baseline['success'] != calibrated['success'] or d.get('successMismatch', 0) != 0:
              raise SystemExit('success regression in immutable A/B')
          PY

      - name: Publish summary
        if: always()
        run: |
          if [ -f argument-realization-final-ab.md ]; then
            cat argument-realization-final-ab.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload A-B artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: argument-realization-final-ab
          path: |
            argument-realization-final-ab.json
            argument-realization-final-ab.md
          if-no-files-found: error
