name: tmp predicate marking context audit 2048

on:
  push:
    branches:
      - agent/predicate-marking-context-audit-2048

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Preserve semantic audit tools
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin agent/predicate-marking-meter-audit
          mkdir -p "$RUNNER_TEMP/predicate-context-tools" "$RUNNER_TEMP/predicate-context-output"
          git show origin/agent/predicate-marking-meter-audit:scripts/tmp-predicate-marking-semantic-trace-patch.mjs > "$RUNNER_TEMP/predicate-context-tools/patch.mjs"
          git show origin/agent/predicate-marking-meter-audit:scripts/tmp-predicate-marking-semantic-audit.ts > "$RUNNER_TEMP/predicate-context-tools/audit.ts"
      - name: Measure 2048 context-constrained sweep
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/predicate-context-output"
          cp "$RUNNER_TEMP/predicate-context-tools/patch.mjs" scripts/tmp-predicate-marking-semantic-trace-patch.mjs
          cp "$RUNNER_TEMP/predicate-context-tools/audit.ts" scripts/tmp-predicate-marking-semantic-audit.ts
          node scripts/tmp-predicate-marking-semantic-trace-patch.mjs 2>"$OUT/patch.log"
          npm run app:catalog >"$OUT/catalog.log" 2>&1
          for weight in 0 0.03 0.0301 0.0303 0.031 0.032; do
            NEGATION_PRESENT_WEIGHT="$weight" SAMPLE_COUNT=2048 \
              npx tsx scripts/tmp-predicate-marking-semantic-audit.ts >"$OUT/sweep-${weight}.json"
          done
      - name: Build compact summary
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const out = process.env.RUNNER_TEMP + '/predicate-context-output';
          const rows = fs.readdirSync(out)
            .filter((name) => name.endsWith('.json'))
            .sort()
            .map((name) => {
              const value = JSON.parse(fs.readFileSync(path.join(out, name), 'utf8'));
              return {
                name,
                presentWeight: value.presentWeight,
                successCount: value.successCount,
                negativeCandidateCount: value.negativeCandidateCount,
                negativeShare: value.negativeShare,
                ticketNegationSuccessCount: value.ticketNegationSuccessCount,
                negativeOriginCounts: value.negativeOriginCounts,
                negativeRootCounts: value.negativeRootCounts,
                negativeFamilyCounts: value.negativeFamilyCounts,
                ticketRootCounts: value.ticketRootCounts,
                ticketFamilyCounts: value.ticketFamilyCounts,
                fallbackCounts: value.fallbackCounts,
                rootCounts: value.rootCounts,
                familyCounts: value.familyCounts,
              };
            });
          fs.writeFileSync(path.join(out, 'summary.json'), JSON.stringify(rows, null, 2));
          console.log(JSON.stringify(rows, null, 2));
          NODE
      - name: Upload audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: predicate-marking-context-audit-2048
          path: ${{ runner.temp }}/predicate-context-output
          if-no-files-found: error
