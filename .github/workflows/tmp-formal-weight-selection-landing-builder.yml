name: tmp formal weight selection landing builder

on:
  push:
    branches:
      - agent/tmp-formal-weight-selection-landing-builder

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Build patched source blob
        shell: bash
        run: |
          set -euo pipefail
          python scripts/tmp-formal-weight-selection-landing.py
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/curriculum/formal-syntax-utterance.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "perf(curriculum): collapse formal weighted selection passes"
          git push
