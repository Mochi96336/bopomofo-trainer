name: tmp lazy syntax-node id parity

on:
  push:
    branches:
      - agent/tmp-lazy-syntax-node-id-parity

permissions:
  contents: read

env:
  PRODUCTION_REF: 73f419d2c5ada5c3b366af25d0de27dbb860f6bf

jobs:
  parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Compare complete structural derivations
        shell: bash
        run: |
          set -euo pipefail
          cp scripts/tmp-lazy-syntax-node-id-parity.ts "$RUNNER_TEMP/snapshot.ts"

          npm ci --include=dev --ignore-scripts >/dev/null
          cp "$RUNNER_TEMP/snapshot.ts" .tmp-snapshot.ts
          node --import tsx .tmp-snapshot.ts > "$RUNNER_TEMP/candidate.jsonl" 2> "$RUNNER_TEMP/candidate.stderr"

          git checkout --force "$PRODUCTION_REF"
          git clean -fdx
          npm ci --include=dev --ignore-scripts >/dev/null
          cp "$RUNNER_TEMP/snapshot.ts" .tmp-snapshot.ts
          node --import tsx .tmp-snapshot.ts > "$RUNNER_TEMP/production.jsonl" 2> "$RUNNER_TEMP/production.stderr"

          cmp "$RUNNER_TEMP/production.jsonl" "$RUNNER_TEMP/candidate.jsonl"
          cmp "$RUNNER_TEMP/production.stderr" "$RUNNER_TEMP/candidate.stderr"
          cat "$RUNNER_TEMP/production.stderr"
          sha256sum "$RUNNER_TEMP/production.jsonl" "$RUNNER_TEMP/candidate.jsonl"
          echo "complete structural derivations are byte-identical"
