name: argument realization final namespace calibration

on:
  push:
    branches:
      - agent/argument-realization-axis-migration
    paths:
      - .github/workflows/argument-realization-final-namespace-calibration.yml

permissions:
  contents: read

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        scenario:
          - { name: center, s: '0.1120', o: '0.0865' }
          - { name: s-low, s: '0.1100', o: '0.0865' }
          - { name: s-high, s: '0.1140', o: '0.0865' }
          - { name: o-low, s: '0.1120', o: '0.0845' }
          - { name: o-high, s: '0.1120', o: '0.0885' }
        shard: [0, 1, 2, 3]
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 13ce7c7864274b67700bdacab5a9bd9a193f977e
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm ci
      - name: Inject calibration weights
        env:
          S_WEIGHT: ${{ matrix.scenario.s }}
          O_WEIGHT: ${{ matrix.scenario.o }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          s=float(os.environ['S_WEIGHT']); o=float(os.environ['O_WEIGHT']); ordinary=1-s-o
          p=Path('src/curriculum/formal-syntax-sampling-policy.ts')
          text=p.read_text()
          needle='argumentRealizationPracticeWeights: { ordinary: 0.80495, subjectOmission: 0.1002, objectOmission: 0.09485 },'
          repl=f'argumentRealizationPracticeWeights: {{ ordinary: {ordinary:.5f}, subjectOmission: {s:.4f}, objectOmission: {o:.4f} }},'
          if text.count(needle)!=1: raise SystemExit('unexpected final policy literal')
          p.write_text(text.replace(needle,repl))
          print(repl)
          PY
      - run: npm run app:catalog
      - name: Expose audit-only structural root
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/curriculum/formal-syntax-utterance.ts'); text=p.read_text()
          needle='      syntaxProfileIds: realization.syntaxProfileIds,\n'
          if text.count(needle)!=1: raise SystemExit('unexpected candidate shape')
          p.write_text(text.replace(needle,needle+'      __auditStructuralRoot: shape.root,\n'))
          PY
      - name: Write calibration probe
        run: |
          cat > scripts/.tmp-argument-realization-final-calibration.ts <<'TS'
          import { writeFileSync } from "node:fs";
          import { PRACTICE_CATALOG, SYNTAX_PROFILES } from "../src/app/generated/catalog.js";
          import { PRODUCT_FORMAL_SYNTAX_SAMPLING_POLICY } from "../src/curriculum/formal-syntax-sampling-policy.js";
          import { composeFormalSyntaxUtterances } from "../src/curriculum/formal-syntax-utterance.js";
          import { createSeededRandom } from "../src/curriculum/random.js";
          import type { StructuralSyntaxNode } from "../src/syntax/derive.js";
          const shard=Number(process.env.CAL_SHARD); const start=shard*2048; const end=start+2048;
          const name=process.env.CAL_NAME!; const output=process.env.CAL_OUTPUT!;
          const bounds={maximumPhraseDepth:3,maximumClauseNesting:1,maximumClausesPerSentence:2,maximumCoordinationItems:2,maximumConsecutiveModifiers:2,maximumComplementsPerPredicate:1,maximumLexicalEntriesPerUtterance:6} as const;
          interface C { readonly __auditStructuralRoot?: StructuralSyntaxNode }
          function children(n:StructuralSyntaxNode){return n.children.filter((x):x is StructuralSyntaxNode=>x.kind==="syntax-node")}
          function visit(n:StructuralSyntaxNode,out:StructuralSyntaxNode[]){out.push(n); for(const c of children(n))visit(c,out)}
          function direct(n:StructuralSyntaxNode,c:string){return children(n).some(x=>x.category===c)}
          const core=new Set(["clause.intransitive","clause.transitive","clause.ditransitive"]); const obj=new Set(["clause.transitive","clause.ditransitive"]);
          let success=0,subject=0,object=0,any=0,both=0;
          for(let round=start;round<end;round++){
            const composition=composeFormalSyntaxUtterances({eligibleEntries:PRACTICE_CATALOG,profiles:SYNTAX_PROFILES,random:createSeededRandom(`argument-realization-final-ab-v1:${round}`),samplingMode:"product-family",samplingPolicy:PRODUCT_FORMAL_SYNTAX_SAMPLING_POLICY,minimumLexicalEntries:2,maximumCandidates:1,maximumAttempts:64,bounds});
            const candidate=(composition.candidates[0]??null) as C|null; if(candidate)success++;
            const nodes:StructuralSyntaxNode[]=[]; if(candidate?.__auditStructuralRoot)visit(candidate.__auditStructuralRoot,nodes);
            const s=nodes.some(n=>core.has(n.productionRuleId)&&!direct(n,"Subject"));
            const o=nodes.some(n=>obj.has(n.productionRuleId)&&direct(n,"Subject")&&!direct(n,"Object"));
            subject+=Number(s); object+=Number(o); any+=Number(s||o); both+=Number(s&&o);
          }
          writeFileSync(output,JSON.stringify({name,shard,start,end,weights:PRODUCT_FORMAL_SYNTAX_SAMPLING_POLICY.argumentRealizationPracticeWeights,success,subject,object,any,both})+'\n');
          TS
      - name: Run calibration shard
        env:
          CAL_NAME: ${{ matrix.scenario.name }}
          CAL_SHARD: ${{ matrix.shard }}
          CAL_OUTPUT: calibration-${{ matrix.scenario.name }}-${{ matrix.shard }}.json
        run: npx tsx scripts/.tmp-argument-realization-final-calibration.ts
      - uses: actions/upload-artifact@v4
        with:
          name: argument-realization-final-cal-${{ matrix.scenario.name }}-${{ matrix.shard }}
          path: calibration-${{ matrix.scenario.name }}-${{ matrix.shard }}.json
          if-no-files-found: error

  aggregate:
    needs: probe
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: argument-realization-final-cal-*
          path: artifacts
          merge-multiple: true
      - name: Aggregate five 8192-seed points
        run: |
          python - <<'PY'
          import json
          from collections import defaultdict
          from pathlib import Path
          target={'subject':924,'object':695,'any':1611,'both':8,'success':8192}
          grouped=defaultdict(list)
          for p in Path('artifacts').glob('calibration-*.json'):
              d=json.loads(p.read_text()); grouped[d['name']].append(d)
          out=[]
          for name,docs in sorted(grouped.items()):
              docs=sorted(docs,key=lambda x:x['shard'])
              if [d['shard'] for d in docs] != [0,1,2,3]: raise SystemExit(f'{name}: incomplete shards')
              row={'name':name,'weights':docs[0]['weights']}
              for k in ('success','subject','object','any','both'): row[k]=sum(d[k] for d in docs)
              row['errorL1']=abs(row['subject']-target['subject'])+abs(row['object']-target['object'])
              out.append(row)
          out.sort(key=lambda r:(r['errorL1'],abs(r['any']-target['any']),r['name']))
          report={'target':target,'points':out}
          Path('argument-realization-final-namespace-calibration.json').write_text(json.dumps(report,indent=2)+'\n')
          for r in out: print(r)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: argument-realization-final-namespace-calibration
          path: argument-realization-final-namespace-calibration.json
          if-no-files-found: error
