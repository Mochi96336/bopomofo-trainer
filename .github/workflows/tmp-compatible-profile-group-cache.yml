name: tmp compatible profile group cache

on:
  push:
    branches:
      - agent/cache-compatible-profile-groups

permissions:
  contents: write

jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: agent/cache-compatible-profile-groups
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Apply narrow runtime and regression-test patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          source_path = Path('src/curriculum/formal-syntax-utterance.ts')
          source = source_path.read_text()
          anchor = '''function selectCompatibleProfile(
          '''
          helper = '''interface CompatibleProfileGroup {
            readonly entryId: string;
            readonly profiles: readonly RuntimeSyntaxProfile[];
          }

          const compatibleProfileGroupsCache = new WeakMap<
            readonly RuntimeSyntaxProfile[],
            readonly CompatibleProfileGroup[]
          >();

          function groupedCompatibleProfiles(
            compatible: readonly RuntimeSyntaxProfile[],
          ): readonly CompatibleProfileGroup[] {
            const cached = compatibleProfileGroupsCache.get(compatible);
            if (cached !== undefined) return cached;
            const profilesByEntryId = new Map<string, RuntimeSyntaxProfile[]>();
            for (const profile of compatible) {
              const profiles = profilesByEntryId.get(profile.entryId) ?? [];
              profiles.push(profile);
              profilesByEntryId.set(profile.entryId, profiles);
            }
            const groups = [...profilesByEntryId].map(([entryId, profiles]) => ({
              entryId,
              profiles,
            }));
            compatibleProfileGroupsCache.set(compatible, groups);
            return groups;
          }

          function selectCompatibleProfile(
          '''
          if source.count(anchor) != 1:
            raise SystemExit(f'selectCompatibleProfile anchor count {source.count(anchor)}')
          source = source.replace(anchor, helper)

          old = '''  const profilesByEntryId = new Map<string, RuntimeSyntaxProfile[]>();
            for (const profile of compatible) {
              if (usedEntryIds.has(profile.entryId) && profile.entryId !== reusableEntryId) continue;
              const profiles = profilesByEntryId.get(profile.entryId) ?? [];
              profiles.push(profile);
              profilesByEntryId.set(profile.entryId, profiles);
            }
            const entryIds = [...profilesByEntryId.keys()];
            const selectedEntryIndex = weightedIndex(entryIds.map((entryId) => {
              const entry = entriesById.get(entryId);
              if (entry === undefined) throw new Error(`formal syntax profile references missing entry ${entryId}`);
              const baseWeight = entryWeight?.(entry)
                ?? entryWeightsById?.[entry.id]
                ?? defaultEntryWeight(entry);
              if (previousEntry === null || lexicalCompatibility === undefined) return baseWeight;
              const score = surfaceCompatibilityScore(
                lexicalCompatibility,
                previousEntry.prompt.text,
                entry.prompt.text,
              );
              return baseWeight * lexicalCompatibilityMultiplier(
                score,
                lexicalCompatibilityMaximumBoost,
              );
            }), random);
            if (selectedEntryIndex === null) return null;
            const selectedEntryId = entryIds[selectedEntryIndex];
            if (selectedEntryId === undefined) throw new Error("formal syntax entry selection failed");
            const entryProfiles = profilesByEntryId.get(selectedEntryId) ?? [];
            if (entryProfiles.length === 0) throw new Error("formal syntax profile group is empty");
          '''
          new = '''  const eligibleGroups = groupedCompatibleProfiles(compatible).filter((group) =>
            !usedEntryIds.has(group.entryId) || group.entryId === reusableEntryId
          );
            const selectedEntryIndex = weightedIndex(eligibleGroups.map((group) => {
              const entry = entriesById.get(group.entryId);
              if (entry === undefined) {
                throw new Error(`formal syntax profile references missing entry ${group.entryId}`);
              }
              const baseWeight = entryWeight?.(entry)
                ?? entryWeightsById?.[entry.id]
                ?? defaultEntryWeight(entry);
              if (previousEntry === null || lexicalCompatibility === undefined) return baseWeight;
              const score = surfaceCompatibilityScore(
                lexicalCompatibility,
                previousEntry.prompt.text,
                entry.prompt.text,
              );
              return baseWeight * lexicalCompatibilityMultiplier(
                score,
                lexicalCompatibilityMaximumBoost,
              );
            }), random);
            if (selectedEntryIndex === null) return null;
            const selectedGroup = eligibleGroups[selectedEntryIndex];
            if (selectedGroup === undefined) throw new Error("formal syntax entry selection failed");
            const entryProfiles = selectedGroup.profiles;
            if (entryProfiles.length === 0) throw new Error("formal syntax profile group is empty");
          '''
          if source.count(old) != 1:
            raise SystemExit(f'selectCompatibleProfile body count {source.count(old)}')
          source_path.write_text(source.replace(old, new))

          test_path = Path('tests/curriculum/formal-syntax-utterance.test.ts')
          test = test_path.read_text()
          test_anchor = '''  it("does not reuse one entry in multiple lexical slots", () => {
          '''
          test_case = '''  it("preserves interleaved profile grouping across prepared cache hits", () => {
            const first = entry("entry:cache-first", "甲", 0.9);
            const second = entry("entry:cache-second", "乙", 0.9);
            const eligibleEntries = [first, second] as const;
            const profiles = [
              profile("profile:cache-a-first", first.id),
              profile("profile:cache-b-second", second.id),
              profile("profile:cache-c-first", first.id),
            ] as const;
            const compose = (prepared?: ReturnType<typeof prepareFormalSyntaxLexicon>) =>
              composeFormalSyntaxUtterances({
                eligibleEntries,
                profiles,
                entryWeightsById: { [first.id]: 1, [second.id]: 0 },
                random: new SequenceRandom([0.73, 0.41, 0.89, 0.67, 0.23]),
                maximumCandidates: 1,
                maximumAttempts: 1,
                rules,
              }, prepared);
            const expected = compose();
            const prepared = prepareFormalSyntaxLexicon(eligibleEntries, profiles);
            expect(compose(prepared)).toEqual(expected);
            expect(compose(prepared)).toEqual(expected);
          });

          申it("does not reuse one entry in multiple lexical slots", () => {
          '''.replace('申it', '  it')
          if test.count(test_anchor) != 1:
            raise SystemExit(f'test anchor count {test.count(test_anchor)}')
          test_path.write_text(test.replace(test_anchor, test_case))
          PY
      - run: npm ci --include=dev --ignore-scripts
      - run: npm run typecheck
      - name: Targeted curriculum tests
        run: >-
          npx vitest run
          tests/curriculum/formal-syntax-utterance.test.ts
          tests/curriculum/frequency-first-utterance.test.ts
          tests/curriculum/selection-evidence-contract.test.ts
      - name: Commit staged code and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/curriculum/formal-syntax-utterance.ts tests/curriculum/formal-syntax-utterance.test.ts
          git commit -m 'perf(syntax): cache compatible profile groups'
          git rm .github/workflows/tmp-compatible-profile-group-cache.yml
          git commit -m 'chore: remove compatible-group staging workflow'
          git push origin HEAD:agent/cache-compatible-profile-groups
