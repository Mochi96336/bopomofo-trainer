name: tmp formal entry weight fast path

on:
  push:
    branches:
      - agent/formal-entry-weight-fast-path

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Apply binding-only numeric weight fast path
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('src/curriculum/frequency-first-utterance.ts')
          source = path.read_text()

          score_anchor = '''function scoreEntry(\n  entry: CatalogEntry,\n  input: FrequencyFirstScoringInput,\n): EntrySelectionScore {\n'''
          helper = '''function bindingOnlyFormalEntryTotalWeight(\n  entry: CatalogEntry,\n  input: FrequencyFirstScoringInput,\n): number {\n  const frequencyBase = catalogEntryFrequencyWeight(entry);\n  let expectedTokenBoost = 1;\n  for (const tokenId of scoringTokens([entry], input)) {\n    expectedTokenBoost = Math.max(\n      expectedTokenBoost,\n      expectedTokenTraceForToken(tokenId, input).boost,\n    );\n  }\n  const transitionBoost = 1;\n  const combinedLearnerBoost = Math.min(\n    input.policy.maximumCombinedLearnerBoost,\n    expectedTokenBoost * transitionBoost,\n  );\n  const recentEntryFactor = input.history.recentEntryIds.includes(entry.id)\n    ? input.policy.recentEntryPenalty\n    : 1;\n  return frequencyBase * combinedLearnerBoost * recentEntryFactor;\n}\n\n'''
          if source.count(score_anchor) != 1:
              raise SystemExit(f'score anchor count {source.count(score_anchor)}')
          source = source.replace(score_anchor, helper + score_anchor)

          old_generate = '''  const entryScores = new Map<string, EntrySelectionScore>();\n  const entryWeight = (entry: CatalogEntry): number => {\n    const existing = entryScores.get(entry.id);\n    if (existing !== undefined) return existing.totalWeight;\n    const score = scoreEntry(entry, input);\n    entryScores.set(entry.id, score);\n    return score.totalWeight;\n  };\n'''
          new_generate = '''  const entryWeights = new Map<string, number>();\n  const entryWeight = (entry: CatalogEntry): number => {\n    const existing = entryWeights.get(entry.id);\n    if (existing !== undefined) return existing;\n    const weight = input.profiles !== undefined && input.legacyTransitions === null\n      ? bindingOnlyFormalEntryTotalWeight(entry, input)\n      : scoreEntry(entry, input).totalWeight;\n    entryWeights.set(entry.id, weight);\n    return weight;\n  };\n'''
          if source.count(old_generate) != 1:
              raise SystemExit(f'generate anchor count {source.count(old_generate)}')
          path.write_text(source.replace(old_generate, new_generate))
          PY
      - run: npm ci --include=dev --ignore-scripts
      - run: npm run app:catalog
      - run: npm run typecheck
      - name: Targeted selector tests
        run: >-
          npx vitest run
          tests/curriculum/frequency-first-utterance.test.ts
          tests/curriculum/formal-syntax-utterance.test.ts
          tests/curriculum/selection-evidence-contract.test.ts
          tests/product/session.test.ts
      - name: Commit candidate and remove staging workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/tmp-formal-entry-weight-fast-path.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/curriculum/frequency-first-utterance.ts .github/workflows/tmp-formal-entry-weight-fast-path.yml
          git commit -m "perf(curriculum): score formal entry weights without trace allocation"
          git push origin HEAD:agent/formal-entry-weight-fast-path
