name: BA structural licensing audit

on:
  push:
    branches:
      - agent/ba-structural-licensing-audit
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci --include=dev --ignore-scripts
      - name: Build app catalog
        run: npm run app:catalog
      - name: Audit BA structural licensing v2
        run: npx tsx scripts/audit-ba-structural-licensing-v2.ts > /tmp/ba-structural-licensing-v2.json
      - name: Audit BA completion shapes
        run: npx tsx scripts/audit-ba-completion-shapes.ts | tee /tmp/ba-completion-shapes.json
      - name: Upload audit
        uses: actions/upload-artifact@v4
        with:
          name: ba-structural-licensing-audit-v3
          path: |
            /tmp/ba-structural-licensing-v2.json
            /tmp/ba-completion-shapes.json
          if-no-files-found: error
