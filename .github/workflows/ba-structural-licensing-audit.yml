name: BA structural licensing audit

on:
  push:
    branches:
      - agent/ba-structural-licensing-audit
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci --include=dev --ignore-scripts
      - name: Build app catalog
        run: npm run app:catalog
      - name: Typecheck prototype grammar
        run: npx tsc --noEmit
      - name: Test canonical BA two-path grammar
        run: npx vitest run tests/curriculum/formal-syntax-ba-canonical.test.ts --testTimeout=15000
      - name: Run fast regression suite
        run: npm run test:fast
      - name: Audit BA structural licensing v2
        run: npx tsx scripts/audit-ba-structural-licensing-v2.ts > /tmp/ba-structural-licensing-v2.json
      - name: Audit BA completion shapes
        run: npx tsx scripts/audit-ba-completion-shapes.ts > /tmp/ba-completion-shapes.json
      - name: Audit strict BA formal completion witness
        run: npx tsx scripts/audit-ba-formal-completion-witness.ts | tee /tmp/ba-formal-completion-witness.json
      - name: Upload audit
        uses: actions/upload-artifact@v4
        with:
          name: ba-structural-licensing-audit-v6
          path: |
            /tmp/ba-structural-licensing-v2.json
            /tmp/ba-completion-shapes.json
            /tmp/ba-formal-completion-witness.json
          if-no-files-found: error
