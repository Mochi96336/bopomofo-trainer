name: tmp composer cache code A/B

on:
  push:
    branches:
      - agent/tmp-composer-cache-code-ab

jobs:
  digest:
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: production
            ref: 68c01cc80cc0f954bfdfb223f5d07f2188097556
          - label: candidate
            ref: 6a63b87ee53899b7cbff338391172557594adbb6
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ matrix.ref }}
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci --include=dev --ignore-scripts
      - run: npm run app:catalog
      - name: Digest deterministic product outputs
        env:
          TARGET_LABEL: ${{ matrix.label }}
          TARGET_REF: ${{ matrix.ref }}
        shell: bash
        run: |
          cat > .tmp-composer-cache-code-ab.ts <<'EOF'
          import { performance } from "node:perf_hooks";
          import { PRACTICE_CATALOG, SYNTAX_PROFILES } from "./src/app/generated/catalog.js";
          import { stableRuntimeDigest } from "./src/core/stable-id.js";
          import { createSeededRandom } from "./src/curriculum/random.js";
          import { composeFormalSyntaxUtterances } from "./src/curriculum/formal-syntax-utterance.js";

          const SAMPLE_COUNT = 2048;
          const PRODUCT_BOUNDS = {
            maximumPhraseDepth: 3,
            maximumClauseNesting: 1,
            maximumClausesPerSentence: 2,
            maximumCoordinationItems: 2,
            maximumConsecutiveModifiers: 2,
            maximumComplementsPerPredicate: 1,
            maximumLexicalEntriesPerUtterance: 6,
          } as const;

          const outputs: object[] = [];
          let successCount = 0;
          const startedAt = performance.now();
          for (let round = 0; round < SAMPLE_COUNT; round += 1) {
            const composition = composeFormalSyntaxUtterances({
              eligibleEntries: PRACTICE_CATALOG,
              profiles: SYNTAX_PROFILES,
              minimumLexicalEntries: 2,
              maximumCandidates: 1,
              maximumAttempts: 64,
              bounds: PRODUCT_BOUNDS,
              samplingMode: "product-family",
              random: createSeededRandom(`valency-product-drift:${round}`),
            });
            const candidate = composition.candidates[0];
            if (candidate !== undefined) successCount += 1;
            outputs.push({
              candidate: candidate === undefined ? null : {
                id: candidate.id,
                text: candidate.text,
                root: candidate.syntaxRootRuleId ?? null,
                profileIds: candidate.syntaxProfileIds ?? [],
              },
              fallbackReasons: composition.fallbackReasons,
            });
          }
          const elapsedMs = performance.now() - startedAt;
          console.log(JSON.stringify({
            label: process.env.TARGET_LABEL,
            ref: process.env.TARGET_REF,
            sampleCount: SAMPLE_COUNT,
            successCount,
            outputDigest: stableRuntimeDigest(outputs),
            elapsedMs: Math.round(elapsedMs),
          }, null, 2));
          EOF
          npx tsx .tmp-composer-cache-code-ab.ts
