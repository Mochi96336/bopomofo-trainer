name: tmp requirements local fast path validation

on:
  push:
    branches:
      - agent/tmp-composer-cache-code-ab

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TARGET_REF: b02213aaf32147753ebcec733e32a31158b50df9
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Checkout candidate
        run: git checkout --force "$TARGET_REF"
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci --include=dev --ignore-scripts
      - run: npm run app:catalog
      - run: npm run typecheck
      - name: Targeted requirements and product composer tests
        run: >-
          npx vitest run
          tests/syntax/requirements.test.ts
          tests/curriculum/formal-syntax-utterance.test.ts
          tests/curriculum/frequency-first-utterance.test.ts
          tests/product/session.test.ts
