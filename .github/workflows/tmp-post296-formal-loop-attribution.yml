name: tmp post-296 formal loop attribution

on:
  push:
    branches:
      - agent/tmp-post296-formal-loop-attribution

permissions:
  contents: read

jobs:
  attribution:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TARGET_REF: e40d43fad19fde32f3d6e1faad5213e2e22f5a41
      SAMPLE_COUNT: 256
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Patch exact production target
        shell: bash
        run: |
          set -euo pipefail
          cp scripts/tmp-post296-formal-loop-attribution.py "$RUNNER_TEMP/patch.py"
          git checkout --force "$TARGET_REF"
          git clean -fdx
          npm ci --include=dev --ignore-scripts
          npm run app:catalog
          python "$RUNNER_TEMP/patch.py"
          git diff --check
          npx tsc --noEmit
      - name: Measure production-shaped loop volume
        run: node --import tsx .tmp-post296-formal-loop-attribution.ts
