name: tmp valency product distribution audit

on:
  push:
    branches:
      - agent/tmp-valency-product-distribution-audit

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/tmp-valency-product-distribution-audit
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci --include=dev --ignore-scripts
      - run: npm run app:catalog
      - name: Compare baseline and revised product composition
        shell: bash
        run: |
          cat > .tmp-valency-product-distribution.ts <<'EOF'
          import {
            PRACTICE_CATALOG,
            SYNTAX_PROFILES,
          } from "./src/app/generated/catalog.js";
          import { createSeededRandom } from "./src/curriculum/random.js";
          import { composeFormalSyntaxUtterances } from "./src/curriculum/formal-syntax-utterance.js";
          import { sentenceConstructionClassification } from "./src/curriculum/formal-syntax-taxonomy.js";
          import type { RuntimeSyntaxProfile } from "./src/syntax/types.js";

          const SOURCE_COMMIT = "e0d85a020182e264d6384be2a59c0f4879a1cc35";
          const FILES = ["zh_gsd-ud-train.conllu", "zh_gsd-ud-dev.conllu", "zh_gsd-ud-test.conllu"] as const;
          const ALL_COMPLEMENTS = new Set(["obj", "iobj", "ccomp", "xcomp", "obl"]);
          const STRONG_COMPLEMENTS = new Set(["obj", "iobj", "ccomp", "xcomp"]);
          const OBJECTS = new Set(["obj", "iobj"]);
          const SAMPLE_COUNT = 2048;
          const PRODUCT_BOUNDS = {
            maximumPhraseDepth: 3,
            maximumClauseNesting: 1,
            maximumClausesPerSentence: 2,
            maximumCoordinationItems: 2,
            maximumConsecutiveModifiers: 2,
            maximumComplementsPerPredicate: 1,
            maximumLexicalEntriesPerUtterance: 6,
          } as const;

          interface Token { id: number; form: string; upos: string; head: number; deprel: string }
          interface Evidence {
            complementlessCount: number;
            strongComplementCount: number;
            objectBearingCount: number;
          }
          const key = (form: string, upos: string) => `${form}\u0000${upos}`;
          const base = (relation: string) => relation.split(":", 1)[0] ?? relation;
          const evidence = new Map<string, Evidence>();

          function flush(tokens: Token[]): void {
            if (tokens.length === 0) return;
            const children = new Map<number, Token[]>();
            for (const token of tokens) {
              const values = children.get(token.head) ?? [];
              values.push(token);
              children.set(token.head, values);
            }
            for (const token of tokens) {
              if (token.upos !== "VERB" && token.upos !== "AUX" && token.upos !== "ADJ") continue;
              const item = evidence.get(key(token.form, token.upos)) ?? {
                complementlessCount: 0,
                strongComplementCount: 0,
                objectBearingCount: 0,
              };
              let hasAny = false;
              let hasStrong = false;
              let hasObject = false;
              for (const child of children.get(token.id) ?? []) {
                const relation = base(child.deprel);
                if (!ALL_COMPLEMENTS.has(relation)) continue;
                hasAny = true;
                hasStrong ||= STRONG_COMPLEMENTS.has(relation);
                hasObject ||= OBJECTS.has(relation);
              }
              if (!hasAny) item.complementlessCount += 1;
              if (hasStrong) item.strongComplementCount += 1;
              if (hasObject) item.objectBearingCount += 1;
              evidence.set(key(token.form, token.upos), item);
            }
          }

          for (const filename of FILES) {
            const response = await fetch(`https://raw.githubusercontent.com/UniversalDependencies/UD_Chinese-GSD/${SOURCE_COMMIT}/${filename}`);
            if (!response.ok) throw new Error(`source fetch failed ${filename}: ${response.status}`);
            const source = await response.text();
            let sentence: Token[] = [];
            for (const line of source.split("\n")) {
              if (line.length === 0) {
                flush(sentence);
                sentence = [];
                continue;
              }
              if (line.startsWith("#")) continue;
              const cols = line.split("\t");
              if (cols.length !== 10 || !/^\d+$/u.test(cols[0] ?? "")) continue;
              sentence.push({
                id: Number(cols[0]),
                form: cols[1]!,
                upos: cols[3]!,
                head: Number(cols[6]),
                deprel: cols[7]!,
              });
            }
            flush(sentence);
          }

          const textByEntryId = new Map(PRACTICE_CATALOG.map((entry) => [entry.id, entry.prompt.text]));
          let changedProfileCount = 0;
          let removedIntransitiveCount = 0;
          let removedAmbitransitiveCount = 0;
          const revisedProfiles: RuntimeSyntaxProfile[] = SYNTAX_PROFILES.map((profile) => {
            const text = textByEntryId.get(profile.entryId);
            if (text === undefined) throw new Error(`missing entry for profile ${profile.id}`);
            const item = evidence.get(key(text, profile.upos));
            if (item === undefined || item.complementlessCount === 0 || item.strongComplementCount === 0) {
              return profile;
            }
            const removeIntransitive = profile.valencyFrames.includes("intransitive");
            const removeAmbitransitive = item.objectBearingCount > 0
              && profile.valencyFrames.includes("ambitransitive");
            if (!removeIntransitive && !removeAmbitransitive) return profile;
            changedProfileCount += 1;
            if (removeIntransitive) removedIntransitiveCount += 1;
            if (removeAmbitransitive) removedAmbitransitiveCount += 1;
            return {
              ...profile,
              valencyFrames: profile.valencyFrames.filter((frame) =>
                frame !== "intransitive" && !(removeAmbitransitive && frame === "ambitransitive")
              ),
            };
          });

          function increment(map: Map<string, number>, value: string): void {
            map.set(value, (map.get(value) ?? 0) + 1);
          }
          function sortedRecord(map: Map<string, number>): Record<string, number> {
            return Object.fromEntries([...map].sort(([left], [right]) => left.localeCompare(right)));
          }
          function family(rootRuleId: string | undefined): string {
            if (rootRuleId === undefined) return "<none>";
            return sentenceConstructionClassification(rootRuleId)?.family ?? `<unclassified:${rootRuleId}>`;
          }

          const baselineFamilies = new Map<string, number>();
          const revisedFamilies = new Map<string, number>();
          const baselineRoots = new Map<string, number>();
          const revisedRoots = new Map<string, number>();
          const baselineFallbacks = new Map<string, number>();
          const revisedFallbacks = new Map<string, number>();
          const changedRootPairs = new Map<string, number>();
          const changedExamples: object[] = [];
          let baselineSuccess = 0;
          let revisedSuccess = 0;
          let exactCandidateMatch = 0;
          let exactTextMatch = 0;
          let exactRootMatch = 0;
          let baselineOnlySuccess = 0;
          let revisedOnlySuccess = 0;
          let bothFailure = 0;
          let bothSuccessDifferentText = 0;
          let selectedAffectedProfileBaseline = 0;
          let selectedAffectedProfileRevised = 0;

          const affectedProfileIds = new Set(
            SYNTAX_PROFILES.filter((profile, index) => revisedProfiles[index] !== profile).map((profile) => profile.id),
          );

          for (let round = 0; round < SAMPLE_COUNT; round += 1) {
            const seed = `valency-product-drift:${round}`;
            const common = {
              eligibleEntries: PRACTICE_CATALOG,
              minimumLexicalEntries: 2,
              maximumCandidates: 1,
              maximumAttempts: 64,
              bounds: PRODUCT_BOUNDS,
              samplingMode: "product-family" as const,
            };
            const baseline = composeFormalSyntaxUtterances({
              ...common,
              profiles: SYNTAX_PROFILES,
              random: createSeededRandom(seed),
            });
            const revised = composeFormalSyntaxUtterances({
              ...common,
              profiles: revisedProfiles,
              random: createSeededRandom(seed),
            });
            for (const reason of baseline.fallbackReasons) increment(baselineFallbacks, reason);
            for (const reason of revised.fallbackReasons) increment(revisedFallbacks, reason);
            const left = baseline.candidates[0];
            const right = revised.candidates[0];
            if (left !== undefined) {
              baselineSuccess += 1;
              increment(baselineFamilies, family(left.syntaxRootRuleId));
              increment(baselineRoots, left.syntaxRootRuleId ?? "<none>");
              if (left.syntaxProfileIds.some((id) => affectedProfileIds.has(id))) selectedAffectedProfileBaseline += 1;
            }
            if (right !== undefined) {
              revisedSuccess += 1;
              increment(revisedFamilies, family(right.syntaxRootRuleId));
              increment(revisedRoots, right.syntaxRootRuleId ?? "<none>");
              if (right.syntaxProfileIds.some((id) => affectedProfileIds.has(id))) selectedAffectedProfileRevised += 1;
            }
            if (left === undefined && right === undefined) {
              bothFailure += 1;
              continue;
            }
            if (left !== undefined && right === undefined) {
              baselineOnlySuccess += 1;
            } else if (left === undefined && right !== undefined) {
              revisedOnlySuccess += 1;
            } else if (left !== undefined && right !== undefined) {
              if (left.id === right.id) exactCandidateMatch += 1;
              if (left.text === right.text) exactTextMatch += 1;
              if (left.syntaxRootRuleId === right.syntaxRootRuleId) exactRootMatch += 1;
              else increment(changedRootPairs, `${left.syntaxRootRuleId ?? "<none>"} -> ${right.syntaxRootRuleId ?? "<none>"}`);
              if (left.text !== right.text) bothSuccessDifferentText += 1;
            }
            if ((left?.id ?? null) !== (right?.id ?? null) && changedExamples.length < 40) {
              changedExamples.push({
                round,
                seed,
                baseline: left === undefined ? null : {
                  text: left.text,
                  root: left.syntaxRootRuleId,
                  family: family(left.syntaxRootRuleId),
                  affectedProfiles: left.syntaxProfileIds.filter((id) => affectedProfileIds.has(id)),
                },
                revised: right === undefined ? null : {
                  text: right.text,
                  root: right.syntaxRootRuleId,
                  family: family(right.syntaxRootRuleId),
                  affectedProfiles: right.syntaxProfileIds.filter((id) => affectedProfileIds.has(id)),
                },
                baselineFallbacks: baseline.fallbackReasons,
                revisedFallbacks: revised.fallbackReasons,
              });
            }
          }

          console.log(JSON.stringify({
            sourceCommit: SOURCE_COMMIT,
            sampleCount: SAMPLE_COUNT,
            runtimeProfileCount: SYNTAX_PROFILES.length,
            changedProfileCount,
            removedIntransitiveCount,
            removedAmbitransitiveCount,
            baselineSuccess,
            revisedSuccess,
            exactCandidateMatch,
            exactCandidateMatchShare: exactCandidateMatch / SAMPLE_COUNT,
            exactTextMatch,
            exactTextMatchShare: exactTextMatch / SAMPLE_COUNT,
            exactRootMatch,
            exactRootMatchShare: exactRootMatch / SAMPLE_COUNT,
            baselineOnlySuccess,
            revisedOnlySuccess,
            bothFailure,
            bothSuccessDifferentText,
            selectedAffectedProfileBaseline,
            selectedAffectedProfileRevised,
            baselineFamilies: sortedRecord(baselineFamilies),
            revisedFamilies: sortedRecord(revisedFamilies),
            baselineRoots: sortedRecord(baselineRoots),
            revisedRoots: sortedRecord(revisedRoots),
            changedRootPairs: sortedRecord(changedRootPairs),
            baselineFallbackReasons: sortedRecord(baselineFallbacks),
            revisedFallbackReasons: sortedRecord(revisedFallbacks),
            changedExamples,
          }, null, 2));
          EOF
          npx tsx .tmp-valency-product-distribution.ts
