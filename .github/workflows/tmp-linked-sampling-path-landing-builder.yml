name: tmp linked sampling path landing builder

on:
  push:
    branches:
      - agent/tmp-linked-sampling-path-landing-builder

permissions:
  contents: write

env:
  PRODUCTION_REF: 655c7f5b921c2cf91d5c10273c0e3e847f7db5b5
  TARGET_BRANCH: agent/perf-linked-sampling-path

jobs:
  build-clean-landing:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Build exact one-file landing commit
        shell: bash
        run: |
          set -euo pipefail
          cp scripts/tmp-linked-sampling-path.py "$RUNNER_TEMP/patch.py"
          git checkout --force "$PRODUCTION_REF"
          git clean -fdx
          python "$RUNNER_TEMP/patch.py"
          git diff --check
          test "$(git diff --name-only | tr -d '\r')" = "src/syntax/sample.ts"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/syntax/sample.ts
          git commit -m "perf(syntax): defer sampling-path materialization"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH" --force
