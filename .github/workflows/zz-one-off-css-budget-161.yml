name: one-off compact #161 CSS under existing budget

on:
  push:
    branches:
      - agent/analysis-v2-immediate-token-history

permissions:
  contents: write

jobs:
  compact:
    if: ${{ github.event.before == '43006acc135d2e4139211e34c859281440c43810' && contains(github.event.head_commit.message, '[retry2-css-compact-161]') }}
    runs-on: ubuntu-latest
    env:
      PARENT_SHA: 79fe520e8821f0df5530d17c623d691e44c7a812
      PARENT_BRANCH: agent/analysis-v2-strategy-permutations-v2
      CHILD_BRANCH: agent/analysis-v2-immediate-token-history
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/analysis-v2-immediate-token-history
          fetch-depth: 0

      - name: Guard locked stack heads
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "+refs/heads/${PARENT_BRANCH}:refs/remotes/origin/${PARENT_BRANCH}"
          git fetch origin "+refs/heads/${CHILD_BRANCH}:refs/remotes/origin/${CHILD_BRANCH}"
          test "$(git rev-parse "refs/remotes/origin/${PARENT_BRANCH}")" = "${PARENT_SHA}"
          test "$(git rev-parse "refs/remotes/origin/${CHILD_BRANCH}")" = "${GITHUB_SHA}"

      - name: Compact equivalent and dead CSS
        shell: bash
        run: |
          set -euo pipefail
          python scripts/zz_one_off_css_compact_161_v2.py
          git diff --check

      - name: Prove existing bundle budget
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build
          npm run size:check

      - name: Prove geometry contracts
        shell: bash
        run: |
          set -euo pipefail
          npx playwright install --with-deps chromium
          npx playwright test \
            tests/browser/analysis-v2-frame-width.browser.ts \
            tests/browser/analysis-v2-viewport-composition.browser.ts

      - name: Commit compact CSS and remove one-off files
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/zz-one-off-css-budget-161.yml
          rm scripts/zz_one_off_css_compact_161.py
          rm scripts/zz_one_off_css_compact_161_v2.py
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'refactor: retire dead Analysis CSS and compact viewport rules'
          git push origin "HEAD:${CHILD_BRANCH}"
