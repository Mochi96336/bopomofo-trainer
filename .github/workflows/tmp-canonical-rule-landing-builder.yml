name: tmp canonical rule landing builder

on:
  push:
    branches:
      - agent/tmp-canonical-rule-landing-builder

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Build patched source blob
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path("src/curriculum/formal-syntax-utterance.ts")
          text = path.read_text()
          old = '''function sameCanonicalRuleSet(
            rules: readonly ProductionRule[],
            canonicalRules: readonly ProductionRule[],
          ): boolean {
            if (rules.length !== canonicalRules.length) return false;
          '''
          new = '''function sameCanonicalRuleSet(
            rules: readonly ProductionRule[],
            canonicalRules: readonly ProductionRule[],
          ): boolean {
            if (rules === canonicalRules) return true;
            if (rules.length !== canonicalRules.length) return false;
          '''
          if old not in text:
              if "if (rules === canonicalRules) return true;" in text:
                  raise SystemExit(0)
              raise SystemExit("sameCanonicalRuleSet anchor missing")
          path.write_text(text.replace(old, new, 1))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/curriculum/formal-syntax-utterance.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "perf(curriculum): fast-path canonical rule identity"
          git push
