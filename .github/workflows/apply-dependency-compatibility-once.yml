name: apply dependency compatibility plumbing once

on:
  push:
    branches:
      - agent/formal-syntax-v2-dependency-compatibility-scoring

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/formal-syntax-v2-dependency-compatibility-scoring
      - name: Apply exact composer compatibility patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/curriculum/formal-syntax-utterance.ts')
          source = path.read_text()
          replacements = [
              (
                  'import type { StructuralLexicalSlot } from "../syntax/derive.js";\nimport { FORMAL_SYNTAX_RULES } from "../syntax/grammar.js";',
                  'import type { StructuralLexicalSlot } from "../syntax/derive.js";\nimport {\n  collectStructuralCompatibilityEdges,\n  type StructuralCompatibilityEdge,\n} from "../syntax/compatibility-edges.js";\nimport { FORMAL_SYNTAX_RULES } from "../syntax/grammar.js";',
              ),
              (
                  'import {\n  chooseSentenceConstructionVariant,',
                  'import { structuralDependencyCompatibilityMultiplier } from "./formal-syntax-dependency-compatibility.js";\nimport {\n  chooseSentenceConstructionVariant,',
              ),
              (
                  '  previousEntry: CatalogEntry | null,\n  lexicalCompatibility: LexicalCompatibilityIndex | undefined,\n  lexicalCompatibilityMaximumBoost: number,\n  random: RandomSource,\n): RuntimeSyntaxProfile | null {',
                  '  previousEntry: CatalogEntry | null,\n  lexicalCompatibility: LexicalCompatibilityIndex | undefined,\n  lexicalCompatibilityMaximumBoost: number,\n  currentSlotId: string,\n  selectedEntriesBySlotId: ReadonlyMap<string, CatalogEntry>,\n  compatibilityEdges: readonly StructuralCompatibilityEdge[],\n  random: RandomSource,\n): RuntimeSyntaxProfile | null {',
              ),
              (
                  '    const baseWeight = entryWeightsById?.[entry.id] ?? defaultEntryWeight(entry);\n    if (previousEntry === null || lexicalCompatibility === undefined) return baseWeight;\n    const score = surfaceCompatibilityScore(\n      lexicalCompatibility,\n      previousEntry.prompt.text,\n      entry.prompt.text,\n    );\n    return baseWeight * lexicalCompatibilityMultiplier(\n      score,\n      lexicalCompatibilityMaximumBoost,\n    );',
                  '    const baseWeight = entryWeightsById?.[entry.id] ?? defaultEntryWeight(entry);\n    const surfaceMultiplier = previousEntry === null || lexicalCompatibility === undefined\n      ? 1\n      : lexicalCompatibilityMultiplier(\n          surfaceCompatibilityScore(\n            lexicalCompatibility,\n            previousEntry.prompt.text,\n            entry.prompt.text,\n          ),\n          lexicalCompatibilityMaximumBoost,\n        );\n    const dependencyMultiplier = structuralDependencyCompatibilityMultiplier(\n      lexicalCompatibility,\n      entry,\n      { currentSlotId, selectedEntriesBySlotId, edges: compatibilityEdges },\n      lexicalCompatibilityMaximumBoost,\n    );\n    return baseWeight * surfaceMultiplier * dependencyMultiplier;',
              ),
              (
                  '    const offsets: Record<string, number> = {};\n    const usedEntryIds = new Set<string>();',
                  '    const offsets: Record<string, number> = {};\n    const compatibilityEdges = collectStructuralCompatibilityEdges(shape);\n    const selectedEntriesBySlotId = new Map<string, CatalogEntry>();\n    const usedEntryIds = new Set<string>();',
              ),
              (
                  '        previousEntry,\n        input.lexicalCompatibility,\n        compatibilityMaximumBoost,\n        input.random,\n      );',
                  '        previousEntry,\n        input.lexicalCompatibility,\n        compatibilityMaximumBoost,\n        slot.id,\n        selectedEntriesBySlotId,\n        compatibilityEdges,\n        input.random,\n      );',
              ),
              (
                  '      offsets[slot.id] = selectedIndex;\n      usedEntryIds.add(selectedProfile.entryId);\n      previousEntry = selectedEntry;',
                  '      offsets[slot.id] = selectedIndex;\n      selectedEntriesBySlotId.set(slot.id, selectedEntry);\n      usedEntryIds.add(selectedProfile.entryId);\n      previousEntry = selectedEntry;',
              ),
          ]
          for old, new in replacements:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one replacement target, got {count}: {old[:100]!r}')
              source = source.replace(old, new)
          path.write_text(source)
          PY
          git diff --check
      - name: Commit source patch and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/apply-dependency-compatibility-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/curriculum/formal-syntax-utterance.ts .github/workflows/apply-dependency-compatibility-once.yml
          git commit -m "feat(curriculum): apply structural dependency compatibility"
          git push origin HEAD:agent/formal-syntax-v2-dependency-compatibility-scoring
