name: capture causative reachability once

on:
  push:
    branches:
      - agent/formal-syntax-v2-causative-runtime-reachability

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci --include=dev --ignore-scripts
      - name: Capture reachability summary
        run: npx tsx scripts/audit-active-causative-reachability.ts > causative-runtime-reachability.json
      - name: Upload reachability summary
        uses: actions/upload-artifact@v4
        with:
          name: causative-runtime-reachability-summary
          path: causative-runtime-reachability.json
