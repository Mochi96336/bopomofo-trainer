name: tmp prepared entry scoring patch

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Apply prepared entry scoring patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one replacement, found {count}: {old[:100]!r}")
              file.write_text(text.replace(old, new, 1))

          frequency = "src/curriculum/frequency-first-utterance.ts"
          replace_once(
              frequency,
              '''export type FormalSyntaxCompositionOverride = Pick<\n  FormalSyntaxUtteranceInput,\n  "rules" | "samplingMode" | "structuralTarget"\n>;\n\nexport interface FrequencyFirstUtteranceInput {''',
              '''export type FormalSyntaxCompositionOverride = Pick<\n  FormalSyntaxUtteranceInput,\n  "rules" | "samplingMode" | "structuralTarget"\n>;\n\n/** Immutable entry projections reusable while the catalog entry array stays unchanged. */\nexport interface PreparedFrequencyFirstEntries {\n  readonly entries: readonly CatalogEntry[];\n  readonly entriesById: ReadonlyMap<string, CatalogEntry>;\n  readonly tokenIdsByEntryId: ReadonlyMap<string, readonly TokenId[]>;\n}\n\nexport interface FrequencyFirstUtteranceInput {''',
          )
          replace_once(
              frequency,
              '''  readonly profiles: readonly RuntimeSyntaxProfile[];\n  readonly preparedFormalSyntaxLexicon?: PreparedFormalSyntaxLexicon;\n};''',
              '''  readonly profiles: readonly RuntimeSyntaxProfile[];\n  readonly preparedFormalSyntaxLexicon?: PreparedFormalSyntaxLexicon;\n  readonly preparedFrequencyFirstEntries?: PreparedFrequencyFirstEntries;\n};''',
          )
          replace_once(
              frequency,
              '''  readonly legacyTransitions: MeasurementSummary["transitions"] | null;\n  readonly preparedFormalSyntaxLexicon?: PreparedFormalSyntaxLexicon;\n};''',
              '''  readonly legacyTransitions: MeasurementSummary["transitions"] | null;\n  readonly preparedFormalSyntaxLexicon?: PreparedFormalSyntaxLexicon;\n  readonly preparedFrequencyFirstEntries?: PreparedFrequencyFirstEntries;\n};''',
          )
          replace_once(
              frequency,
              '''function uniqueTokens(entries: readonly CatalogEntry[]): readonly TokenId[] {\n  return [...new Set(\n    entries.flatMap((entry) =>\n      entry.syllables.flatMap((syllable) => syllable.tokens),\n    ),\n  )].sort(compareText);\n}\n\nfunction scopedBindingEvidence(''',
              '''function uniqueTokens(entries: readonly CatalogEntry[]): readonly TokenId[] {\n  return [...new Set(\n    entries.flatMap((entry) =>\n      entry.syllables.flatMap((syllable) => syllable.tokens),\n    ),\n  )].sort(compareText);\n}\n\nexport function prepareFrequencyFirstEntries(\n  entries: readonly CatalogEntry[],\n): PreparedFrequencyFirstEntries {\n  return {\n    entries,\n    entriesById: new Map(entries.map((entry) => [entry.id, entry])),\n    tokenIdsByEntryId: new Map(entries.map((entry) => [entry.id, uniqueTokens([entry])])),\n  };\n}\n\nfunction scoringTokens(\n  entries: readonly CatalogEntry[],\n  input: FrequencyFirstScoringInput,\n): readonly TokenId[] {\n  const prepared = input.preparedFrequencyFirstEntries;\n  if (prepared === undefined) return uniqueTokens(entries);\n  if (entries.length === 1) {\n    const tokens = prepared.tokenIdsByEntryId.get(entries[0]!.id);\n    if (tokens === undefined) throw new Error(`prepared frequency-first entry disappeared: ${entries[0]!.id}`);\n    return tokens;\n  }\n  const tokens = new Set<TokenId>();\n  for (const entry of entries) {\n    const entryTokens = prepared.tokenIdsByEntryId.get(entry.id);\n    if (entryTokens === undefined) throw new Error(`prepared frequency-first entry disappeared: ${entry.id}`);\n    for (const token of entryTokens) tokens.add(token);\n  }\n  return [...tokens].sort(compareText);\n}\n\nfunction scopedBindingEvidence(''',
          )
          replace_once(
              frequency,
              '''  return uniqueTokens(entries).map((tokenId) => {''',
              '''  return scoringTokens(entries, input).map((tokenId) => {''',
          )
          replace_once(
              frequency,
              '''  validateFrequencyFirstUtterancePolicy(input.policy);\n  const eligibleEntries = input.entries;\n  const entriesById = new Map(eligibleEntries.map((entry) => [entry.id, entry]));''',
              '''  validateFrequencyFirstUtterancePolicy(input.policy);\n  const eligibleEntries = input.entries;\n  const preparedEntries = input.preparedFrequencyFirstEntries;\n  if (preparedEntries !== undefined && preparedEntries.entries !== eligibleEntries) {\n    throw new Error("prepared frequency-first entries input identity mismatch");\n  }\n  const entriesById = preparedEntries?.entriesById\n    ?? new Map(eligibleEntries.map((entry) => [entry.id, entry]));''',
          )

          types = "src/product/types.ts"
          replace_once(
              types,
              '''  FrequencyFirstSelectionState,\n  FrequencyFirstUtterancePolicy,\n  FrequencyFirstUtteranceSelection,\n} from "../curriculum/frequency-first-utterance.js";''',
              '''  FrequencyFirstSelectionState,\n  FrequencyFirstUtterancePolicy,\n  FrequencyFirstUtteranceSelection,\n  PreparedFrequencyFirstEntries,\n} from "../curriculum/frequency-first-utterance.js";''',
          )
          replace_once(
              types,
              '''  readonly utterancePolicy: FrequencyFirstUtterancePolicy;\n  readonly preparedPracticeLexicon: PreparedFormalSyntaxLexicon;\n}''',
              '''  readonly utterancePolicy: FrequencyFirstUtterancePolicy;\n  readonly preparedPracticeLexicon: PreparedFormalSyntaxLexicon;\n  readonly preparedPracticeEntries: PreparedFrequencyFirstEntries;\n}''',
          )

          session = "src/product/session.ts"
          replace_once(
              session,
              '''  FREQUENCY_FIRST_UTTERANCE_POLICY,\n  selectFormalSyntaxUtterance,''',
              '''  FREQUENCY_FIRST_UTTERANCE_POLICY,\n  prepareFrequencyFirstEntries,\n  selectFormalSyntaxUtterance,''',
          )
          replace_once(
              session,
              '''    preparedPracticeLexicon: prepareFormalSyntaxLexicon(\n      catalogs.practice,\n      catalogs.syntaxProfiles,\n    ),\n  };''',
              '''    preparedPracticeLexicon: prepareFormalSyntaxLexicon(\n      catalogs.practice,\n      catalogs.syntaxProfiles,\n    ),\n    preparedPracticeEntries: prepareFrequencyFirstEntries(catalogs.practice),\n  };''',
          )
          replace_once(
              session,
              '''    preparedFormalSyntaxLexicon: environment.preparedPracticeLexicon,\n    random: createSeededRandom(''',
              '''    preparedFormalSyntaxLexicon: environment.preparedPracticeLexicon,\n    preparedFrequencyFirstEntries: environment.preparedPracticeEntries,\n    random: createSeededRandom(''',
          )

          test = "tests/curriculum/selection-evidence-contract.test.ts"
          replace_once(
              test,
              '''  FREQUENCY_FIRST_UTTERANCE_POLICY,\n  selectFormalSyntaxUtterance,''',
              '''  FREQUENCY_FIRST_UTTERANCE_POLICY,\n  prepareFrequencyFirstEntries,\n  selectFormalSyntaxUtterance,''',
          )
          test_path = Path(test)
          text = test_path.read_text()
          addition = '''\n\ndescribe("prepared frequency-first entries", () => {\n  it("preserves production selection and fails closed on catalog identity mismatch", () => {\n    const { v2 } = evidencePair();\n    const prepared = prepareFrequencyFirstEntries(PRACTICE);\n    const select = (entries: typeof PRACTICE, preparedEntries = prepared) =>\n      selectFormalSyntaxUtterance({\n        entries,\n        bindingEvidence: Object.values(v2.semantic.bindings),\n        mode,\n        layoutId,\n        history,\n        policy: FREQUENCY_FIRST_UTTERANCE_POLICY,\n        random: createSeededRandom("prepared-frequency-first-entries"),\n        profiles: SYNTAX_PROFILES,\n        preparedFrequencyFirstEntries: preparedEntries,\n      });\n\n    const raw = selectFormalSyntaxUtterance({\n      entries: PRACTICE,\n      bindingEvidence: Object.values(v2.semantic.bindings),\n      mode,\n      layoutId,\n      history,\n      policy: FREQUENCY_FIRST_UTTERANCE_POLICY,\n      random: createSeededRandom("prepared-frequency-first-entries"),\n      profiles: SYNTAX_PROFILES,\n    });\n\n    expect(prepared.entries).toBe(PRACTICE);\n    expect(prepared.entriesById.size).toBe(PRACTICE.length);\n    expect(select(PRACTICE)).toEqual(raw);\n    expect(() => select([...PRACTICE] as typeof PRACTICE)).toThrow(\n      /prepared frequency-first entries input identity mismatch/u,\n    );\n  });\n});\n'''
          if 'describe("prepared frequency-first entries"' in text:
              raise SystemExit("prepared frequency-first entries test already present")
          test_path.write_text(text.rstrip() + addition)
          PY
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Targeted tests
        run: npx vitest run tests/curriculum/selection-evidence-contract.test.ts tests/product/session.test.ts --testTimeout=15000
      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/tmp-prepared-entry-scoring-patch.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/curriculum/frequency-first-utterance.ts src/product/types.ts src/product/session.ts tests/curriculum/selection-evidence-contract.test.ts .github/workflows/tmp-prepared-entry-scoring-patch.yml
          git commit -m "perf(product): reuse prepared entry scoring projections"
          git push origin HEAD:agent/product-prepared-entry-scoring
