name: tmp build predicate marking practice ticket v5

on:
  push:
    branches:
      - agent/predicate-marking-practice-ticket

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Build and exercise bounded marking-ticket search
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/tmp-build-predicate-marking-ticket-v4.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(workflow) if "python - <<'PY'" in line)
          end = next(i for i in range(start + 1, len(workflow)) if workflow[i].strip() == 'PY')
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in workflow[start + 1:end])
          exec(compile(script, 'bounded-ticket-patch.py', 'exec'))
          PY
          npm ci --include=dev --ignore-scripts
          npm run typecheck
          npx vitest run tests/curriculum/predicate-marking-practice-ticket.test.ts tests/curriculum/formal-syntax-sampling-policy.test.ts tests/curriculum/formal-syntax-effective-distribution.test.ts --testTimeout=30000
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/curriculum/formal-syntax-sampling-policy.ts src/curriculum/formal-syntax-utterance.ts src/syntax/sample.ts tests/curriculum/predicate-marking-practice-ticket.test.ts
          git commit -m 'feat: add bounded predicate marking practice ticket [prototype]'
          git push origin HEAD:agent/predicate-marking-practice-ticket
