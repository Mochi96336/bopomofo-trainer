name: tmp prepared lexicon retry patch

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Apply narrow prepared-lexicon patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one replacement, found {count}: {old[:80]!r}")
              file.write_text(text.replace(old, new, 1))

          formal = "src/curriculum/formal-syntax-utterance.ts"
          replace_once(
              formal,
              '''import {\n  buildLexicalProfileIndex,\n  compatibleProfilesForSlot,\n  realizeStructuralDerivationWithIndex,\n} from "../syntax/realize.js";''',
              '''import {\n  buildLexicalProfileIndex,\n  compatibleProfilesForSlot,\n  realizeStructuralDerivationWithIndex,\n  type LexicalProfileIndex,\n} from "../syntax/realize.js";''',
          )
          replace_once(
              formal,
              '''  readonly structuralTarget?: FormalSyntaxStructuralTarget;\n}\n\nfunction nextUnit(random: RandomSource): number {''',
              '''  readonly structuralTarget?: FormalSyntaxStructuralTarget;\n}\n\n/** Immutable lexical preparation reusable while the entry/profile inputs stay unchanged. */\nexport interface PreparedFormalSyntaxLexicon {\n  readonly index: LexicalProfileIndex;\n}\n\nexport function prepareFormalSyntaxLexicon(\n  eligibleEntries: readonly CatalogEntry[],\n  profiles: readonly RuntimeSyntaxProfile[],\n): PreparedFormalSyntaxLexicon {\n  const eligibleEntryIds = new Set(eligibleEntries.map((entry) => entry.id));\n  const eligibleProfiles = profiles.filter((profile) => eligibleEntryIds.has(profile.entryId));\n  return {\n    index: buildLexicalProfileIndex(eligibleEntries, eligibleProfiles),\n  };\n}\n\nfunction nextUnit(random: RandomSource): number {''',
          )
          replace_once(
              formal,
              '''export function composeFormalSyntaxUtterances(\n  input: FormalSyntaxUtteranceInput,\n): GrammarCompositionResult {''',
              '''export function composeFormalSyntaxUtterances(\n  input: FormalSyntaxUtteranceInput,\n  preparedLexicon?: PreparedFormalSyntaxLexicon,\n): GrammarCompositionResult {''',
          )
          replace_once(
              formal,
              '''  const eligibleEntryIds = new Set(input.eligibleEntries.map((entry) => entry.id));\n  const eligibleProfiles = input.profiles.filter((profile) => eligibleEntryIds.has(profile.entryId));\n  const index = buildLexicalProfileIndex(input.eligibleEntries, eligibleProfiles);\n  const entriesById = new Map(input.eligibleEntries.map((entry) => [entry.id, entry]));''',
              '''  const index = (preparedLexicon\n    ?? prepareFormalSyntaxLexicon(input.eligibleEntries, input.profiles)).index;\n  const entriesById = index.entriesById;''',
          )

          frequency = "src/curriculum/frequency-first-utterance.ts"
          replace_once(
              frequency,
              '''import {\n  composeFormalSyntaxUtterances,\n  type FormalSyntaxUtteranceInput,\n} from "./formal-syntax-utterance.js";''',
              '''import {\n  composeFormalSyntaxUtterances,\n  prepareFormalSyntaxLexicon,\n  type FormalSyntaxUtteranceInput,\n  type PreparedFormalSyntaxLexicon,\n} from "./formal-syntax-utterance.js";''',
          )
          replace_once(
              frequency,
              '''function generateOnce(\n  eligibleEntries: readonly CatalogEntry[],\n  input: FrequencyFirstScoringInput,\n  maximumClauseNesting: number,\n): SlotWeightedGrammarGeneration {''',
              '''function generateOnce(\n  eligibleEntries: readonly CatalogEntry[],\n  input: FrequencyFirstScoringInput,\n  maximumClauseNesting: number,\n  preparedFormalSyntaxLexicon: PreparedFormalSyntaxLexicon | null,\n): SlotWeightedGrammarGeneration {''',
          )
          replace_once(
              frequency,
              '''  if (input.profiles !== undefined) {\n    const composition = composeFormalSyntaxUtterances({''',
              '''  if (input.profiles !== undefined) {\n    if (preparedFormalSyntaxLexicon === null) {\n      throw new Error("formal syntax profiles require prepared lexical context");\n    }\n    const composition = composeFormalSyntaxUtterances({''',
          )
          replace_once(
              frequency,
              '''      ...composerCompositionOverride(input),\n      bounds: formalSyntaxExecutionBounds(maximumClauseNesting),\n    });''',
              '''      ...composerCompositionOverride(input),\n      bounds: formalSyntaxExecutionBounds(maximumClauseNesting),\n    }, preparedFormalSyntaxLexicon);''',
          )
          replace_once(
              frequency,
              '''  const maximumClauseNesting = input.profiles === undefined\n    ? 1\n    : derivedConstructionClauseNesting(input);\n  let generation: SlotWeightedGrammarGeneration | null = null;''',
              '''  const maximumClauseNesting = input.profiles === undefined\n    ? 1\n    : derivedConstructionClauseNesting(input);\n  const preparedFormalSyntaxLexicon = input.profiles === undefined\n    ? null\n    : prepareFormalSyntaxLexicon(eligibleEntries, input.profiles);\n  let generation: SlotWeightedGrammarGeneration | null = null;''',
          )
          replace_once(
              frequency,
              '''    generation = generateOnce(eligibleEntries, input, maximumClauseNesting);''',
              '''    generation = generateOnce(\n      eligibleEntries,\n      input,\n      maximumClauseNesting,\n      preparedFormalSyntaxLexicon,\n    );''',
          )

          test = "tests/curriculum/formal-syntax-utterance.test.ts"
          replace_once(
              test,
              '''import { composeFormalSyntaxUtterances } from "../../src/curriculum/formal-syntax-utterance.js";''',
              '''import {\n  composeFormalSyntaxUtterances,\n  prepareFormalSyntaxLexicon,\n} from "../../src/curriculum/formal-syntax-utterance.js";''',
          )
          test_path = Path(test)
          text = test_path.read_text()
          addition = '''\n\ndescribe("prepared formal syntax lexicon", () => {\n  it("matches raw composition while reusing the prepared lexical frontier", () => {\n    const eligible = entry("entry:prepared-eligible", "甲", 1);\n    const excluded = entry("entry:prepared-excluded", "乙", 1);\n    const entries = [eligible];\n    const profiles = [\n      profile("profile:prepared-eligible", eligible.id),\n      profile("profile:prepared-excluded", excluded.id),\n    ];\n    const prepared = prepareFormalSyntaxLexicon(entries, profiles);\n    const compose = (random: RandomSource) => ({\n      eligibleEntries: entries,\n      profiles,\n      random,\n      maximumCandidates: 1,\n      maximumAttempts: 1,\n      rules,\n    });\n\n    const raw = composeFormalSyntaxUtterances(compose(new SequenceRandom([0])));\n    const reused = composeFormalSyntaxUtterances(\n      compose(new SequenceRandom([0])),\n      prepared,\n    );\n\n    expect(prepared.index.profilesByUpos.NOUN?.map((item) => item.id)).toEqual([\n      "profile:prepared-eligible",\n    ]);\n    expect(reused).toEqual(raw);\n  });\n});\n'''
          if 'describe("prepared formal syntax lexicon"' in text:
              raise SystemExit("prepared lexicon test already present")
          test_path.write_text(text.rstrip() + addition)
          PY
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Targeted tests
        run: npx vitest run tests/curriculum/formal-syntax-utterance.test.ts tests/curriculum/frequency-first-utterance.test.ts --testTimeout=15000
      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/tmp-prepared-lexicon-retries.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/curriculum/formal-syntax-utterance.ts src/curriculum/frequency-first-utterance.ts tests/curriculum/formal-syntax-utterance.test.ts .github/workflows/tmp-prepared-lexicon-retries.yml
          git commit -m "perf(syntax): reuse prepared lexicon across selector retries"
          git push origin HEAD:agent/formal-syntax-prepared-lexicon-retries
