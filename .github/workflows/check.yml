name: check

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      run_research:
        description: Run the archived relational research suite
        required: false
        default: false
        type: boolean

concurrency:
  group: check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: npm ci --include=dev --ignore-scripts
      - name: Verify active runtime morphology provenance
        id: morphology
        shell: bash
        run: |
          set -o pipefail
          npm run grammar:runtime-morphology -- --output runtime-morphology-candidate.json 2>&1 | tee morphology.log
      - name: Upload runtime morphology verification
        if: failure() && steps.morphology.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: runtime-morphology-verification
          path: |
            morphology.log
            runtime-morphology-candidate.json
          if-no-files-found: ignore
      - name: Verify causative occurrence audit
        id: causative-occurrence-audit
        shell: bash
        run: |
          set -o pipefail
          npx tsx scripts/audit-causative-occurrence-evidence.ts --verify 2>&1 | tee causative-occurrence-audit.log
      - name: Upload causative occurrence audit failure
        if: failure() && steps.causative-occurrence-audit.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: causative-occurrence-audit-failure
          path: causative-occurrence-audit.log
      - name: Verify BA occurrence audit
        id: ba-occurrence-audit
        shell: bash
        run: |
          set -o pipefail
          npx tsx scripts/audit-ba-occurrence-evidence.ts --verify 2>&1 | tee ba-occurrence-audit.log
      - name: Upload BA occurrence audit failure
        if: failure() && steps.ba-occurrence-audit.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: ba-occurrence-audit-failure
          path: ba-occurrence-audit.log
      - name: Verify runtime occurrence capabilities
        id: occurrence-capabilities
        shell: bash
        run: |
          set -o pipefail
          npm run grammar:runtime-occurrence-capabilities -- --output runtime-occurrence-capabilities-candidate.json 2>&1 | tee occurrence-capabilities.log
      - name: Upload runtime occurrence capability verification
        if: failure() && steps.occurrence-capabilities.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: runtime-occurrence-capability-verification
          path: |
            occurrence-capabilities.log
            runtime-occurrence-capabilities-candidate.json
          if-no-files-found: ignore
      - name: Verify BA runtime occurrence capability projection
        id: ba-occurrence-capabilities
        shell: bash
        run: |
          set -o pipefail
          npm run grammar:runtime-ba-occurrence-capabilities -- --output runtime-ba-occurrence-capabilities-candidate.json 2>&1 | tee ba-occurrence-capabilities.log
      - name: Upload BA runtime occurrence capability verification
        if: failure() && steps.ba-occurrence-capabilities.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: ba-runtime-occurrence-capability-verification
          path: |
            ba-occurrence-capabilities.log
            runtime-ba-occurrence-capabilities-candidate.json
          if-no-files-found: ignore
      - name: Typecheck
        id: typecheck
        shell: bash
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee typecheck.log
      - name: Upload TypeScript failure log
        if: failure() && steps.typecheck.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: typecheck-failure-log
          path: typecheck.log
      - name: Fast tests
        id: tests
        shell: bash
        run: |
          set -o pipefail
          npm run test:fast -- --reporter=verbose 2>&1 | tee vitest.log
      - name: Upload Vitest failure log
        if: failure() && steps.tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: vitest-failure-log
          path: vitest.log
      - name: Simulation tests
        id: simulation
        shell: bash
        run: |
          set -o pipefail
          npm run test:simulation 2>&1 | tee simulation.log
      - name: Upload simulation failure log
        if: failure() && steps.simulation.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: simulation-failure-log
          path: simulation.log
      - name: Source adapter tests
        run: npm run test:source-adapters
      - name: Validate catalog
        run: npm run catalog:validate
      - name: Production build
        run: npm run build
      # Listed separately here because this job runs the individual scripts
      # rather than `check:pr`, so adding a step to that composite does not add
      # it to CI.
      - name: Bundle size budget
        run: npm run size:check

  # Runs alongside `check` rather than after it, and belongs to this workflow
  # rather than one of its own so that the deploy gate -- which waits on this
  # workflow concluding successfully -- covers it too.
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci --include=dev --ignore-scripts
      # Explicit because `--ignore-scripts` skips the postinstall that would
      # otherwise fetch it. Only Chromium: the suite asserts platform behaviour
      # this project targets, not cross-browser parity.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser smoke tests
        id: browser
        run: npm run test:browser
      - name: Upload movement preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analysis-v2-movement-preview
          path: test-results/analysis-v2-movement-preview.png
          if-no-files-found: ignore
      - name: Upload Playwright report
        if: failure() && steps.browser.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore

  research:
    if: github.event_name == 'workflow_dispatch' && inputs.run_research
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci --include=dev --ignore-scripts
      - name: Run archived research verification
        run: npm run check:research
