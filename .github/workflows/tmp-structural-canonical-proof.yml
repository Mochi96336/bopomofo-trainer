name: tmp canonical string-array reuse probe

on:
  push:
    branches:
      - agent/tmp-structural-hash-attribution

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TARGET_REF: 7b4535b2c371d296f0a15cd39b405bd579afe9d5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Checkout production target
        run: git checkout --force "$TARGET_REF"
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci --include=dev --ignore-scripts
      - run: npm run app:catalog
      - name: Instrument canonical string-array calls
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/syntax/sample.ts')
          s = p.read_text()
          old = '''function canonicalStringArrayJson(values: readonly string[]): string {\n  return JSON.stringify(values);\n}\n'''
          new = '''interface CanonicalStringArrayValueProbe {\n  calls: number;\n  identityHits: number;\n  totalChars: number;\n}\n\nconst canonicalStringArrayFirstSource = new WeakMap<object, string>();\nconst canonicalStringArrayValues = new Map<string, CanonicalStringArrayValueProbe>();\nconst canonicalStringArrayLengths = new Map<number, { calls: number; identityHits: number }>();\nconst canonicalStringArrayProbe = {\n  calls: 0,\n  identityHits: 0,\n  mutatedIdentityCalls: 0,\n  frozenCalls: 0,\n  totalChars: 0,\n  identityRepeatedChars: 0,\n  valueRepeatedChars: 0,\n};\n\nfunction canonicalStringArrayJson(values: readonly string[]): string {\n  const source = JSON.stringify(values);\n  const key = values as object;\n  const firstSource = canonicalStringArrayFirstSource.get(key);\n  const identityHit = firstSource !== undefined;\n  if (!identityHit) canonicalStringArrayFirstSource.set(key, source);\n  else if (firstSource !== source) canonicalStringArrayProbe.mutatedIdentityCalls += 1;\n\n  canonicalStringArrayProbe.calls += 1;\n  canonicalStringArrayProbe.totalChars += source.length;\n  if (Object.isFrozen(values)) canonicalStringArrayProbe.frozenCalls += 1;\n  if (identityHit) {\n    canonicalStringArrayProbe.identityHits += 1;\n    canonicalStringArrayProbe.identityRepeatedChars += source.length;\n  }\n\n  const existing = canonicalStringArrayValues.get(source);\n  if (existing !== undefined) {\n    existing.calls += 1;\n    existing.totalChars += source.length;\n    if (identityHit) existing.identityHits += 1;\n    canonicalStringArrayProbe.valueRepeatedChars += source.length;\n  } else {\n    canonicalStringArrayValues.set(source, {\n      calls: 1,\n      identityHits: identityHit ? 1 : 0,\n      totalChars: source.length,\n    });\n  }\n\n  const lengthRow = canonicalStringArrayLengths.get(values.length) ?? { calls: 0, identityHits: 0 };\n  lengthRow.calls += 1;\n  if (identityHit) lengthRow.identityHits += 1;\n  canonicalStringArrayLengths.set(values.length, lengthRow);\n  return source;\n}\n\nexport function canonicalStringArrayProbeSummaryForTest(): object {\n  return {\n    ...canonicalStringArrayProbe,\n    uniqueIdentities: canonicalStringArrayProbe.calls - canonicalStringArrayProbe.identityHits,\n    uniqueValues: canonicalStringArrayValues.size,\n    valueHits: canonicalStringArrayProbe.calls - canonicalStringArrayValues.size,\n    identityHitRate: canonicalStringArrayProbe.calls === 0 ? 0 : canonicalStringArrayProbe.identityHits / canonicalStringArrayProbe.calls,\n    valueHitRate: canonicalStringArrayProbe.calls === 0 ? 0 : (canonicalStringArrayProbe.calls - canonicalStringArrayValues.size) / canonicalStringArrayProbe.calls,\n    frozenRate: canonicalStringArrayProbe.calls === 0 ? 0 : canonicalStringArrayProbe.frozenCalls / canonicalStringArrayProbe.calls,\n    topValues: [...canonicalStringArrayValues.entries()]\n      .map(([source, row]) => ({ source, ...row }))\n      .sort((a, b) => b.calls - a.calls || b.totalChars - a.totalChars)\n      .slice(0, 30),\n    lengths: [...canonicalStringArrayLengths.entries()]\n      .map(([length, row]) => ({ length, ...row }))\n      .sort((a, b) => a.length - b.length),\n  };\n}\n'''
          if old not in s:
              raise SystemExit('canonicalStringArrayJson anchor missing')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Run 128-round production probe
        shell: bash
        run: |
          cat > .tmp-string-array-probe.ts <<'EOF'
          import {
            EVALUATION_CATALOG,
            PRACTICE_CATALOG,
            SYNTAX_PROFILES,
          } from "./src/app/generated/catalog.js";
          import {
            createFreshProgressForEnvironment,
            createProductEnvironment,
            createProductState,
          } from "./src/product/session.js";
          import { canonicalStringArrayProbeSummaryForTest } from "./src/syntax/sample.js";

          const environment = createProductEnvironment({
            practice: PRACTICE_CATALOG,
            evaluation: EVALUATION_CATALOG,
            syntaxProfiles: SYNTAX_PROFILES,
          });
          const baseProgress = createFreshProgressForEnvironment(
            environment,
            "post-293-string-array-probe",
            "guided",
            "standard",
          );
          let attemptTotal = 0;
          for (let round = 0; round < 128; round += 1) {
            const state = createProductState(
              environment,
              { ...baseProgress, practiceRoundsCompleted: round },
              0,
            );
            attemptTotal += state.round.selection.generationAttempts;
          }
          console.log(JSON.stringify({
            rounds: 128,
            attemptTotal,
            probe: canonicalStringArrayProbeSummaryForTest(),
          }, null, 2));
          EOF
          node --import tsx .tmp-string-array-probe.ts
