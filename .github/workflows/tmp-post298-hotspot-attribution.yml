name: tmp post-298 hotspot attribution

on:
  push:
    branches:
      - agent/tmp-post298-hotspot-attribution

permissions:
  contents: read

jobs:
  attribute:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PROFILE_ROUNDS: 256
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci --include=dev --ignore-scripts
      - run: npm run app:catalog
      - name: Patch attribution counters
        run: python scripts/tmp-post298-hotspot-attribution.py
      - name: Run production-shaped attribution
        run: node --import tsx scripts/tmp-post298-hotspot-attribution.ts
