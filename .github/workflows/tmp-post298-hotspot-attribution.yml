name: tmp post-298 hotspot attribution

on:
  push:
    branches:
      - agent/tmp-post298-hotspot-attribution

permissions:
  contents: read

jobs:
  attribute:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PROFILE_ROUNDS: 256
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci --include=dev --ignore-scripts
      - run: npm run app:catalog
      - name: Patch attribution counters
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          stable = Path('src/core/stable-id.ts')
          text = stable.read_text()
          marker = 'function hashRuntimeSourceFirst32(source: string): number {'
          helper = r'''
function runtimeDigestAttributionKind(source: string): string {
  if (source.startsWith('{"allowedUpos":')) {
    return source.includes('"kind":"lexical-slot"') ? "slot-canonical" : "slot-identity";
  }
  if (source.startsWith('{"category":')) {
    return source.includes('"kind":"syntax-node"') ? "node-canonical" : "node-identity";
  }
  if (source.startsWith('{"grammarVersion":')) return "derivation-identity";
  if (source.startsWith('{"purpose":')) return "nested-keyed";
  if (source.startsWith('{"seed":')) return "seeded-offset";
  return "other";
}

function noteRuntimeDigestAttribution(kind: "full" | "first32", source: string): void {
  const root = globalThis as any;
  const stats = root.__runtimeDigestAttribution ??= {
    fullCalls: 0,
    fullChars: 0,
    first32Calls: 0,
    first32Chars: 0,
    categories: {},
  };
  const key = runtimeDigestAttributionKind(source);
  const category = stats.categories[key] ??= {
    fullCalls: 0,
    fullChars: 0,
    first32Calls: 0,
    first32Chars: 0,
    minLength: source.length,
    maxLength: source.length,
  };
  category.minLength = Math.min(category.minLength, source.length);
  category.maxLength = Math.max(category.maxLength, source.length);
  if (kind === "full") {
    stats.fullCalls += 1;
    stats.fullChars += source.length;
    category.fullCalls += 1;
    category.fullChars += source.length;
  } else {
    stats.first32Calls += 1;
    stats.first32Chars += source.length;
    category.first32Calls += 1;
    category.first32Chars += source.length;
  }
}

'''
          assert marker in text
          text = text.replace(marker, helper + marker, 1)
          text = text.replace(
              'function hashRuntimeSourceFirst32(source: string): number {\n',
              'function hashRuntimeSourceFirst32(source: string): number {\n  noteRuntimeDigestAttribution("first32", source);\n',
              1,
          )
          text = text.replace(
              'function hashRuntimeSource(source: string): string {\n',
              'function hashRuntimeSource(source: string): string {\n  noteRuntimeDigestAttribution("full", source);\n',
              1,
          )
          stable.write_text(text)

          formal = Path('src/curriculum/formal-syntax-utterance.ts')
          text = formal.read_text()
          marker = 'interface CompatibleProfileGroup {'
          helper = r'''
function formalSelectionAttribution(): any {
  const root = globalThis as any;
  return root.__formalSelectionAttribution ??= {
    groupedCalls: 0,
    groupedCacheHits: 0,
    groupedCacheMisses: 0,
    groupedSourceProfiles: 0,
    groupsBuilt: 0,
    selectCalls: 0,
    groupSlots: 0,
    firstPassVisits: 0,
    usedEntryChecks: 0,
    usedEntryRejections: 0,
    entryGets: 0,
    dynamicWeightUses: 0,
    mappedWeightUses: 0,
    defaultWeightUses: 0,
    lexicalCompatibilityUses: 0,
    validWeightChecks: 0,
    secondPassVisits: 0,
    selectedIndexSum: 0,
    selectedIndexMax: 0,
    fallbackSelections: 0,
    selectedSingletonGroups: 0,
    selectedMultiProfileGroups: 0,
  };
}

'''
          assert marker in text
          text = text.replace(marker, helper + marker, 1)

          old = '''  const cached = compatibleProfileGroupsCache.get(compatible);\n  if (cached !== undefined) return cached;\n  const profilesByEntryId = new Map<string, RuntimeSyntaxProfile[]>();\n'''
          new = '''  const stats = formalSelectionAttribution();\n  stats.groupedCalls += 1;\n  stats.groupedSourceProfiles += compatible.length;\n  const cached = compatibleProfileGroupsCache.get(compatible);\n  if (cached !== undefined) {\n    stats.groupedCacheHits += 1;\n    return cached;\n  }\n  stats.groupedCacheMisses += 1;\n  const profilesByEntryId = new Map<string, RuntimeSyntaxProfile[]>();\n'''
          assert old in text
          text = text.replace(old, new, 1)
          old = '''  compatibleProfileGroupsCache.set(compatible, groups);\n  return groups;\n}\n\nfunction selectCompatibleProfile(\n'''
          new = '''  stats.groupsBuilt += groups.length;\n  compatibleProfileGroupsCache.set(compatible, groups);\n  return groups;\n}\n\nfunction selectCompatibleProfile(\n'''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''  const groups = groupedCompatibleProfiles(compatible);\n  const weights = new Array<number>(groups.length);\n'''
          new = '''  const groups = groupedCompatibleProfiles(compatible);\n  const stats = formalSelectionAttribution();\n  stats.selectCalls += 1;\n  stats.groupSlots += groups.length;\n  const weights = new Array<number>(groups.length);\n'''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''  for (let index = 0; index < groups.length; index += 1) {\n    const group = groups[index]!;\n    if (usedEntryIds.has(group.entryId) && group.entryId !== reusableEntryId) {\n      weights[index] = 0;\n      continue;\n    }\n'''
          new = '''  for (let index = 0; index < groups.length; index += 1) {\n    stats.firstPassVisits += 1;\n    const group = groups[index]!;\n    stats.usedEntryChecks += 1;\n    if (usedEntryIds.has(group.entryId) && group.entryId !== reusableEntryId) {\n      stats.usedEntryRejections += 1;\n      weights[index] = 0;\n      continue;\n    }\n'''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''    const entry = entriesById.get(group.entryId);\n    if (entry === undefined) {\n'''
          new = '''    stats.entryGets += 1;\n    const entry = entriesById.get(group.entryId);\n    if (entry === undefined) {\n'''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''    const baseWeight = entryWeight?.(entry)\n      ?? entryWeightsById?.[entry.id]\n      ?? defaultEntryWeight(entry);\n'''
          new = '''    if (entryWeight !== undefined) stats.dynamicWeightUses += 1;\n    else if (entryWeightsById?.[entry.id] !== undefined) stats.mappedWeightUses += 1;\n    else stats.defaultWeightUses += 1;\n    const baseWeight = entryWeight?.(entry)\n      ?? entryWeightsById?.[entry.id]\n      ?? defaultEntryWeight(entry);\n'''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''    const weight = previousEntry === null || lexicalCompatibility === undefined\n      ? baseWeight\n      : baseWeight * lexicalCompatibilityMultiplier(\n'''
          new = '''    if (previousEntry !== null && lexicalCompatibility !== undefined) {\n      stats.lexicalCompatibilityUses += 1;\n    }\n    const weight = previousEntry === null || lexicalCompatibility === undefined\n      ? baseWeight\n      : baseWeight * lexicalCompatibilityMultiplier(\n'''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''    if (!Number.isFinite(weight) || weight < 0) {\n      throw new Error("formal syntax entry weights must be finite and non-negative");\n    }\n'''
          new = '''    stats.validWeightChecks += 1;\n    if (!Number.isFinite(weight) || weight < 0) {\n      throw new Error("formal syntax entry weights must be finite and non-negative");\n    }\n'''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''  for (let index = 0; index < groups.length; index += 1) {\n    target -= weights[index] ?? 0;\n    if (target < 0) {\n      selectedGroup = groups[index];\n      break;\n    }\n  }\n  selectedGroup ??= lastEligibleGroup;\n'''
          new = '''  for (let index = 0; index < groups.length; index += 1) {\n    stats.secondPassVisits += 1;\n    target -= weights[index] ?? 0;\n    if (target < 0) {\n      selectedGroup = groups[index];\n      stats.selectedIndexSum += index;\n      stats.selectedIndexMax = Math.max(stats.selectedIndexMax, index);\n      break;\n    }\n  }\n  if (selectedGroup === undefined) stats.fallbackSelections += 1;\n  selectedGroup ??= lastEligibleGroup;\n'''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''  const entryProfiles = selectedGroup.profiles;\n  if (entryProfiles.length === 0) throw new Error("formal syntax profile group is empty");\n'''
          new = '''  const entryProfiles = selectedGroup.profiles;\n  if (entryProfiles.length === 1) stats.selectedSingletonGroups += 1;\n  else stats.selectedMultiProfileGroups += 1;\n  if (entryProfiles.length === 0) throw new Error("formal syntax profile group is empty");\n'''
          assert old in text
          text = text.replace(old, new, 1)
          formal.write_text(text)
          PY
      - name: Run production-shaped attribution
        shell: bash
        run: |
          cat > .tmp-post298-attribution.ts <<'EOF'
          import {
            EVALUATION_CATALOG,
            PRACTICE_CATALOG,
            SYNTAX_PROFILES,
          } from "./src/app/generated/catalog.js";
          import {
            createFreshProgressForEnvironment,
            createProductEnvironment,
            createProductState,
          } from "./src/product/session.js";

          const rounds = Number(process.env.PROFILE_ROUNDS);
          const environment = createProductEnvironment({
            practice: PRACTICE_CATALOG,
            evaluation: EVALUATION_CATALOG,
            syntaxProfiles: SYNTAX_PROFILES,
          });
          const baseProgress = createFreshProgressForEnvironment(
            environment,
            "post-298-hotspot-attribution",
            "guided",
            "standard",
          );
          let attemptTotal = 0;
          for (let round = 0; round < rounds; round += 1) {
            const state = createProductState(
              environment,
              { ...baseProgress, practiceRoundsCompleted: round },
              0,
            );
            attemptTotal += state.round.selection.generationAttempts;
          }
          const root = globalThis as any;
          console.log(JSON.stringify({
            rounds,
            attemptTotal,
            runtimeDigest: root.__runtimeDigestAttribution ?? null,
            formalSelection: root.__formalSelectionAttribution ?? null,
          }, null, 2));
          EOF
          node --import tsx .tmp-post298-attribution.ts
