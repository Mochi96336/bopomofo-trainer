name: tmp finalize predicate marking ticket

on:
  push:
    branches:
      - agent/predicate-marking-practice-ticket-clean

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Finalize ticket source
        shell: bash
        run: |
          set -euo pipefail
          python scripts/tmp-finalize-predicate-marking-ticket.py
          npm ci --include=dev --ignore-scripts
          npm run typecheck
          npx vitest run tests/curriculum/predicate-marking-practice-ticket.test.ts tests/curriculum/formal-syntax-sampling-policy.test.ts --testTimeout=30000
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/curriculum/formal-syntax-sampling-policy.ts src/curriculum/formal-syntax-utterance.ts src/syntax/sample.ts tests/curriculum/predicate-marking-practice-ticket.test.ts
          git commit -m 'feat: finalize predicate marking practice ticket'
          git push origin HEAD:agent/predicate-marking-practice-ticket-clean
