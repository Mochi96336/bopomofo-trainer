name: tmp decouple predicate marking ticket identity

on:
  push:
    branches:
      - agent/predicate-marking-practice-ticket-clean

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Decouple ticket identity from sampling policy version
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          policy = Path('src/curriculum/formal-syntax-sampling-policy.ts')
          text = policy.read_text()
          marker = 'export type PredicateMarkingPracticeIntent = "ordinary" | "negation";\n'
          insertion = marker + '\nexport const PREDICATE_MARKING_PRACTICE_TICKET_VERSION =\n  "predicate-marking-practice-ticket-v1";\n'
          if marker not in text:
              raise SystemExit('practice intent marker not found')
          if 'PREDICATE_MARKING_PRACTICE_TICKET_VERSION' not in text:
              text = text.replace(marker, insertion, 1)
          old = '    version: policy.version,\n    purpose: "predicate-marking-practice",\n'
          new = '    ticketVersion: PREDICATE_MARKING_PRACTICE_TICKET_VERSION,\n    purpose: "predicate-marking-practice",\n'
          if old not in text:
              raise SystemExit('ticket identity marker not found')
          text = text.replace(old, new, 1)
          policy.write_text(text)

          test = Path('tests/curriculum/predicate-marking-practice-ticket.test.ts')
          text = test.read_text()
          marker = '''  it("fails closed on invalid marking practice weights", () => {\n'''
          addition = '''  it("keeps ticket assignment stable when only the sampling policy version changes", () => {\n    const common = {\n      ...PRODUCT_FORMAL_SYNTAX_SAMPLING_POLICY,\n      predicateMarkingPracticeWeights: { ordinary: 0.5, negation: 0.5 },\n    } as const;\n    expect(predicateMarkingPracticeIntentForFamilyPlan(PLAN, {\n      ...common,\n      version: "ticket-version-stability-a",\n    })).toBe(predicateMarkingPracticeIntentForFamilyPlan(PLAN, {\n      ...common,\n      version: "ticket-version-stability-b",\n    }));\n  });\n\n''' + marker
          if marker not in text:
              raise SystemExit('ticket test insertion marker not found')
          text = text.replace(marker, addition, 1)
          test.write_text(text)
          PY
          npm ci --include=dev --ignore-scripts
          npm run typecheck
          npx vitest run tests/curriculum/predicate-marking-practice-ticket.test.ts tests/curriculum/formal-syntax-sampling-policy.test.ts
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/curriculum/formal-syntax-sampling-policy.ts tests/curriculum/predicate-marking-practice-ticket.test.ts
          git commit -m 'refactor: stabilize predicate marking ticket identity'
          git push origin HEAD:agent/predicate-marking-practice-ticket-clean
