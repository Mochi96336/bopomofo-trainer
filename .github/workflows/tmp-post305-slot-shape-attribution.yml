name: tmp post-305 slot shape attribution

on:
  push:
    branches:
      - agent/tmp-post305-slot-shape-attribution

permissions:
  contents: read

jobs:
  attribute:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci --include=dev --ignore-scripts
      - run: npm run app:catalog
      - name: Attribute slot shapes
        shell: bash
        run: |
          set -euo pipefail
          cat > .tmp-slot-shape-attribution.ts <<'EOF'
          import { EVALUATION_CATALOG, PRACTICE_CATALOG, SYNTAX_PROFILES } from "./src/app/generated/catalog.js";
          import { stableRuntimeDigest } from "./src/core/stable-id.js";
          import { createFreshProgressForEnvironment, createProductEnvironment, createProductState } from "./src/product/session.js";
          import { TMP_SLOT_SHAPE_ATTRIBUTION as counters } from "./src/syntax/sample.js";

          const rounds = 256;
          const environment = createProductEnvironment({
            practice: PRACTICE_CATALOG,
            evaluation: EVALUATION_CATALOG,
            syntaxProfiles: SYNTAX_PROFILES,
          });
          const baseProgress = createFreshProgressForEnvironment(
            environment,
            "post305-slot-shape-attribution",
            "guided",
            "standard",
          );
          const outputs: object[] = [];
          let attemptTotal = 0;
          for (let round = 0; round < rounds; round += 1) {
            const state = createProductState(
              environment,
              { ...baseProgress, practiceRoundsCompleted: round },
              0,
            );
            const selection = state.round.selection;
            attemptTotal += selection.generationAttempts;
            outputs.push({
              id: selection.utterance.id,
              text: selection.utterance.text,
              attempts: selection.generationAttempts,
            });
          }
          const pct = (value: number, denom: number) =>
            denom === 0 ? 0 : Number((value / denom * 100).toFixed(2));
          console.log(JSON.stringify({
            rounds,
            attemptTotal,
            outputDigest: stableRuntimeDigest(outputs),
            ...counters,
            idReadsPerSlot: Number((counters.idReads / Math.max(1, counters.created)).toFixed(2)),
            bindingPct: pct(counters.binding, counters.created),
            formalLiteralPct: pct(counters.formalLiteral, counters.created),
            occurrenceRequirementPct: pct(counters.occurrenceRequirement, counters.created),
            allThreeOptionalPct: pct(counters.allThreeOptional, counters.created),
            noOptionalPct: pct(counters.noOptional, counters.created),
          }, null, 2));
          EOF
          node --import tsx .tmp-slot-shape-attribution.ts
