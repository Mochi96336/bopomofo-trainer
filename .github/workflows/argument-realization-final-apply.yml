name: argument realization final apply

on:
  push:
    branches:
      - agent/argument-realization-axis-migration
    paths:
      - .github/workflows/argument-realization-final-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/argument-realization-axis-migration
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm ci
      - name: Apply final 8192-seed calibration
        run: |
          python - <<'PY'
          from pathlib import Path

          policy = Path('src/curriculum/formal-syntax-sampling-policy.ts')
          text = policy.read_text()
          old = '''  // Calibrated against the immutable #266/#269 2048-seed structural-surface meter.\n  // This is a product-practice prior, not a corpus/linguistic omission probability.\n  argumentRealizationPracticeWeights: { ordinary: 0.80495, subjectOmission: 0.1002, objectOmission: 0.09485 },'''
          new = '''  // Calibrated against the immutable #269 final-namespace 8192-seed structural-surface meter.\n  // This is a product-practice prior, not a corpus/linguistic omission probability.\n  argumentRealizationPracticeWeights: { ordinary: 0.8015, subjectOmission: 0.112, objectOmission: 0.0865 },'''
          if text.count(old) != 1:
              raise SystemExit('unexpected argument realization policy literal')
          policy.write_text(text.replace(old, new))

          test = Path('tests/curriculum/argument-realization-practice-ticket.test.ts')
          text = test.read_text()
          needle = '''  it("keeps ticket incidence aligned with the calibrated product-practice prior", () => {\n    const sampleCount = 8192;'''
          repl = '''  it("keeps ticket incidence aligned with the calibrated product-practice prior", () => {\n    expect(PRODUCT_FORMAL_SYNTAX_SAMPLING_POLICY.argumentRealizationPracticeWeights).toEqual({\n      ordinary: 0.8015,\n      subjectOmission: 0.112,\n      objectOmission: 0.0865,\n    });\n    const sampleCount = 8192;'''
          if text.count(needle) != 1:
              raise SystemExit('unexpected argument realization ticket test shape')
          test.write_text(text.replace(needle, repl))
          PY
      - name: Targeted tests
        run: npx vitest run tests/curriculum/argument-realization-practice-ticket.test.ts tests/syntax/argument-realization-axis-migration.test.ts
      - name: Commit calibrated policy
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/curriculum/formal-syntax-sampling-policy.ts tests/curriculum/argument-realization-practice-ticket.test.ts
          git commit -m 'calibrate(syntax): finalize argument realization prior'
          git push origin HEAD:agent/argument-realization-axis-migration
