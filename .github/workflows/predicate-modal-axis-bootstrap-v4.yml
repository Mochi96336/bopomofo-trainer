name: predicate modal axis bootstrap v4

on:
  push:
    branches:
      - agent/predicate-modal-axis-migration
    paths:
      - .github/workflows/predicate-modal-axis-bootstrap-v4.yml

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply migration recipe and strict test fix
        shell: bash
        run: |
          python - <<'PY4'
          from pathlib import Path
          import textwrap
          recipe = Path('.github/workflows/predicate-modal-axis-bootstrap-v2.yml').read_text()
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n\n      - name: Refresh runtime grammar lock"
          start = recipe.index(start_marker) + len(start_marker)
          end = recipe.index(end_marker, start)
          exec(compile(textwrap.dedent(recipe[start:end]), '<predicate-modal-v2-recipe>', 'exec'), {})

          path = Path('tests/curriculum/predicate-marking-practice-ticket.test.ts')
          text = path.read_text()
          old = 'expect(composition.candidates[0]!.syntaxProfileIds.some((id) =>'
          new = 'expect((composition.candidates[0]!.syntaxProfileIds ?? []).some((id) =>'
          if text.count(old) != 1:
              raise SystemExit(f'expected one optional syntaxProfileIds assertion, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY4
      - name: Refresh runtime grammar lock with rule-index canonical order
        shell: bash
        run: |
          DIGEST="$(npx tsx -e 'import { FORMAL_SYNTAX_RULES } from "./src/syntax/grammar.ts"; import { sha256Canonical } from "./src/reference/importers/canonical-json.ts"; const rules=[...FORMAL_SYNTAX_RULES].sort((a,b)=>a.id < b.id ? -1 : a.id > b.id ? 1 : 0); console.log(sha256Canonical(rules));')"
          node - "$DIGEST" <<'NODE'
          const fs = require('node:fs');
          const digest = process.argv[2];
          const path = 'data/grammar/formal-syntax-runtime-lock.json';
          const lock = JSON.parse(fs.readFileSync(path, 'utf8'));
          lock.grammarRulesDigest = digest;
          fs.writeFileSync(path, `${JSON.stringify(lock)}\n`);
          console.log(`grammarRulesDigest=${digest}`);
          NODE
      - name: Generate catalog and run focused validation
        shell: bash
        run: |
          npm run app:catalog
          npm run typecheck
          npx vitest run \
            tests/curriculum/predicate-marking-practice-ticket.test.ts \
            tests/syntax/clause-model-v2.test.ts \
            tests/syntax/runtime-occurrence-capabilities.test.ts \
            tests/syntax/predicate-negation-axis-migration.test.ts \
            tests/syntax/predicate-ownership.test.ts \
            tests/syntax/clause-rules.test.ts
      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests data/grammar/formal-syntax-runtime-lock.json
          git commit -m "refactor(syntax): move modal practice onto Predicate axis"
          git push origin HEAD:agent/predicate-modal-axis-migration
