name: argument realization apply calibration

on:
  push:
    branches:
      - agent/argument-realization-axis-migration
    paths:
      - .github/workflows/argument-realization-apply-calibration.yml

permissions:
  contents: write

concurrency:
  group: argument-realization-apply-calibration
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/argument-realization-axis-migration
          fetch-depth: 0
      - name: Apply calibrated product-practice prior
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          policy = Path('src/curriculum/formal-syntax-sampling-policy.ts')
          text = policy.read_text()
          old = '''  // Provisional bootstrap prior from the #266 legacy product-exposure meter.\n  // This is a calibration seed, not a corpus/linguistic omission probability.\n  argumentRealizationPracticeWeights: { ordinary: 0.8096, subjectOmission: 0.1025, objectOmission: 0.0879 },\n'''
          new = '''  // Calibrated against the immutable #266/#269 2048-seed structural-surface meter.\n  // This is a product-practice prior, not a corpus/linguistic omission probability.\n  argumentRealizationPracticeWeights: { ordinary: 0.80495, subjectOmission: 0.1002, objectOmission: 0.09485 },\n'''
          if text.count(old) != 1:
              raise SystemExit('unexpected argument-realization policy calibration seed')
          policy.write_text(text.replace(old, new))

          test = Path('tests/curriculum/argument-realization-practice-ticket.test.ts')
          text = test.read_text()
          old_title = '  it("keeps the provisional ticket incidence close to the legacy exposure seed", () => {\n'
          new_title = '  it("keeps ticket incidence aligned with the calibrated product-practice prior", () => {\n'
          if text.count(old_title) != 1:
              raise SystemExit('unexpected argument-realization ticket test title')
          text = text.replace(old_title, new_title)
          old_expect = '''    expect(Math.abs(subject / sampleCount - 0.1025)).toBeLessThan(0.01);\n    expect(Math.abs(object / sampleCount - 0.0879)).toBeLessThan(0.01);\n'''
          new_expect = '''    const weights = PRODUCT_FORMAL_SYNTAX_SAMPLING_POLICY.argumentRealizationPracticeWeights;\n    const total = weights.ordinary + weights.subjectOmission + weights.objectOmission;\n    expect(Math.abs(subject / sampleCount - weights.subjectOmission / total)).toBeLessThan(0.01);\n    expect(Math.abs(object / sampleCount - weights.objectOmission / total)).toBeLessThan(0.01);\n'''
          if text.count(old_expect) != 1:
              raise SystemExit('unexpected argument-realization ticket expectations')
          test.write_text(text.replace(old_expect, new_expect))
          PY
      - name: Commit calibrated prior
        shell: bash
        run: |
          git diff --check
          git diff -- src/curriculum/formal-syntax-sampling-policy.ts tests/curriculum/argument-realization-practice-ticket.test.ts
          test -n "$(git status --short)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/curriculum/formal-syntax-sampling-policy.ts tests/curriculum/argument-realization-practice-ticket.test.ts
          git commit -m "calibrate(syntax): preserve argument realization exposure"
          git push origin HEAD:agent/argument-realization-axis-migration
