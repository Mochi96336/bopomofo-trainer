name: apply formal syntax selection override once

on:
  push:
    branches:
      - agent/formal-syntax-v2-selection-composition-override

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/formal-syntax-v2-selection-composition-override
      - name: Apply narrow selection override plumbing
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/curriculum/frequency-first-utterance.ts')
          source = path.read_text()

          replacements = [
              (
                  'import { composeFormalSyntaxUtterances } from "./formal-syntax-utterance.js";',
                  'import {\n  composeFormalSyntaxUtterances,\n  type FormalSyntaxUtteranceInput,\n} from "./formal-syntax-utterance.js";',
              ),
              (
                  'export interface FrequencyFirstUtteranceInput {',
                  'export type FormalSyntaxCompositionOverride = Pick<\n  FormalSyntaxUtteranceInput,\n  "rules" | "samplingMode" | "structuralTarget"\n>;\n\nexport interface FrequencyFirstUtteranceInput {',
              ),
              (
                  '  /** Production path: compact profiles admitted by the formal syntax gate. */\n  readonly profiles?: readonly RuntimeSyntaxProfile[];\n  /** Explicit compatibility-only templates. Production has no built-in list. */',
                  '  /** Production path: compact profiles admitted by the formal syntax gate. */\n  readonly profiles?: readonly RuntimeSyntaxProfile[];\n  /**\n   * Optional construction-specific formal-syntax search space. This may narrow\n   * grammar composition only; frequency/learner/history scoring stays owned by\n   * this selector. It is meaningful only when runtime syntax profiles are used.\n   */\n  readonly formalSyntaxComposition?: FormalSyntaxCompositionOverride;\n  /** Explicit compatibility-only templates. Production has no built-in list. */',
              ),
              (
                  '      maximumCandidates: 1,\n      maximumAttempts: 64,\n      bounds: {',
                  '      maximumCandidates: 1,\n      maximumAttempts: 64,\n      ...(input.formalSyntaxComposition ?? {}),\n      bounds: {',
              ),
              (
                  '    };\n  }\n  const templateScores = new Map<string, TemplateSelectionScore>();',
                  '    };\n  }\n  if (input.formalSyntaxComposition !== undefined) {\n    throw new Error("formalSyntaxComposition requires formal syntax profiles");\n  }\n  const templateScores = new Map<string, TemplateSelectionScore>();',
              ),
          ]

          for old, new in replacements:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one replacement target, got {count}: {old[:80]!r}')
              source = source.replace(old, new)

          path.write_text(source)
          PY
          git diff --check
      - name: Commit source patch and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/apply-formal-syntax-selection-override-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/curriculum/frequency-first-utterance.ts .github/workflows/apply-formal-syntax-selection-override-once.yml
          git commit -m "feat(curriculum): pass formal syntax composition through selection"
          git push origin HEAD:agent/formal-syntax-v2-selection-composition-override
