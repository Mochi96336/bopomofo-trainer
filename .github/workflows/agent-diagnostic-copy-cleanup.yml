name: agent-diagnostic-copy-cleanup

on:
  push:
    branches:
      - agent/refine-transition-metric-copy

permissions:
  contents: write

jobs:
  patch-copy:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Apply diagnostic copy cleanup
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_exact(path_name: str, old: str, new: str, expected: int = 1) -> None:
              path = Path(path_name)
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != expected:
                  raise SystemExit(
                      f"{path_name}: expected {expected} occurrences of {old!r}, found {count}"
                  )
              path.write_text(text.replace(old, new), encoding="utf-8")

          panel = "src/app/diagnostic-panel.ts"
          replacements = [
              (
                  "到達各鍵的有效鍵間時間；起始、錯誤、修正與干擾不計。",
                  "按下各鍵前的有效輸入間隔；音節起始、誤按、修正與干擾不計。",
              ),
              (
                  "已映射觀察中的錯誤比例，不是首次作答錯誤率。",
                  "錯誤輸入占已記錄輸入的比例；修正後的正確輸入也會計入。",
              ),
              (
                  "應按與實際按鍵的方向性關係；反向另計。",
                  "應按的鍵被誤按成哪一鍵；反向另計。",
              ),
              (
                  "同音節、相鄰且正確的乾淨輸入；反向另計。",
                  "只計同一音節中相鄰、正確且未受干擾的輸入。",
              ),
              (
                  "分母是同一應按鍵的所有誤按；反向另計。",
                  "占比以同一應按鍵的所有誤按為分母。",
              ),
              ("同目標占 ", "此應按鍵中占 "),
              ("<dt>同目標總數</dt>", "<dt>此鍵誤按總數</dt>"),
              (
                  "${tokenLabel(selectedKey)} 目前沒有可列出的轉換。",
                  "${tokenLabel(selectedKey)} 相關的轉換尚無足夠資料。",
              ),
              (
                  "轉換樣本仍不足；累積 ${DIAGNOSTIC_POLICY.relationshipSamples.preliminary} 個樣本後才會列出。",
                  "同一組轉換累積 ${DIAGNOSTIC_POLICY.relationshipSamples.preliminary} 次有效輸入後才會顯示；目前資料仍不足。",
              ),
              ("選一筆轉換查看數值。", "尚無可查看的轉換資料。"),
              ("選一筆誤按查看數值。", "尚無可查看的誤按紀錄。"),
              (
                  'aria-label="全網：顯示所有已發生與注音結構上可能的轉換，依嚴重程度從淡墨變紅" title="全網"',
                  'aria-label="轉換總覽：顯示已記錄與可能的按鍵轉換；輸入越慢，顏色越接近紅色。" title="轉換總覽"',
              ),
              (
                  "下一個區段 ${series.partialSampleCount} / ${series.bucketSize}",
                  "下一次更新：${series.partialSampleCount} / ${series.bucketSize} 筆",
              ),
              ("從本版本開始累積趨勢", "變化資料將從現在開始累積。"),
              (
                  "再累積一些有效觀察後才能比較",
                  "再累積一些有效輸入後，就能比較變化。",
              ),
              ("目前資料不足以判斷方向", "目前資料不足以判斷變化。"),
          ]
          for old, new in replacements:
              replace_exact(panel, old, new)

          replace_exact(
              "tests/app/diagnostic-copy.test.ts",
              'expect(gated).toContain("樣本");',
              'expect(gated).toContain("有效輸入");',
          )
          replace_exact(
              "tests/app/diagnostic-copy.test.ts",
              '.toBe("ㄌ 目前沒有可列出的轉換。");',
              '.toBe("ㄌ 相關的轉換尚無足夠資料。");',
          )

          progress_test = "tests/app/diagnostic-progress-render.test.ts"
          progress_replacements = [
              ("從本版本開始累積趨勢", "變化資料將從現在開始累積。"),
              (
                  "再累積一些有效觀察後才能比較",
                  "再累積一些有效輸入後，就能比較變化。",
              ),
              ("目前資料不足以判斷方向", "目前資料不足以判斷變化。"),
              (
                  "`下一個區段 3 / ${BUCKETS.correctnessBucketSize}`",
                  "`下一次更新：3 / ${BUCKETS.correctnessBucketSize} 筆`",
              ),
              (
                  "`下一個區段 2 / ${BUCKETS.timingBucketSize}`",
                  "`下一次更新：2 / ${BUCKETS.timingBucketSize} 筆`",
              ),
          ]
          for old, new in progress_replacements:
              replace_exact(progress_test, old, new)

          # Keep the product specification aligned with the user-facing copy.
          doc = Path("docs/weakness-diagnostics.md")
          doc_text = doc.read_text(encoding="utf-8")
          doc_replacements = [
              ("`全網`", "`轉換總覽`"),
              ("`ㄌ 目前沒有可列出的轉換。`", "`ㄌ 相關的轉換尚無足夠資料。`"),
              (
                  "`轉換樣本仍不足；累積 3 個樣本後才會列出。`",
                  "`同一組轉換累積 3 次有效輸入後才會顯示；目前資料仍不足。`",
              ),
          ]
          for old, new in doc_replacements:
              doc_text = doc_text.replace(old, new)
          doc.write_text(doc_text, encoding="utf-8")

          history_doc = Path("docs/diagnostic-progress-history.md")
          history_text = history_doc.read_text(encoding="utf-8")
          for old, new in [
              ("從本版本開始累積趨勢", "變化資料將從現在開始累積。"),
              ("再累積一些有效觀察後才能比較", "再累積一些有效輸入後，就能比較變化。"),
              ("目前資料不足以判斷方向", "目前資料不足以判斷變化。"),
              ("下一個區段", "下一次更新："),
          ]:
              history_text = history_text.replace(old, new)
          history_doc.write_text(history_text, encoding="utf-8")

          Path(".github/workflows/agent-diagnostic-copy-cleanup.yml").unlink()
          PY
      - name: Commit copy cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/diagnostic-panel.ts tests/app/diagnostic-copy.test.ts tests/app/diagnostic-progress-render.test.ts docs/weakness-diagnostics.md docs/diagnostic-progress-history.md .github/workflows/agent-diagnostic-copy-cleanup.yml
          git commit -m "fix: refine diagnostic copy"
          git push origin HEAD:agent/refine-transition-metric-copy
