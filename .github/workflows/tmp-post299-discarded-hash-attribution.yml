name: tmp post-299 discarded structural hash attribution

on:
  push:
    branches:
      - agent/tmp-post299-discarded-hash-attribution

permissions:
  contents: read

env:
  PRODUCTION_REF: 73f419d2c5ada5c3b366af25d0de27dbb860f6bf
  SAMPLE_COUNT: 256

jobs:
  attribution:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Measure discarded structural identity work
        shell: bash
        run: |
          set -euo pipefail
          cp scripts/tmp-post299-discarded-hash-attribution.py "$RUNNER_TEMP/patch.py"
          cp scripts/tmp-post299-discarded-hash-attribution.ts "$RUNNER_TEMP/runner.ts"
          git checkout --force "$PRODUCTION_REF"
          git clean -fdx
          npm ci --include=dev --ignore-scripts
          python "$RUNNER_TEMP/patch.py"
          cp "$RUNNER_TEMP/runner.ts" scripts/tmp-post299-discarded-hash-attribution.ts
          git diff --check
          npm run typecheck
          npm run app:catalog >/dev/null
          node --import tsx scripts/tmp-post299-discarded-hash-attribution.ts
