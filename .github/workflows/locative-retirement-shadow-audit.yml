name: locative retirement shadow audit

on:
  push:
    branches:
      - agent/locative-retirement-shadow-audit
    paths:
      - .github/workflows/locative-retirement-shadow-audit.yml
      - scripts/audit-locative-retirement-shadow.ts
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate packaged app catalog
        run: npm run app:catalog

      - name: Add audit-only production path trace
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/curriculum/formal-syntax-utterance.ts')
          text = path.read_text()
          needle = '      syntaxProfileIds: realization.syntaxProfileIds,\n'
          if text.count(needle) != 1:
              raise SystemExit('unexpected formal-syntax candidate shape')
          path.write_text(text.replace(
              needle,
              needle + '      __auditProductionRulePath: shape.productionRulePath,\n',
          ))
          PY

      - name: Run 2048-seed current-vs-shadow audit
        run: npx tsx scripts/audit-locative-retirement-shadow.ts

      - name: Publish summary
        if: always()
        run: |
          if [ -f locative-retirement-shadow-audit.md ]; then
            cat locative-retirement-shadow-audit.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: locative-retirement-shadow-audit
          path: |
            locative-retirement-shadow-audit.json
            locative-retirement-shadow-audit.md
          if-no-files-found: error
