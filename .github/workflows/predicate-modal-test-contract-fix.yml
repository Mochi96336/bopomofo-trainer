name: predicate modal test contract fix

on:
  push:
    branches:
      - agent/predicate-modal-axis-migration
    paths:
      - .github/workflows/predicate-modal-test-contract-fix.yml

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/predicate-modal-axis-migration
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Patch stale expectations and explicit test budgets
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          taxonomy = Path("tests/curriculum/formal-syntax-taxonomy.test.ts")
          text = taxonomy.read_text()
          replacements = {
              'family: "complex-predicate", ticketCount: 1, rawShare: 1 / 21': 'family: "complex-predicate", ticketCount: 1, rawShare: 1 / 20',
              'family: "core-predication", ticketCount: 8, rawShare: 8 / 21': 'family: "core-predication", ticketCount: 8, rawShare: 8 / 20',
              'family: "embedded-content", ticketCount: 5, rawShare: 5 / 21': 'family: "embedded-content", ticketCount: 5, rawShare: 5 / 20',
              'family: "information-structure", ticketCount: 3, rawShare: 3 / 21': 'family: "information-structure", ticketCount: 3, rawShare: 3 / 20',
              'family: "marked", ticketCount: 4, rawShare: 4 / 21': 'family: "marked", ticketCount: 3, rawShare: 3 / 20',
              'expect(audit.clauseFamilies).toHaveLength(20);': 'expect(audit.clauseFamilies).toHaveLength(19);',
              '.toMatchObject({ ticketCount: 2, rawShare: 2 / 21 });': '.toMatchObject({ ticketCount: 2, rawShare: 2 / 20 });',
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f"taxonomy seam mismatch: {old!r} count={text.count(old)}")
              text = text.replace(old, new)
          taxonomy.write_text(text)

          effective = Path("tests/curriculum/formal-syntax-effective-distribution.test.ts")
          text = effective.read_text()
          old = '''    expect(questionShare, diagnostic).toBeLessThan(0.40);\n  });\n\n  it("does not disable product policy when the canonical grammar is passed explicitly", () => {'''
          new = '''    expect(questionShare, diagnostic).toBeLessThan(0.40);\n  }, 30_000);\n\n  it("does not disable product policy when the canonical grammar is passed explicitly", () => {'''
          if text.count(old) != 1:
              raise SystemExit(f"effective-distribution seam mismatch count={text.count(old)}")
          effective.write_text(text.replace(old, new))

          ticket = Path("tests/curriculum/predicate-marking-practice-ticket.test.ts")
          text = ticket.read_text()
          old = '''      expect(composition.candidates[0]!.text).toMatch(/[了過著着]/u);\n    }\n  }, 30_000);\n});'''
          new = '''      expect(composition.candidates[0]!.text).toMatch(/[了過著着]/u);\n    }\n  }, 60_000);\n});'''
          if text.count(old) != 1:
              raise SystemExit(f"predicate-ticket seam mismatch count={text.count(old)}")
          ticket.write_text(text.replace(old, new))
          PY
      - run: npm run app:catalog
      - name: Run focused regressions
        run: >-
          npx vitest run
          tests/curriculum/formal-syntax-taxonomy.test.ts
          tests/curriculum/formal-syntax-effective-distribution.test.ts
          tests/curriculum/predicate-marking-practice-ticket.test.ts
      - name: Commit test-only fixes
        shell: bash
        run: |
          git diff --exit-code -- src data || {
            echo "unexpected production-source change" >&2
            exit 1
          }
          git status --short
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/curriculum/formal-syntax-taxonomy.test.ts \
                  tests/curriculum/formal-syntax-effective-distribution.test.ts \
                  tests/curriculum/predicate-marking-practice-ticket.test.ts
          git commit -m "test(syntax): align modal retirement contracts"
          git push origin HEAD:agent/predicate-modal-axis-migration
