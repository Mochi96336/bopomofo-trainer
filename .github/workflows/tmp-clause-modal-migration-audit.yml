name: tmp Clause modal migration audit

on:
  push:
    branches:
      - agent/clause-modal-migration-audit

permissions:
  contents: read

jobs:
  audit:
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MODAL_AUDIT_SAMPLES: "256"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci --include=dev --ignore-scripts
      - name: Build generated app catalog
        run: npm run app:catalog
      - name: Preserve validated modal replay
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin agent/modal-consumer-incidence-audit
          git show origin/agent/modal-consumer-incidence-audit:scripts/audit-modal-consumer-frontier.ts > scripts/tmp-clause-modal-migration-audit.ts
      - name: Adapt replay to exact consumer classes
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'scripts/tmp-clause-modal-migration-audit.ts';
          let source = fs.readFileSync(path, 'utf8');

          const predicateBefore = `function isPredicateModalSlot(slot: StructuralLexicalSlot): boolean {\n  return slot.constituentKey === "modal"\n    && slot.allowedUpos.length === 1\n    && slot.allowedUpos[0] === "AUX"\n    && !slot.requiredFunctions.includes("auxiliary");\n}\n`;
          const predicateAfter = `function isPredicateModalSlot(slot: StructuralLexicalSlot): boolean {\n  return slot.constituentKey === "modal"\n    && slot.allowedUpos.length === 1\n    && slot.allowedUpos[0] === "AUX"\n    && (slot.requiredOccurrenceCapabilities?.includes(\n      PREVERBAL_AUXILIARY_SAME_OCCURRENCE_CAPABILITY,\n    ) ?? false);\n}\n\nfunction isLegacyNonClauseModalSlot(slot: StructuralLexicalSlot): boolean {\n  return slot.constituentKey === "modal"\n    && slot.allowedUpos.length === 1\n    && slot.allowedUpos[0] === "AUX"\n    && !slot.requiredFunctions.includes("auxiliary")\n    && !isPredicateModalSlot(slot);\n}\n`;
          if (!source.includes(predicateBefore)) throw new Error('Predicate modal classifier insertion point missing');
          source = source.replace(predicateBefore, predicateAfter);

          const compatibilityBefore = `  const compatible = compatibleProfilesForSlot(slot, profileIndex);\n  if (strategy === "current" || !isPredicateModalSlot(slot)) return compatible;\n  return compatible.filter((profile) => reviewedIds.has(profile.id));\n`;
          const compatibilityAfter = `  const compatible = compatibleProfilesForSlot(slot, profileIndex);\n  if (strategy === "current" || !isClauseModalSlot(slot)) return compatible;\n  return compatible.filter((profile) => reviewedIds.has(profile.id));\n`;
          if (!source.includes(compatibilityBefore)) throw new Error('compatibility strategy insertion point missing');
          source = source.replace(compatibilityBefore, compatibilityAfter);

          source = source.replace(
            `readonly kind: "predicate-modal" | "clause-modal" | "other";`,
            `readonly kind: "predicate-modal" | "clause-modal" | "legacy-modal" | "other";`,
          );
          const kindBefore = `        kind: isPredicateModalSlot(slot)\n          ? "predicate-modal"\n          : isClauseModalSlot(slot)\n            ? "clause-modal"\n            : "other",\n`;
          const kindAfter = `        kind: isPredicateModalSlot(slot)\n          ? "predicate-modal"\n          : isClauseModalSlot(slot)\n            ? "clause-modal"\n            : isLegacyNonClauseModalSlot(slot)\n              ? "legacy-modal"\n              : "other",\n`;
          if (!source.includes(kindBefore)) throw new Error('slot-kind insertion point missing');
          source = source.replace(kindBefore, kindAfter);

          const interfaceNeedle = `  predicateModalOutput: number;\n  clauseModalOutput: number;\n  predicateModalSlots: number;\n  clauseModalSlots: number;\n`;
          const interfaceReplacement = `  predicateModalOutput: number;\n  clauseModalOutput: number;\n  legacyModalOutput: number;\n  modalAnyOutput: number;\n  modalMultiClassOutput: number;\n  predicateModalSlots: number;\n  clauseModalSlots: number;\n  legacyModalSlots: number;\n`;
          if (!source.includes(interfaceNeedle)) throw new Error('aggregate interface insertion point missing');
          source = source.replace(interfaceNeedle, interfaceReplacement);

          source = source.replace(
            `  readonly clauseModalForms: Map<string, number>;\n`,
            `  readonly clauseModalForms: Map<string, number>;\n  readonly legacyModalForms: Map<string, number>;\n`,
          );
          const emptyNeedle = `    predicateModalOutput: 0,\n    clauseModalOutput: 0,\n    predicateModalSlots: 0,\n    clauseModalSlots: 0,\n`;
          const emptyReplacement = `    predicateModalOutput: 0,\n    clauseModalOutput: 0,\n    legacyModalOutput: 0,\n    modalAnyOutput: 0,\n    modalMultiClassOutput: 0,\n    predicateModalSlots: 0,\n    clauseModalSlots: 0,\n    legacyModalSlots: 0,\n`;
          if (!source.includes(emptyNeedle)) throw new Error('empty aggregate insertion point missing');
          source = source.replace(emptyNeedle, emptyReplacement);
          source = source.replace(
            `    clauseModalForms: new Map(),\n`,
            `    clauseModalForms: new Map(),\n    legacyModalForms: new Map(),\n`,
          );

          const recordNeedle = `  const predicateModal = trace.slotSelections.filter((selection) => selection.kind === "predicate-modal");\n  const clauseModal = trace.slotSelections.filter((selection) => selection.kind === "clause-modal");\n  if (predicateModal.length > 0) target.predicateModalOutput += 1;\n  if (clauseModal.length > 0) target.clauseModalOutput += 1;\n  target.predicateModalSlots += predicateModal.length;\n  target.clauseModalSlots += clauseModal.length;\n`;
          const recordReplacement = `  const predicateModal = trace.slotSelections.filter((selection) => selection.kind === "predicate-modal");\n  const clauseModal = trace.slotSelections.filter((selection) => selection.kind === "clause-modal");\n  const legacyModal = trace.slotSelections.filter((selection) => selection.kind === "legacy-modal");\n  const modalClassCount = Number(predicateModal.length > 0) + Number(clauseModal.length > 0) + Number(legacyModal.length > 0);\n  if (predicateModal.length > 0) target.predicateModalOutput += 1;\n  if (clauseModal.length > 0) target.clauseModalOutput += 1;\n  if (legacyModal.length > 0) target.legacyModalOutput += 1;\n  if (modalClassCount > 0) target.modalAnyOutput += 1;\n  if (modalClassCount > 1) target.modalMultiClassOutput += 1;\n  target.predicateModalSlots += predicateModal.length;\n  target.clauseModalSlots += clauseModal.length;\n  target.legacyModalSlots += legacyModal.length;\n`;
          if (!source.includes(recordNeedle)) throw new Error('modal exposure insertion point missing');
          source = source.replace(recordNeedle, recordReplacement);

          const clauseLoopNeedle = `  for (const selection of clauseModal) {\n    increment(target.clauseModalForms, selection.text);\n    if (reviewedIds.has(selection.profileId)) target.clauseModalReviewed += 1;\n    else if (legacyOnlyIds.has(selection.profileId)) target.clauseModalLegacyOnly += 1;\n  }\n`;
          const clauseLoopReplacement = `${clauseLoopNeedle}  for (const selection of legacyModal) {\n    increment(target.legacyModalForms, selection.text);\n  }\n`;
          if (!source.includes(clauseLoopNeedle)) throw new Error('legacy modal form insertion point missing');
          source = source.replace(clauseLoopNeedle, clauseLoopReplacement);

          const summaryNeedle = `    predicateModalOutput: target.predicateModalOutput,\n    clauseModalOutput: target.clauseModalOutput,\n    predicateModalSlots: target.predicateModalSlots,\n    clauseModalSlots: target.clauseModalSlots,\n`;
          const summaryReplacement = `    predicateModalOutput: target.predicateModalOutput,\n    clauseModalOutput: target.clauseModalOutput,\n    legacyModalOutput: target.legacyModalOutput,\n    modalAnyOutput: target.modalAnyOutput,\n    modalMultiClassOutput: target.modalMultiClassOutput,\n    predicateModalSlots: target.predicateModalSlots,\n    clauseModalSlots: target.clauseModalSlots,\n    legacyModalSlots: target.legacyModalSlots,\n`;
          if (!source.includes(summaryNeedle)) throw new Error('summary exposure insertion point missing');
          source = source.replace(summaryNeedle, summaryReplacement);
          source = source.replace(
            `    clauseModalForms: sortedRecord(target.clauseModalForms),\n`,
            `    clauseModalForms: sortedRecord(target.clauseModalForms),\n    legacyModalForms: sortedRecord(target.legacyModalForms),\n`,
          );

          fs.writeFileSync(path, source);
          NODE
          sed -i "s/modal-consumer-frontier:/clause-modal-migration-v2-${{ matrix.shard }}:/g" scripts/tmp-clause-modal-migration-audit.ts
      - name: Audit Clause modal migration
        shell: bash
        run: |
          set -o pipefail
          npx tsx scripts/tmp-clause-modal-migration-audit.ts | tee clause-modal-migration-${{ matrix.shard }}.json
      - name: Upload shard audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clause-modal-migration-shard-${{ matrix.shard }}
          path: clause-modal-migration-${{ matrix.shard }}.json
          if-no-files-found: error

  aggregate:
    needs: audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: clause-modal-migration-shard-*
          path: modal-shards
          merge-multiple: true
      - name: Aggregate 2048-seed migration audit
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const directory = 'modal-shards';
          const files = fs.readdirSync(directory).filter((name) => name.endsWith('.json')).sort();
          if (files.length !== 8) throw new Error(`expected 8 shard artifacts, got ${files.length}`);
          const shards = files.map((name) => JSON.parse(fs.readFileSync(path.join(directory, name), 'utf8')));
          if (shards.some((shard) => shard.sampleCount !== 256)) throw new Error('every shard must contain exactly 256 samples');
          if (shards.some((shard) => shard.drift.parityMismatches !== 0)) throw new Error('one or more shards diverged from official #256 composer');

          const numericFields = [
            'success', 'clauseModalPath', 'predicateExpandedPath',
            'predicateModalOutput', 'clauseModalOutput', 'legacyModalOutput',
            'modalAnyOutput', 'modalMultiClassOutput',
            'predicateModalSlots', 'clauseModalSlots', 'legacyModalSlots',
            'predicateModalReviewed', 'predicateModalLegacyOnly', 'predicateModalPredicateOnly',
            'clauseModalReviewed', 'clauseModalLegacyOnly',
          ];
          const recordFields = ['rootCounts', 'fallbackCounts', 'predicateModalForms', 'clauseModalForms', 'legacyModalForms'];
          function sumRecord(values) {
            const out = {};
            for (const value of values) for (const [key, count] of Object.entries(value)) out[key] = (out[key] ?? 0) + count;
            return Object.fromEntries(Object.entries(out).sort(([a], [b]) => a.localeCompare(b, 'zh-Hant')));
          }
          function aggregate(key) {
            const out = {};
            for (const field of numericFields) out[field] = shards.reduce((sum, shard) => sum + shard[key][field], 0);
            for (const field of recordFields) out[field] = sumRecord(shards.map((shard) => shard[key][field]));
            return out;
          }
          function tv(left, right) {
            const keys = new Set([...Object.keys(left), ...Object.keys(right)]);
            let absolute = 0;
            for (const key of keys) absolute += Math.abs((left[key] ?? 0) - (right[key] ?? 0));
            return absolute / 2;
          }

          const current = aggregate('current');
          const narrowClauseShadow = aggregate('narrowPredicateShadow');
          const retireClauseShadow = aggregate('narrowAndRetireClauseShadow');
          if (current.predicateModalLegacyOnly !== 0 || current.predicateModalPredicateOnly !== 0) {
            throw new Error('actual #256 Predicate V2 modal escaped reviewed capability');
          }
          if (narrowClauseShadow.clauseModalLegacyOnly !== 0) throw new Error('narrow-Clause shadow left unreviewed clause.modal slots');
          if (retireClauseShadow.clauseModalOutput !== 0 || retireClauseShadow.clauseModalPath !== 0) {
            throw new Error('retirement shadow still contains clause.modal');
          }

          const sampleCount = shards.reduce((sum, shard) => sum + shard.sampleCount, 0);
          const drift = {
            parityMismatches: 0,
            currentVsNarrowClauseSuccessMismatch: shards.reduce((sum, shard) => sum + shard.drift.currentVsNarrowSuccessMismatch, 0),
            currentVsRetireSuccessMismatch: shards.reduce((sum, shard) => sum + shard.drift.currentVsRetiredSuccessMismatch, 0),
            currentVsNarrowClauseTextMismatch: shards.reduce((sum, shard) => sum + shard.drift.currentVsNarrowTextMismatch, 0),
            currentVsRetireTextMismatch: shards.reduce((sum, shard) => sum + shard.drift.currentVsRetiredTextMismatch, 0),
            narrowClauseVsRetireTextMismatch: shards.reduce((sum, shard) => sum + shard.drift.narrowVsRetiredTextMismatch, 0),
            currentVsNarrowClauseRootTvCount: tv(current.rootCounts, narrowClauseShadow.rootCounts),
            currentVsRetireRootTvCount: tv(current.rootCounts, retireClauseShadow.rootCounts),
          };
          const ratio = (value, denominator = sampleCount) => denominator === 0 ? 0 : value / denominator;
          const summary = {
            sampleCount,
            shardCount: shards.length,
            exactOfficialParitySampleCount: sampleCount,
            current,
            narrowClauseShadow,
            retireClauseShadow,
            drift,
            rates: {
              currentAnyModalExposure: ratio(current.modalAnyOutput),
              narrowClauseAnyModalExposure: ratio(narrowClauseShadow.modalAnyOutput),
              retireAnyModalExposure: ratio(retireClauseShadow.modalAnyOutput),
              currentPredicateV2ModalExposure: ratio(current.predicateModalOutput),
              currentLegacyNonClauseModalExposure: ratio(current.legacyModalOutput),
              currentClauseModalExposure: ratio(current.clauseModalOutput),
              currentMultiClassModalExposure: ratio(current.modalMultiClassOutput),
              currentClauseReviewedShare: ratio(current.clauseModalReviewed, current.clauseModalSlots),
              narrowClauseReviewedShare: ratio(narrowClauseShadow.clauseModalReviewed, narrowClauseShadow.clauseModalSlots),
              currentVsNarrowClauseTextMismatch: ratio(drift.currentVsNarrowClauseTextMismatch),
              currentVsRetireTextMismatch: ratio(drift.currentVsRetireTextMismatch),
              currentVsNarrowClauseRootTv: ratio(drift.currentVsNarrowClauseRootTvCount),
              currentVsRetireRootTv: ratio(drift.currentVsRetireRootTvCount),
            },
          };
          fs.writeFileSync('clause-modal-migration-2048.json', JSON.stringify(summary, null, 2) + '\n');
          console.log(JSON.stringify(summary, null, 2));
          NODE
      - name: Upload aggregate audit
        uses: actions/upload-artifact@v4
        with:
          name: clause-modal-migration-2048
          path: clause-modal-migration-2048.json
          if-no-files-found: error
