name: tmp Clause modal migration audit

on:
  push:
    branches:
      - agent/clause-modal-migration-audit

permissions:
  contents: read

jobs:
  audit:
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MODAL_AUDIT_SAMPLES: "256"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci --include=dev --ignore-scripts
      - name: Build generated app catalog
        run: npm run app:catalog
      - name: Preserve validated modal replay
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin agent/modal-consumer-incidence-audit
          git show origin/agent/modal-consumer-incidence-audit:scripts/audit-modal-consumer-frontier.ts > scripts/tmp-clause-modal-migration-audit.ts
      - name: Adapt replay to Clause migration strategies
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'scripts/tmp-clause-modal-migration-audit.ts';
          let source = fs.readFileSync(path, 'utf8');

          const compatibilityBefore = `  const compatible = compatibleProfilesForSlot(slot, profileIndex);\n  if (strategy === "current" || !isPredicateModalSlot(slot)) return compatible;\n  return compatible.filter((profile) => reviewedIds.has(profile.id));\n`;
          const compatibilityAfter = `  const compatible = compatibleProfilesForSlot(slot, profileIndex);\n  if (strategy === "current") return compatible;\n  if (isPredicateModalSlot(slot) || isClauseModalSlot(slot)) {\n    return compatible.filter((profile) => reviewedIds.has(profile.id));\n  }\n  return compatible;\n`;
          if (!source.includes(compatibilityBefore)) throw new Error('compatibility strategy insertion point missing');
          source = source.replace(compatibilityBefore, compatibilityAfter);

          const interfaceNeedle = `  predicateModalOutput: number;\n  clauseModalOutput: number;\n  predicateModalSlots: number;\n`;
          const interfaceReplacement = `  predicateModalOutput: number;\n  clauseModalOutput: number;\n  modalAnyOutput: number;\n  modalBothOutput: number;\n  predicateModalSlots: number;\n`;
          if (!source.includes(interfaceNeedle)) throw new Error('aggregate interface insertion point missing');
          source = source.replace(interfaceNeedle, interfaceReplacement);

          const emptyNeedle = `    predicateModalOutput: 0,\n    clauseModalOutput: 0,\n    predicateModalSlots: 0,\n`;
          const emptyReplacement = `    predicateModalOutput: 0,\n    clauseModalOutput: 0,\n    modalAnyOutput: 0,\n    modalBothOutput: 0,\n    predicateModalSlots: 0,\n`;
          if (!source.includes(emptyNeedle)) throw new Error('empty aggregate insertion point missing');
          source = source.replace(emptyNeedle, emptyReplacement);

          const recordNeedle = `  if (predicateModal.length > 0) target.predicateModalOutput += 1;\n  if (clauseModal.length > 0) target.clauseModalOutput += 1;\n  target.predicateModalSlots += predicateModal.length;\n`;
          const recordReplacement = `  if (predicateModal.length > 0) target.predicateModalOutput += 1;\n  if (clauseModal.length > 0) target.clauseModalOutput += 1;\n  if (predicateModal.length > 0 || clauseModal.length > 0) target.modalAnyOutput += 1;\n  if (predicateModal.length > 0 && clauseModal.length > 0) target.modalBothOutput += 1;\n  target.predicateModalSlots += predicateModal.length;\n`;
          if (!source.includes(recordNeedle)) throw new Error('modal exposure insertion point missing');
          source = source.replace(recordNeedle, recordReplacement);

          const summaryNeedle = `    predicateModalOutput: target.predicateModalOutput,\n    clauseModalOutput: target.clauseModalOutput,\n    predicateModalSlots: target.predicateModalSlots,\n`;
          const summaryReplacement = `    predicateModalOutput: target.predicateModalOutput,\n    clauseModalOutput: target.clauseModalOutput,\n    modalAnyOutput: target.modalAnyOutput,\n    modalBothOutput: target.modalBothOutput,\n    predicateModalSlots: target.predicateModalSlots,\n`;
          if (!source.includes(summaryNeedle)) throw new Error('summary exposure insertion point missing');
          source = source.replace(summaryNeedle, summaryReplacement);

          fs.writeFileSync(path, source);
          NODE
          sed -i "s/modal-consumer-frontier:/clause-modal-migration-${{ matrix.shard }}:/g" scripts/tmp-clause-modal-migration-audit.ts
      - name: Audit Clause modal migration
        shell: bash
        run: |
          set -o pipefail
          npx tsx scripts/tmp-clause-modal-migration-audit.ts | tee clause-modal-migration-${{ matrix.shard }}.json
      - name: Upload shard audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clause-modal-migration-shard-${{ matrix.shard }}
          path: clause-modal-migration-${{ matrix.shard }}.json
          if-no-files-found: error

  aggregate:
    needs: audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: clause-modal-migration-shard-*
          path: modal-shards
          merge-multiple: true
      - name: Aggregate 2048-seed migration audit
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const directory = 'modal-shards';
          const files = fs.readdirSync(directory).filter((name) => name.endsWith('.json')).sort();
          if (files.length !== 8) throw new Error(`expected 8 shard artifacts, got ${files.length}`);
          const shards = files.map((name) => JSON.parse(fs.readFileSync(path.join(directory, name), 'utf8')));
          if (shards.some((shard) => shard.sampleCount !== 256)) throw new Error('every shard must contain exactly 256 samples');
          if (shards.some((shard) => shard.drift.parityMismatches !== 0)) throw new Error('one or more shards diverged from official #256 composer');

          const numericFields = [
            'success', 'clauseModalPath', 'predicateExpandedPath',
            'predicateModalOutput', 'clauseModalOutput', 'modalAnyOutput', 'modalBothOutput',
            'predicateModalSlots', 'clauseModalSlots',
            'predicateModalReviewed', 'predicateModalLegacyOnly', 'predicateModalPredicateOnly',
            'clauseModalReviewed', 'clauseModalLegacyOnly',
          ];
          const recordFields = ['rootCounts', 'fallbackCounts', 'predicateModalForms', 'clauseModalForms'];
          function sumRecord(values) {
            const out = {};
            for (const value of values) for (const [key, count] of Object.entries(value)) out[key] = (out[key] ?? 0) + count;
            return Object.fromEntries(Object.entries(out).sort(([a], [b]) => a.localeCompare(b, 'zh-Hant')));
          }
          function aggregate(key) {
            const out = {};
            for (const field of numericFields) out[field] = shards.reduce((sum, shard) => sum + shard[key][field], 0);
            for (const field of recordFields) out[field] = sumRecord(shards.map((shard) => shard[key][field]));
            return out;
          }
          function tv(left, right) {
            const keys = new Set([...Object.keys(left), ...Object.keys(right)]);
            let absolute = 0;
            for (const key of keys) absolute += Math.abs((left[key] ?? 0) - (right[key] ?? 0));
            return absolute / 2;
          }

          const current = aggregate('current');
          const narrowBothShadow = aggregate('narrowPredicateShadow');
          const retireClauseShadow = aggregate('narrowAndRetireClauseShadow');
          if (current.predicateModalLegacyOnly !== 0 || current.predicateModalPredicateOnly !== 0) {
            throw new Error('current #256 Predicate modal escaped reviewed capability');
          }
          if (narrowBothShadow.clauseModalLegacyOnly !== 0) throw new Error('narrow-both shadow left unreviewed Clause modal slots');
          if (retireClauseShadow.clauseModalOutput !== 0 || retireClauseShadow.clauseModalPath !== 0) {
            throw new Error('retirement shadow still contains clause.modal');
          }

          const sampleCount = shards.reduce((sum, shard) => sum + shard.sampleCount, 0);
          const drift = {
            parityMismatches: 0,
            currentVsNarrowBothSuccessMismatch: shards.reduce((sum, shard) => sum + shard.drift.currentVsNarrowSuccessMismatch, 0),
            currentVsRetireSuccessMismatch: shards.reduce((sum, shard) => sum + shard.drift.currentVsRetiredSuccessMismatch, 0),
            currentVsNarrowBothTextMismatch: shards.reduce((sum, shard) => sum + shard.drift.currentVsNarrowTextMismatch, 0),
            currentVsRetireTextMismatch: shards.reduce((sum, shard) => sum + shard.drift.currentVsRetiredTextMismatch, 0),
            narrowBothVsRetireTextMismatch: shards.reduce((sum, shard) => sum + shard.drift.narrowVsRetiredTextMismatch, 0),
            currentVsNarrowBothRootTvCount: tv(current.rootCounts, narrowBothShadow.rootCounts),
            currentVsRetireRootTvCount: tv(current.rootCounts, retireClauseShadow.rootCounts),
          };
          const ratio = (value, denominator = sampleCount) => denominator === 0 ? 0 : value / denominator;
          const summary = {
            sampleCount,
            shardCount: shards.length,
            exactOfficialParitySampleCount: sampleCount,
            current,
            narrowBothShadow,
            retireClauseShadow,
            drift,
            rates: {
              currentAnyModalExposure: ratio(current.modalAnyOutput),
              narrowBothAnyModalExposure: ratio(narrowBothShadow.modalAnyOutput),
              retireAnyModalExposure: ratio(retireClauseShadow.modalAnyOutput),
              currentPredicateModalExposure: ratio(current.predicateModalOutput),
              currentClauseModalExposure: ratio(current.clauseModalOutput),
              currentBothModalExposure: ratio(current.modalBothOutput),
              narrowBothClauseReviewedShare: ratio(narrowBothShadow.clauseModalReviewed, narrowBothShadow.clauseModalSlots),
              currentVsNarrowBothTextMismatch: ratio(drift.currentVsNarrowBothTextMismatch),
              currentVsRetireTextMismatch: ratio(drift.currentVsRetireTextMismatch),
              currentVsNarrowBothRootTv: ratio(drift.currentVsNarrowBothRootTvCount),
              currentVsRetireRootTv: ratio(drift.currentVsRetireRootTvCount),
            },
          };
          fs.writeFileSync('clause-modal-migration-2048.json', JSON.stringify(summary, null, 2) + '\n');
          console.log(JSON.stringify(summary, null, 2));
          NODE
      - name: Upload aggregate audit
        uses: actions/upload-artifact@v4
        with:
          name: clause-modal-migration-2048
          path: clause-modal-migration-2048.json
          if-no-files-found: error
