name: Apply display settings order

on:
  push:
    branches:
      - agent/move-display-settings
    paths:
      - .github/workflows/apply-display-order.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/move-display-settings
          fetch-depth: 0
      - name: Move display settings below recent history
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/app/main.ts")
          source = path.read_text(encoding="utf-8")
          display_start_marker = '''    <section class="panel-section">
                <div class="panel-heading"><h3>顯示</h3></div>'''.replace("                ", "      ")
          weak_marker = '    <section class="panel-section" data-legacy-weak-section="true">'
          selection_marker = '''    <section class="panel-section">
                <div class="panel-heading panel-heading-inline">
                  <h3>選題權重</h3>'''.replace("                ", "      ").replace("                  ", "        ")

          start = source.index(display_start_marker)
          end = source.index(weak_marker, start)
          display_block = source[start:end]
          source_without_display = source[:start] + source[end:]
          insert_at = source_without_display.index(selection_marker, start)
          updated = source_without_display[:insert_at] + display_block + source_without_display[insert_at:]

          if updated == source:
              raise SystemExit("Display block was not moved")
          if updated.count("<h3>顯示</h3>") != 1:
              raise SystemExit("Unexpected display section count")
          path.write_text(updated, encoding="utf-8")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/main.ts
          git commit -m "Move display settings below recent history"
          git push origin HEAD:agent/move-display-settings
