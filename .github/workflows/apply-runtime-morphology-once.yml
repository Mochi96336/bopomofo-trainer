name: apply runtime morphology once

on:
  push:
    branches:
      - agent/formal-syntax-v2-morphology-identity-provenance

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/formal-syntax-v2-morphology-identity-provenance
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci --include=dev --ignore-scripts
      - name: Regenerate pinned runtime morphology
        run: npm run grammar:runtime-morphology -- --write
      - name: Commit generated artifact and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-runtime-morphology-once.yml
          git add data/grammar/formal-syntax-active-catalog-profiles.json
          git diff --cached --quiet && exit 1
          git commit -m "data: regenerate identity-safe runtime morphology"
          git push origin HEAD:agent/formal-syntax-v2-morphology-identity-provenance
