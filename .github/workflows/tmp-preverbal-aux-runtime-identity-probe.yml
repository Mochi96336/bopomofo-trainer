name: tmp preverbal AUX runtime identity probe

on:
  pull_request:
    paths:
      - "scripts/probe-preverbal-aux-runtime-identity.ts"
      - "scripts/migrate-active-runtime-preverbal-aux-occurrence-capabilities.ts"
      - "src/syntax/runtime-occurrence-capabilities.ts"
      - "src/syntax/runtime-occurrence-capability-projection.ts"
      - "src/syntax/types.ts"
      - ".github/workflows/tmp-preverbal-aux-runtime-identity-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci --include=dev --ignore-scripts
      - name: Measure identity frontier
        run: npx tsx scripts/probe-preverbal-aux-runtime-identity.ts
      - name: Build sidecar candidate
        run: >-
          npx tsx scripts/migrate-active-runtime-preverbal-aux-occurrence-capabilities.ts
          --write
          --output runtime-preverbal-aux-occurrence-capabilities-candidate.json
      - name: Upload sidecar candidate
        uses: actions/upload-artifact@v4
        with:
          name: runtime-preverbal-aux-occurrence-capabilities-candidate
          path: runtime-preverbal-aux-occurrence-capabilities-candidate.json
