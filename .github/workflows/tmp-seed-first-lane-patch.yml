name: tmp seed first lane patch

on:
  push:
    branches:
      - agent/nested-clause-seed-first-lane

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Apply first-lane seed patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('src/core/stable-id.ts')
          source = path.read_text()
          old = '''function finalizeHash32(hash: number): string {
            hash ^= hash >>> 16;
            hash = Math.imul(hash, 0x85ebca6b) >>> 0;
            hash ^= hash >>> 13;
            hash = Math.imul(hash, 0xc2b2ae35) >>> 0;
            hash ^= hash >>> 16;
            return (hash >>> 0).toString(16).padStart(8, "0");
          }
          '''
          new = '''function finalizeHash32Value(hash: number): number {
            hash ^= hash >>> 16;
            hash = Math.imul(hash, 0x85ebca6b) >>> 0;
            hash ^= hash >>> 13;
            hash = Math.imul(hash, 0xc2b2ae35) >>> 0;
            hash ^= hash >>> 16;
            return hash >>> 0;
          }

          function finalizeHash32(hash: number): string {
            return finalizeHash32Value(hash).toString(16).padStart(8, "0");
          }

          function hashRuntimeSourceFirst32(source: string): number {
            let hash = (0x811c9dc5 ^ RUNTIME_DIGEST_SEEDS[0]) >>> 0;
            for (let index = 0; index < source.length; index += 1) {
              hash = Math.imul(hash ^ source.charCodeAt(index), 0x01000193) >>> 0;
            }
            return finalizeHash32Value(hash);
          }
          '''
          if source.count(old) != 1:
            raise SystemExit(f'finalizeHash32 anchor count {source.count(old)}')
          source = source.replace(old, new)
          old = '''export function stableRuntimeDigestCanonicalJson(source: string): string {
            return hashRuntimeSource(source);
          }
          '''
          new = '''export function stableRuntimeDigestCanonicalJson(source: string): string {
            return hashRuntimeSource(source);
          }

          /**
           * Return the first 32-bit lane of the stable runtime digest for JSON that
           * the caller has already proven canonical. This is byte-for-byte equal to
           * parsing the first eight hex digits of stableRuntimeDigestCanonicalJson().
           */
          export function stableRuntimeDigestCanonicalJsonFirstUint32(source: string): number {
            return hashRuntimeSourceFirst32(source);
          }
          '''
          if source.count(old) != 1:
            raise SystemExit(f'canonical digest export anchor count {source.count(old)}')
          path.write_text(source.replace(old, new))

          path = Path('src/syntax/sample.ts')
          source = path.read_text()
          old = '''import { stableRuntimeDigest, stableRuntimeDigestCanonicalJson } from "../core/stable-id.js";'''
          new = '''import {
            stableRuntimeDigest,
            stableRuntimeDigestCanonicalJson,
            stableRuntimeDigestCanonicalJsonFirstUint32,
          } from "../core/stable-id.js";'''
          if source.count(old) != 1:
            raise SystemExit(f'sample import anchor count {source.count(old)}')
          source = source.replace(old, new)
          old = '''function nestedClauseKeyedDigest(
            purpose: "candidate-substream" | "priority",
            ticket: number,
            ruleId: string,
          ): string {
            // These keys are already in stableRuntimeDigest canonical sort order:
            // purpose, ruleId, ticket, version. Keep this byte-for-byte equivalent.
            const canonicalJson = JSON.stringify({
              purpose,
              ruleId,
              ticket,
              version: NESTED_CLAUSE_RULE_ORDER_VERSION,
            });
            return stableRuntimeDigestCanonicalJson(canonicalJson);
          }

          function nestedClauseCandidateSeed(ticket: number, ruleId: string): number {
            const digest = nestedClauseKeyedDigest("candidate-substream", ticket, ruleId);
            return Number.parseInt(digest.slice(0, 8), 16) >>> 0;
          }
          '''
          new = '''function nestedClauseKeyedCanonicalJson(
            purpose: "candidate-substream" | "priority",
            ticket: number,
            ruleId: string,
          ): string {
            // These keys are already in stableRuntimeDigest canonical sort order:
            // purpose, ruleId, ticket, version. Keep this byte-for-byte equivalent.
            return JSON.stringify({
              purpose,
              ruleId,
              ticket,
              version: NESTED_CLAUSE_RULE_ORDER_VERSION,
            });
          }

          function nestedClauseKeyedDigest(
            purpose: "candidate-substream" | "priority",
            ticket: number,
            ruleId: string,
          ): string {
            return stableRuntimeDigestCanonicalJson(
              nestedClauseKeyedCanonicalJson(purpose, ticket, ruleId),
            );
          }

          function nestedClauseCandidateSeed(ticket: number, ruleId: string): number {
            return stableRuntimeDigestCanonicalJsonFirstUint32(
              nestedClauseKeyedCanonicalJson("candidate-substream", ticket, ruleId),
            );
          }
          '''
          if source.count(old) != 1:
            raise SystemExit(f'nested digest anchor count {source.count(old)}')
          path.write_text(source.replace(old, new))

          path = Path('tests/core/stable-id.test.ts')
          source = path.read_text()
          old = '''import { stableRuntimeDigest, stableRuntimeDigestCanonicalJson } from "../../src/core/stable-id.js";'''
          new = '''import {
            stableRuntimeDigest,
            stableRuntimeDigestCanonicalJson,
            stableRuntimeDigestCanonicalJsonFirstUint32,
          } from "../../src/core/stable-id.js";'''
          if source.count(old) != 1:
            raise SystemExit(f'test import anchor count {source.count(old)}')
          source = source.replace(old, new)
          old = '''          expect(stableRuntimeDigestCanonicalJson(canonicalJson)).toBe(legacy);
          '''
          new = '''          const direct = stableRuntimeDigestCanonicalJson(canonicalJson);
          expect(direct).toBe(legacy);
          expect(stableRuntimeDigestCanonicalJsonFirstUint32(canonicalJson)).toBe(
            Number.parseInt(legacy.slice(0, 8), 16) >>> 0,
          );
          '''
          if source.count(old) != 1:
            raise SystemExit(f'test equivalence anchor count {source.count(old)}')
          path.write_text(source.replace(old, new))
          PY
      - run: npm ci --include=dev --ignore-scripts
      - run: npm run app:catalog
      - run: npm run typecheck
      - name: Targeted tests
        run: npx vitest run tests/core/stable-id.test.ts tests/syntax/sample.test.ts tests/curriculum/formal-syntax-utterance.test.ts tests/curriculum/frequency-first-utterance.test.ts
      - name: Commit prototype and remove staging workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/tmp-seed-first-lane-patch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/core/stable-id.ts src/syntax/sample.ts tests/core/stable-id.test.ts .github/workflows/tmp-seed-first-lane-patch.yml
          git commit -m 'perf(syntax): compute nested candidate seed from first digest lane'
          git push origin HEAD:agent/nested-clause-seed-first-lane
