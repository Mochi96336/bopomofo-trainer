name: Deploy Pages

on:
  workflow_run:
    workflows:
      - check
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One group for the site, not one per commit. Keying on the SHA put every commit
# in a group of its own, where `cancel-in-progress` could only ever cancel a
# repeat of the same commit -- so an older run that finished late still landed
# last and became the live site. A fixed group is what makes the newest push win.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    # A manual run used to be allowed unconditionally, and it checks out whatever
    # ref was chosen at dispatch -- so any branch, checked or not, could be put
    # live by hand. It is held to `main` here, which is the branch `check` gates.
    if: >-
      (
        github.event_name == 'workflow_dispatch'
        && github.ref == 'refs/heads/main'
      )
      || (
        github.event.workflow_run.conclusion == 'success'
        && github.event.workflow_run.event == 'push'
        && github.event.workflow_run.head_branch == 'main'
        && github.event.workflow_run.head_repository.full_name == github.repository
      )
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Install dependencies
        run: npm ci --include=dev --ignore-scripts
      - name: Build checked commit for custom-domain Pages
        run: npm run build -- --base="/"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
