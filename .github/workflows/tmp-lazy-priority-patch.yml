name: tmp lazy nested priority patch

on:
  push:
    branches:
      - agent/lazy-nested-priority-digest

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Apply lazy priority patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          sample = Path('src/syntax/sample.ts')
          source = sample.read_text()
          old_digest = '''function nestedClauseKeyedDigest(
            purpose: "candidate-substream" | "priority",
            ticket: number,
            ruleId: string,
          ): string {
            return stableRuntimeDigestCanonicalJson(
              nestedClauseKeyedCanonicalJson(purpose, ticket, ruleId),
            );
          }

          '''
          new_digest = '''function nestedClausePriorityFirstHex(canonicalJson: string): string {
            return stableRuntimeDigestCanonicalJsonFirstUint32(canonicalJson)
              .toString(16)
              .padStart(8, "0");
          }

          '''
          if source.count(old_digest) != 1:
            raise SystemExit(f'digest anchor count {source.count(old_digest)}')
          source = source.replace(old_digest, new_digest)

          old_candidates = '''function stableNestedClauseCandidates(
            values: readonly ProductionRule[],
            random: RandomSource,
          ): readonly NestedClauseCandidate[] {
            if (values.length === 0) return [];
            const ticket = Math.floor(nextUnit(random) * 0x1_0000_0000);
            return values
              .map((rule) => ({
                rule,
                random: nestedClauseCandidateRandom(ticket, rule.id),
                priority: nestedClauseKeyedDigest("priority", ticket, rule.id),
              }))
              .sort((left, right) => {
                const priorityOrder = left.priority.localeCompare(right.priority);
                return priorityOrder !== 0 ? priorityOrder : left.rule.id.localeCompare(right.rule.id);
              })
              .map(({ rule, random: candidateRandom }) => ({ rule, random: candidateRandom }));
          }
          '''
          new_candidates = '''function stableNestedClauseCandidates(
            values: readonly ProductionRule[],
            random: RandomSource,
          ): readonly NestedClauseCandidate[] {
            if (values.length === 0) return [];
            const ticket = Math.floor(nextUnit(random) * 0x1_0000_0000);
            return values
              .map((rule) => {
                const priorityCanonicalJson = nestedClauseKeyedCanonicalJson("priority", ticket, rule.id);
                return {
                  rule,
                  random: nestedClauseCandidateRandom(ticket, rule.id),
                  priorityCanonicalJson,
                  priorityFirstHex: nestedClausePriorityFirstHex(priorityCanonicalJson),
                };
              })
              .sort((left, right) => {
                const firstLaneOrder = left.priorityFirstHex.localeCompare(right.priorityFirstHex);
                if (firstLaneOrder !== 0) return firstLaneOrder;
                const priorityOrder = stableRuntimeDigestCanonicalJson(left.priorityCanonicalJson)
                  .localeCompare(stableRuntimeDigestCanonicalJson(right.priorityCanonicalJson));
                return priorityOrder !== 0 ? priorityOrder : left.rule.id.localeCompare(right.rule.id);
              })
              .map(({ rule, random: candidateRandom }) => ({ rule, random: candidateRandom }));
          }
          '''
          if source.count(old_candidates) != 1:
            raise SystemExit(f'candidate anchor count {source.count(old_candidates)}')
          sample.write_text(source.replace(old_candidates, new_candidates))

          test = Path('tests/syntax/nested-clause-order-stability.test.ts')
          source = test.read_text()
          import_anchor = 'import type { RandomSource } from "../../src/core/model.js";\n'
          import_replacement = '''import type { RandomSource } from "../../src/core/model.js";
          import {
            stableRuntimeDigestCanonicalJson,
            stableRuntimeDigestCanonicalJsonFirstUint32,
          } from "../../src/core/stable-id.js";
          '''
          if source.count(import_anchor) != 1:
            raise SystemExit(f'import anchor count {source.count(import_anchor)}')
          source = source.replace(import_anchor, import_replacement)

          closing = '''  it("does not let a failed peer candidate consume the parent RNG trajectory", () => {
          '''
          collision_test = '''  it("preserves full digest ordering when priority first lanes collide", () => {
            const collisionRuleIds = [
              "clause.collision.q2ht6isztaqs",
              "clause.collision.cdy5up25acqx",
            ] as const;
            const prioritySource = (ruleId: string) => JSON.stringify({
              purpose: "priority",
              ruleId,
              ticket: 0,
              version: NESTED_CLAUSE_RULE_ORDER_VERSION,
            });
            const firstLanes = collisionRuleIds.map((ruleId) =>
              stableRuntimeDigestCanonicalJsonFirstUint32(prioritySource(ruleId)),
            );
            expect(firstLanes[0]).toBe(firstLanes[1]);
            expect(firstLanes[0]!.toString(16).padStart(8, "0")).toBe("d80e15a2");

            const expectedRuleId = [...collisionRuleIds].sort((left, right) => {
              const digestOrder = stableRuntimeDigestCanonicalJson(prioritySource(left))
                .localeCompare(stableRuntimeDigestCanonicalJson(prioritySource(right)));
              return digestOrder !== 0 ? digestOrder : left.localeCompare(right);
            })[0];
            const collisionRules = collisionRuleIds.map((ruleId) =>
              production(ruleId, "Clause", [constituent("head", "Lexeme")]),
            );
            const sampled = sampleWith([sentenceRule, ...collisionRules], [0]);
            expect(sampled.shape.productionRulePath[1]).toBe(expectedRuleId);
          });

          '''
          if source.count(closing) != 1:
            raise SystemExit(f'test anchor count {source.count(closing)}')
          test.write_text(source.replace(closing, collision_test + closing))
          PY
      - run: npm ci --include=dev --ignore-scripts
      - run: npm run app:catalog
      - run: npm run typecheck
      - name: Targeted tests
        run: npx vitest run tests/core/stable-id.test.ts tests/syntax/nested-clause-order-stability.test.ts tests/syntax/sample.test.ts tests/curriculum/formal-syntax-utterance.test.ts
      - name: Commit prototype and remove staging workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/tmp-lazy-priority-patch.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/syntax/sample.ts tests/syntax/nested-clause-order-stability.test.ts .github/workflows/tmp-lazy-priority-patch.yml
          git commit -m "perf(syntax): lazily complete nested priority digests"
          git push origin HEAD:agent/lazy-nested-priority-digest
