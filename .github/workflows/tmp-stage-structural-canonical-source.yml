name: tmp stage structural canonical source

on:
  push:
    branches:
      - agent/structural-canonical-source

permissions:
  contents: write

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci --include=dev --ignore-scripts
      - run: npm run app:catalog
      - name: Capture production snapshot
        run: node --import tsx .tmp-structural-snapshot.ts | tee /tmp/production-snapshot.txt
      - name: Apply candidate
        run: |
          python .tmp-stage-structural-canonical-source.py
          sed -i '/^  stableRuntimeDigest,$/d' src/syntax/sample.ts
      - name: Typecheck
        run: npm run typecheck
      - name: Targeted tests
        run: npx vitest run tests/syntax/sample.test.ts tests/curriculum/formal-syntax-utterance.test.ts tests/curriculum/frequency-first-utterance.test.ts tests/product/session.test.ts
      - name: Verify exact product snapshot
        run: |
          node --import tsx .tmp-structural-snapshot.ts | tee /tmp/candidate-snapshot.txt
          diff -u /tmp/production-snapshot.txt /tmp/candidate-snapshot.txt
      - name: Commit candidate and cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/syntax/sample.ts
          git commit -m 'perf(syntax): reuse structural canonical sources'
          git rm .github/workflows/tmp-stage-structural-canonical-source.yml .tmp-stage-structural-canonical-source.py .tmp-structural-snapshot.ts
          git commit -m 'chore: remove structural canonical staging files'
          git push origin HEAD:agent/structural-canonical-source
