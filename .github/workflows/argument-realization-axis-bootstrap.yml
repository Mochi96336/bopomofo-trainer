name: argument realization axis bootstrap

on:
  push:
    branches:
      - agent/argument-realization-axis-migration
    paths:
      - .github/workflows/argument-realization-axis-bootstrap.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/argument-realization-axis-migration
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --include=dev --ignore-scripts
      - name: Apply ownership migration
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str):
              p = Path(path)
              text = p.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f"expected exactly one match in {path}: {old[:80]!r}; got {text.count(old)}")
              p.write_text(text.replace(old, new), newline='\n')

          # Structural sampler: allow an orthogonal practice contract to require
          # that at least one named production actually appears in the sampled path.
          replace_once(
              'src/syntax/sample.ts',
              '  readonly nestedProductionTargets?: readonly NestedProductionTarget[];\n  /**\n   * Require at least one realized lexical slot matching both lexical requirements',
              '  readonly nestedProductionTargets?: readonly NestedProductionTarget[];\n  /**\n   * Require the sampled production path to contain at least one named rule.\n   * This is useful when several alternative parents share one orthogonal practice axis.\n   */\n  readonly requiredProductionRuleIdsAnyOf?: readonly string[];\n  /**\n   * Require at least one realized lexical slot matching both lexical requirements',
          )
          replace_once(
              'src/syntax/sample.ts',
              'function lexicalSlotMatchesConstraint(\n',
              '''function validatedRequiredProductionRuleIdsAnyOf(\n  options: StructuralSamplingOptions,\n): readonly string[] | undefined {\n  const requested = options.requiredProductionRuleIdsAnyOf;\n  if (requested === undefined) return undefined;\n  if (requested.length === 0) {\n    throw new Error("requiredProductionRuleIdsAnyOf requires at least one production rule");\n  }\n  const unique = [...new Set(requested)];\n  if (unique.length != requested.length) {\n    throw new Error("requiredProductionRuleIdsAnyOf contains duplicate production rules");\n  }\n  const known = new Set(options.rules.map((rule) => rule.id));\n  const missing = unique.filter((ruleId) => !known.has(ruleId));\n  if (missing.length > 0) {\n    throw new Error(`requiredProductionRuleIdsAnyOf references missing productions: ${missing.join(", ")}`);\n  }\n  return unique;\n}\n\nfunction lexicalSlotMatchesConstraint(\n''',
          )
          replace_once(
              'src/syntax/sample.ts',
              '  const nestedProductionTargets = validatedNestedProductionTargets(options, bounds);\n  const rulesByOutput',
              '  const nestedProductionTargets = validatedNestedProductionTargets(options, bounds);\n  const requiredProductionRuleIdsAnyOf = validatedRequiredProductionRuleIdsAnyOf(options);\n  const rulesByOutput',
          )
          replace_once(
              'src/syntax/sample.ts',
              '''    if (requiredLexicalSlot !== undefined\n      && !sampled.slotContexts.some((context) =>\n        lexicalSlotMatchesConstraint(context, requiredLexicalSlot),\n      )) continue;\n    const identity = {''',
              '''    if (requiredLexicalSlot !== undefined\n      && !sampled.slotContexts.some((context) =>\n        lexicalSlotMatchesConstraint(context, requiredLexicalSlot),\n      )) continue;\n    if (requiredProductionRuleIdsAnyOf !== undefined\n      && !requiredProductionRuleIdsAnyOf.some((ruleId) => sampled.rulePath.includes(ruleId))) continue;\n    const identity = {''',
          )

          # Core frames own valency identity; surface subject/object realization is optional legality.
          replace_once(
              'src/syntax/clause-rules.ts',
              '''  production("clause.intransitive", "Clause", [\n    subject(),\n    corePredicate(["intransitive", "ambitransitive"]),\n  ]),\n  production("clause.transitive", "Clause", [\n    subject(),\n    corePredicate(["transitive", "ambitransitive"]),\n    object(),\n  ]),\n  production("clause.ditransitive", "Clause", [\n    subject(),\n    corePredicate(["ditransitive"]),\n    indirectObject(),\n    object(),\n  ]),''',
              '''  production("clause.intransitive", "Clause", [\n    subject({ minimum: 0, maximum: 1 }),\n    corePredicate(["intransitive", "ambitransitive"]),\n  ]),\n  production("clause.transitive", "Clause", [\n    subject({ minimum: 0, maximum: 1 }),\n    corePredicate(["transitive", "ambitransitive"]),\n    object({ minimum: 0, maximum: 1 }),\n  ]),\n  production("clause.ditransitive", "Clause", [\n    subject({ minimum: 0, maximum: 1 }),\n    corePredicate(["ditransitive"]),\n    indirectObject(),\n    object({ minimum: 0, maximum: 1 }),\n  ]),''',
          )
          replace_once(
              'src/syntax/clause-rules.ts',
              '''  production("clause.subject-omission", "Clause", [\n    corePredicate([\n      "intransitive", "transitive", "ditransitive", "ambitransitive",\n      "clausal-complement", "open-clausal-complement", "adpositional-complement",\n    ]),\n    object({ minimum: 0, maximum: 1 }),\n  ]),\n  production("clause.object-omission", "Clause", [\n    subject(),\n    corePredicate(["transitive", "ditransitive", "ambitransitive"]),\n  ]),\n''',
              '',
          )

          # Product taxonomy no longer gives omission peer-Clause family identity.
          replace_once(
              'src/curriculum/formal-syntax-taxonomy.ts',
              '  | "information.subject-omission"\n  | "information.object-omission"\n',
              '',
          )
          replace_once(
              'src/curriculum/formal-syntax-taxonomy.ts',
              '''  "clause.subject-omission": {\n    kind: "information-structure",\n    family: "information.subject-omission",\n  },\n  "clause.object-omission": {\n    kind: "information-structure",\n    family: "information.object-omission",\n  },\n''',
              '',
          )

          # Move both legacy omission rules from current executable inventory to retired decisions.
          replace_once(
              'src/syntax/clause-model-v2.ts',
              '''  "clause.modal": {\n    targetAxes: ["predicate-marking"],\n    evidenceContract: "preverbal-auxiliary-same-occurrence",\n    note: "Clause-level modality ownership is retired; reviewed preverbal-AUX evidence remains on predicate-internal modal slots and product practice is controlled by the orthogonal predicate-marking ticket.",\n  },\n''',
              '''  "clause.modal": {\n    targetAxes: ["predicate-marking"],\n    evidenceContract: "preverbal-auxiliary-same-occurrence",\n    note: "Clause-level modality ownership is retired; reviewed preverbal-AUX evidence remains on predicate-internal modal slots and product practice is controlled by the orthogonal predicate-marking ticket.",\n  },\n  "clause.subject-omission": {\n    targetAxes: ["argument-realization"],\n    evidenceContract: "pinned-gsd-argument-realization-alternation-v1",\n    note: "Subject non-realization is licensed on preserved core predicate frames and practiced through the orthogonal argument-realization ticket; it no longer competes as a peer Clause production.",\n  },\n  "clause.object-omission": {\n    targetAxes: ["argument-realization"],\n    evidenceContract: "pinned-gsd-argument-realization-alternation-v1",\n    note: "Direct-object non-realization preserves transitive/ditransitive predicate-frame identity and is practiced through the orthogonal argument-realization ticket.",\n  },\n''',
          )
          replace_once(
              'src/syntax/clause-model-v2.ts',
              '''  "clause.subject-omission": {\n    group: "move-to-axis",\n    targetAxis: "argument-realization",\n    target: "subject.omitted",\n    note: "Omission changes surface realization, not lexical valency or core Clause identity.",\n  },\n  "clause.object-omission": {\n    group: "move-to-axis",\n    targetAxis: "argument-realization",\n    target: "object.omitted",\n    note: "Omission changes surface realization while preserving an object-capable predicate frame.",\n  },\n''',
              '',
          )

          # Sampling policy: derive a domain-separated realization ticket from the already-consumed
          # inert terminal draw, preserving parent RNG and all predicate-marking boundaries.
          replace_once(
              'src/curriculum/formal-syntax-sampling-policy.ts',
              'import type { RandomSource } from "../core/model.js";\n',
              'import type { RandomSource } from "../core/model.js";\nimport { stableRuntimeDigest } from "../core/stable-id.js";\n',
          )
          replace_once(
              'src/curriculum/formal-syntax-sampling-policy.ts',
              '''export interface PredicateMarkingPracticeWeights {\n  readonly ordinary: number;\n  readonly modal: number;\n  readonly aspect: number;\n  readonly negation: number;\n}\n\nexport interface FormalSyntaxSamplingPolicy {''',
              '''export interface PredicateMarkingPracticeWeights {\n  readonly ordinary: number;\n  readonly modal: number;\n  readonly aspect: number;\n  readonly negation: number;\n}\n\nexport type ArgumentRealizationPracticeIntent =\n  | "ordinary"\n  | "subject-omission"\n  | "object-omission";\n\nexport interface ArgumentRealizationPracticeWeights {\n  readonly ordinary: number;\n  readonly subjectOmission: number;\n  readonly objectOmission: number;\n}\n\nexport interface FormalSyntaxSamplingPolicy {''',
          )
          replace_once(
              'src/curriculum/formal-syntax-sampling-policy.ts',
              '''  /** Product practice intent for predicate-internal marking, separate from grammar legality. */\n  readonly predicateMarkingPracticeWeights: PredicateMarkingPracticeWeights;\n}''',
              '''  /** Product practice intent for predicate-internal marking, separate from grammar legality. */\n  readonly predicateMarkingPracticeWeights: PredicateMarkingPracticeWeights;\n  /** Product practice intent for overt/absent core arguments, separate from predicate-frame identity. */\n  readonly argumentRealizationPracticeWeights: ArgumentRealizationPracticeWeights;\n}''',
          )
          replace_once(
              'src/curriculum/formal-syntax-sampling-policy.ts',
              '''  version: "formal-syntax-family-sampling-v7",''',
              '''  version: "formal-syntax-family-sampling-v8",''',
          )
          replace_once(
              'src/curriculum/formal-syntax-sampling-policy.ts',
              '''  predicateMarkingPracticeWeights: { ordinary: 0.831, modal: 0.057, aspect: 0.055, negation: 0.057 },\n};''',
              '''  predicateMarkingPracticeWeights: { ordinary: 0.831, modal: 0.057, aspect: 0.055, negation: 0.057 },\n  // Provisional bootstrap prior from the #266 legacy product-exposure meter.\n  // This is a calibration seed, not a corpus/linguistic omission probability.\n  argumentRealizationPracticeWeights: { ordinary: 0.8096, subjectOmission: 0.1025, objectOmission: 0.0879 },\n};''',
          )
          replace_once(
              'src/curriculum/formal-syntax-sampling-policy.ts',
              '''  if (!(marking.ordinary > 0 || marking.modal > 0 || marking.aspect > 0 || marking.negation > 0)) {\n    throw new Error("predicate marking practice weights require positive mass");\n  }\n}''',
              '''  if (!(marking.ordinary > 0 || marking.modal > 0 || marking.aspect > 0 || marking.negation > 0)) {\n    throw new Error("predicate marking practice weights require positive mass");\n  }\n  const realization = policy.argumentRealizationPracticeWeights;\n  if ([realization.ordinary, realization.subjectOmission, realization.objectOmission]\n    .some((weight) => !Number.isFinite(weight) || weight < 0)) {\n    throw new Error("argument realization practice weights must be finite and non-negative");\n  }\n  if (!(realization.ordinary > 0 || realization.subjectOmission > 0 || realization.objectOmission > 0)) {\n    throw new Error("argument realization practice weights require positive mass");\n  }\n}''',
          )
          replace_once(
              'src/curriculum/formal-syntax-sampling-policy.ts',
              '''/**\n * Build one weighted permutation over active Sentence construction families using\n * the joint family prior P(kind) × P(family | kind). Legal but inactive families\n * stay in the grammar/taxonomy and receive no product root attempts.\n */''',
              '''export const ARGUMENT_REALIZATION_PRACTICE_TICKET_VERSION =\n  "argument-realization-practice-ticket-v1" as const;\n\n/**\n * Domain-separate a second product-practice ticket from the already-consumed,\n * behaviorally inert terminal Sentence-family draw. This consumes no parent RNG\n * and leaves Predicate marking's historical ticket intervals unchanged.\n */\nexport function argumentRealizationPracticeTicketUnitForTerminalUnit(ticketUnit: number): number {\n  if (!Number.isFinite(ticketUnit) || ticketUnit < 0 || ticketUnit >= 1) {\n    throw new Error("argument realization terminal ticket unit must be in [0, 1)");\n  }\n  const digest = stableRuntimeDigest({\n    version: ARGUMENT_REALIZATION_PRACTICE_TICKET_VERSION,\n    ticketUnit,\n  });\n  return Number.parseInt(digest.slice(0, 13), 16) / 0x1_0000_0000_0000;\n}\n\nexport function argumentRealizationPracticeIntentForTicketUnit(\n  terminalTicketUnit: number,\n  policy: FormalSyntaxSamplingPolicy = PRODUCT_FORMAL_SYNTAX_SAMPLING_POLICY,\n): ArgumentRealizationPracticeIntent {\n  validateFormalSyntaxSamplingPolicy(policy);\n  const ticketUnit = argumentRealizationPracticeTicketUnitForTerminalUnit(terminalTicketUnit);\n  const weights = policy.argumentRealizationPracticeWeights;\n  const total = weights.ordinary + weights.subjectOmission + weights.objectOmission;\n  const ordinaryBoundary = weights.ordinary / total;\n  if (ticketUnit < ordinaryBoundary) return "ordinary";\n  const subjectBoundary = ordinaryBoundary + weights.subjectOmission / total;\n  return ticketUnit < subjectBoundary ? "subject-omission" : "object-omission";\n}\n\n/**\n * Build one weighted permutation over active Sentence construction families using\n * the joint family prior P(kind) × P(family | kind). Legal but inactive families\n * stay in the grammar/taxonomy and receive no product root attempts.\n */''',
          )
          replace_once(
              'src/curriculum/formal-syntax-sampling-policy.ts',
              '''export interface SentenceConstructionFamilyPlanSample {\n  readonly plan: readonly SentenceConstructionFamilyPlan[];\n  /** Terminal permutation draw already consumed by the historical sampler. */\n  readonly predicateMarkingTicketUnit: number;\n}''',
              '''export interface SentenceConstructionFamilyPlanSample {\n  readonly plan: readonly SentenceConstructionFamilyPlan[];\n  /** Terminal permutation draw already consumed by the historical sampler. */\n  readonly predicateMarkingTicketUnit: number;\n  /** Same inert draw; argument realization domain-separates it without consuming RNG. */\n  readonly argumentRealizationTicketUnit: number;\n}''',
          )
          replace_once(
              'src/curriculum/formal-syntax-sampling-policy.ts',
              '''  return {\n    plan: sampled.values,\n    predicateMarkingTicketUnit: sampled.terminalUnit,\n  };''',
              '''  return {\n    plan: sampled.values,\n    predicateMarkingTicketUnit: sampled.terminalUnit,\n    argumentRealizationTicketUnit: sampled.terminalUnit,\n  };''',
          )

          # Composer: combine marking + realization practice in one bounded structural search.
          replace_once(
              'src/curriculum/formal-syntax-utterance.ts',
              '''import {\n  chooseSentenceConstructionVariant,''',
              '''import { argumentRealizationStructuralPractice } from "./argument-realization-practice.js";\nimport {\n  argumentRealizationPracticeIntentForTicketUnit,\n  chooseSentenceConstructionVariant,''',
          )
          replace_once(
              'src/curriculum/formal-syntax-utterance.ts',
              '''  type FormalSyntaxSamplingPolicy,\n  type PredicateMarkingPracticeIntent,''',
              '''  type ArgumentRealizationPracticeIntent,\n  type FormalSyntaxSamplingPolicy,\n  type PredicateMarkingPracticeIntent,''',
          )
          replace_once(
              'src/curriculum/formal-syntax-utterance.ts',
              '''    readonly plan: readonly SentenceConstructionFamilyPlan[];\n    readonly predicateMarkingPracticeIntent: PredicateMarkingPracticeIntent;\n    readonly availabilityFallbackReserved: boolean;''',
              '''    readonly plan: readonly SentenceConstructionFamilyPlan[];\n    readonly predicateMarkingPracticeIntent: PredicateMarkingPracticeIntent;\n    readonly argumentRealizationPracticeIntent: ArgumentRealizationPracticeIntent;\n    readonly availabilityFallbackReserved: boolean;''',
          )
          replace_once(
              'src/curriculum/formal-syntax-utterance.ts',
              '''    readonly family: SentenceConstructionFamilyPlan;\n    readonly predicateMarkingPracticeIntent: PredicateMarkingPracticeIntent;\n    readonly availabilityFallbackActive: boolean;''',
              '''    readonly family: SentenceConstructionFamilyPlan;\n    readonly predicateMarkingPracticeIntent: PredicateMarkingPracticeIntent;\n    readonly argumentRealizationPracticeIntent: ArgumentRealizationPracticeIntent;\n    readonly predicateMarkingAvailabilityFallbackActive: boolean;\n    readonly argumentRealizationAvailabilityFallbackActive: boolean;''',
          )
          replace_once(
              'src/curriculum/formal-syntax-utterance.ts',
              '''      const availabilityFallbackReserved = predicateMarkingPracticeIntent !== "ordinary"\n        && remainingAttempts >= plan.length * 2;''',
              '''      const argumentRealizationPracticeIntent = argumentRealizationPracticeIntentForTicketUnit(\n        planSample.argumentRealizationTicketUnit,\n        samplingPolicy,\n      );\n      const availabilityFallbackReserved = (predicateMarkingPracticeIntent !== "ordinary"\n        || argumentRealizationPracticeIntent !== "ordinary")\n        && remainingAttempts >= plan.length * 2;''',
          )
          replace_once(
              'src/curriculum/formal-syntax-utterance.ts',
              '''        plan,\n        predicateMarkingPracticeIntent,\n        availabilityFallbackReserved,''',
              '''        plan,\n        predicateMarkingPracticeIntent,\n        argumentRealizationPracticeIntent,\n        availabilityFallbackReserved,''',
          )
          replace_once(
              'src/curriculum/formal-syntax-utterance.ts',
              '''    return {\n      family,\n      predicateMarkingPracticeIntent: rootFamilySearch.availabilityFallbackActive\n        ? "ordinary"\n        : rootFamilySearch.predicateMarkingPracticeIntent,\n      availabilityFallbackActive: rootFamilySearch.availabilityFallbackActive,\n    };''',
              '''    return {\n      family,\n      predicateMarkingPracticeIntent: rootFamilySearch.availabilityFallbackActive\n        ? "ordinary"\n        : rootFamilySearch.predicateMarkingPracticeIntent,\n      argumentRealizationPracticeIntent: rootFamilySearch.availabilityFallbackActive\n        ? "ordinary"\n        : rootFamilySearch.argumentRealizationPracticeIntent,\n      predicateMarkingAvailabilityFallbackActive: rootFamilySearch.availabilityFallbackActive\n        && rootFamilySearch.predicateMarkingPracticeIntent !== "ordinary",\n      argumentRealizationAvailabilityFallbackActive: rootFamilySearch.availabilityFallbackActive\n        && rootFamilySearch.argumentRealizationPracticeIntent !== "ordinary",\n    };''',
          )
          replace_once(
              'src/curriculum/formal-syntax-utterance.ts',
              '''    const predicateMarkingPracticeIntent =\n      rootFamilySelection?.predicateMarkingPracticeIntent ?? "ordinary";\n    const requiredPredicateMarkingSlot''',
              '''    const predicateMarkingPracticeIntent =\n      rootFamilySelection?.predicateMarkingPracticeIntent ?? "ordinary";\n    const argumentRealizationPracticeIntent =\n      rootFamilySelection?.argumentRealizationPracticeIntent ?? "ordinary";\n    const requiredPredicateMarkingSlot''',
          )
          replace_once(
              'src/curriculum/formal-syntax-utterance.ts',
              '''    const requiresPredicateMarkingPractice = requiredPredicateMarkingSlot !== null;\n    if (rootFamilySelection?.availabilityFallbackActive === true) {\n      fallbackReasons.add("formal-syntax-predicate-marking-availability-fallback");\n    }''',
              '''    const requiresPredicateMarkingPractice = requiredPredicateMarkingSlot !== null;\n    const argumentRealizationPractice = useProductFamilyPolicy\n      ? argumentRealizationStructuralPractice(argumentRealizationPracticeIntent)\n      : null;\n    const requiresArgumentRealizationPractice = argumentRealizationPracticeIntent !== "ordinary";\n    if (rootFamilySelection?.predicateMarkingAvailabilityFallbackActive === true) {\n      fallbackReasons.add("formal-syntax-predicate-marking-availability-fallback");\n    }\n    if (rootFamilySelection?.argumentRealizationAvailabilityFallbackActive === true) {\n      fallbackReasons.add("formal-syntax-argument-realization-availability-fallback");\n    }''',
          )
          replace_once(
              'src/curriculum/formal-syntax-utterance.ts',
              '''      maximumAttempts: requiresPredicateMarkingPractice ? 8 : 1,\n      ...(requiredPredicateMarkingSlot === null\n        ? {}\n        : { requiredLexicalSlot: requiredPredicateMarkingSlot }),''',
              '''      maximumAttempts: requiresPredicateMarkingPractice || requiresArgumentRealizationPractice ? 8 : 1,\n      ...(requiredPredicateMarkingSlot === null\n        ? {}\n        : { requiredLexicalSlot: requiredPredicateMarkingSlot }),\n      ...(argumentRealizationPractice?.requiredProductionRuleIdsAnyOf === undefined\n        ? {}\n        : { requiredProductionRuleIdsAnyOf: argumentRealizationPractice.requiredProductionRuleIdsAnyOf }),''',
          )
          replace_once(
              'src/curriculum/formal-syntax-utterance.ts',
              '''      ...(input.structuralTarget?.nestedProductionTargets === undefined\n        ? {}\n        : { nestedProductionTargets: input.structuralTarget.nestedProductionTargets }),''',
              '''      ...(useProductFamilyPolicy\n        ? (argumentRealizationPractice === null\n            ? {}\n            : { nestedProductionTargets: argumentRealizationPractice.nestedProductionTargets })\n        : (input.structuralTarget?.nestedProductionTargets === undefined\n            ? {}\n            : { nestedProductionTargets: input.structuralTarget.nestedProductionTargets })),''',
          )
          replace_once(
              'src/curriculum/formal-syntax-utterance.ts',
              '''    if (shape === null) {\n      fallbackReasons.add(requiresPredicateMarkingPractice\n        ? "formal-syntax-predicate-marking-search-exhausted"\n        : "formal-syntax-structural-sampling-exhausted");\n      recordRootFamilyFailure();\n      continue;\n    }''',
              '''    if (shape === null) {\n      if (requiresPredicateMarkingPractice) {\n        fallbackReasons.add("formal-syntax-predicate-marking-search-exhausted");\n      }\n      if (requiresArgumentRealizationPractice) {\n        fallbackReasons.add("formal-syntax-argument-realization-search-exhausted");\n      }\n      if (!requiresPredicateMarkingPractice && !requiresArgumentRealizationPractice) {\n        fallbackReasons.add("formal-syntax-structural-sampling-exhausted");\n      }\n      recordRootFamilyFailure();\n      continue;\n    }''',
          )
          PY

          cat > src/curriculum/argument-realization-practice.ts <<'EOF'
          import type { NestedProductionTarget } from "../syntax/sample.js";
          import type { ArgumentRealizationPracticeIntent } from "./formal-syntax-sampling-policy.js";

          export const CORE_ARGUMENT_REALIZATION_RULE_IDS = [
            "clause.intransitive",
            "clause.transitive",
            "clause.ditransitive",
          ] as const;

          export const OBJECT_ARGUMENT_REALIZATION_RULE_IDS = [
            "clause.transitive",
            "clause.ditransitive",
          ] as const;

          export interface ArgumentRealizationStructuralPractice {
            readonly nestedProductionTargets: readonly NestedProductionTarget[];
            readonly requiredProductionRuleIdsAnyOf?: readonly string[];
          }

          const OVERT_CORE_TARGETS: readonly NestedProductionTarget[] = [
            { parentRuleId: "clause.intransitive", constituentKey: "subject", exactCount: 1 },
            { parentRuleId: "clause.transitive", constituentKey: "subject", exactCount: 1 },
            { parentRuleId: "clause.transitive", constituentKey: "object", exactCount: 1 },
            { parentRuleId: "clause.ditransitive", constituentKey: "subject", exactCount: 1 },
            { parentRuleId: "clause.ditransitive", constituentKey: "object", exactCount: 1 },
          ];

          export function argumentRealizationStructuralPractice(
            intent: ArgumentRealizationPracticeIntent,
          ): ArgumentRealizationStructuralPractice {
            if (intent === "ordinary") {
              return { nestedProductionTargets: OVERT_CORE_TARGETS };
            }
            if (intent === "subject-omission") {
              return {
                nestedProductionTargets: [
                  { parentRuleId: "clause.intransitive", constituentKey: "subject", exactCount: 0 },
                  { parentRuleId: "clause.transitive", constituentKey: "subject", exactCount: 0 },
                  { parentRuleId: "clause.transitive", constituentKey: "object", exactCount: 1 },
                  { parentRuleId: "clause.ditransitive", constituentKey: "subject", exactCount: 0 },
                  { parentRuleId: "clause.ditransitive", constituentKey: "object", exactCount: 1 },
                ],
                requiredProductionRuleIdsAnyOf: CORE_ARGUMENT_REALIZATION_RULE_IDS,
              };
            }
            return {
              nestedProductionTargets: [
                { parentRuleId: "clause.transitive", constituentKey: "subject", exactCount: 1 },
                { parentRuleId: "clause.transitive", constituentKey: "object", exactCount: 0 },
                { parentRuleId: "clause.ditransitive", constituentKey: "subject", exactCount: 1 },
                { parentRuleId: "clause.ditransitive", constituentKey: "object", exactCount: 0 },
              ],
              requiredProductionRuleIdsAnyOf: OBJECT_ARGUMENT_REALIZATION_RULE_IDS,
            };
          }
          EOF

          cat > tests/syntax/argument-realization-axis-migration.test.ts <<'EOF'
          import { describe, expect, it } from "vitest";
          import { argumentRealizationStructuralPractice } from "../../src/curriculum/argument-realization-practice.js";
          import { FORMAL_SYNTAX_RULES } from "../../src/syntax/grammar.js";
          import { RETIRED_CLAUSE_RULE_V2_DECISIONS } from "../../src/syntax/clause-model-v2.js";
          import { sampleStructuralDerivation } from "../../src/syntax/sample.js";
          import type { StructuralSyntaxNode } from "../../src/syntax/derive.js";

          const ZERO_RANDOM = { next: () => 0 };

          function childCategories(root: StructuralSyntaxNode): readonly string[] {
            return root.children
              .filter((child): child is StructuralSyntaxNode => child.kind === "syntax-node")
              .map((child) => child.category);
          }

          describe("Clause Model V2 argument realization axis", () => {
            it("retires omission peer-Clause rules and preserves the evidence decision", () => {
              expect(FORMAL_SYNTAX_RULES.some((rule) => rule.id === "clause.subject-omission")).toBe(false);
              expect(FORMAL_SYNTAX_RULES.some((rule) => rule.id === "clause.object-omission")).toBe(false);
              expect(RETIRED_CLAUSE_RULE_V2_DECISIONS["clause.subject-omission"]).toMatchObject({
                targetAxes: ["argument-realization"],
                evidenceContract: "pinned-gsd-argument-realization-alternation-v1",
              });
              expect(RETIRED_CLAUSE_RULE_V2_DECISIONS["clause.object-omission"]).toMatchObject({
                targetAxes: ["argument-realization"],
                evidenceContract: "pinned-gsd-argument-realization-alternation-v1",
              });
            });

            it("keeps core frame identity while subject realization is absent", () => {
              const practice = argumentRealizationStructuralPractice("subject-omission");
              const shape = sampleStructuralDerivation({
                rootCategory: "Clause",
                rules: FORMAL_SYNTAX_RULES,
                random: ZERO_RANDOM,
                rootProductionRuleId: "clause.transitive",
                nestedProductionTargets: practice.nestedProductionTargets,
                requiredProductionRuleIdsAnyOf: practice.requiredProductionRuleIdsAnyOf,
              });
              expect(shape).not.toBeNull();
              expect(shape!.root.productionRuleId).toBe("clause.transitive");
              expect(childCategories(shape!.root)).toContain("Predicate");
              expect(childCategories(shape!.root)).toContain("Object");
              expect(childCategories(shape!.root)).not.toContain("Subject");
            });

            it("keeps transitive identity while direct object realization is absent", () => {
              const practice = argumentRealizationStructuralPractice("object-omission");
              const shape = sampleStructuralDerivation({
                rootCategory: "Clause",
                rules: FORMAL_SYNTAX_RULES,
                random: ZERO_RANDOM,
                rootProductionRuleId: "clause.transitive",
                nestedProductionTargets: practice.nestedProductionTargets,
                requiredProductionRuleIdsAnyOf: practice.requiredProductionRuleIdsAnyOf,
              });
              expect(shape).not.toBeNull();
              expect(shape!.root.productionRuleId).toBe("clause.transitive");
              expect(childCategories(shape!.root)).toContain("Subject");
              expect(childCategories(shape!.root)).toContain("Predicate");
              expect(childCategories(shape!.root)).not.toContain("Object");
            });

            it("keeps the ditransitive indirect object required on object practice", () => {
              const practice = argumentRealizationStructuralPractice("object-omission");
              const shape = sampleStructuralDerivation({
                rootCategory: "Clause",
                rules: FORMAL_SYNTAX_RULES,
                random: ZERO_RANDOM,
                rootProductionRuleId: "clause.ditransitive",
                nestedProductionTargets: practice.nestedProductionTargets,
                requiredProductionRuleIdsAnyOf: practice.requiredProductionRuleIdsAnyOf,
              });
              expect(shape).not.toBeNull();
              expect(childCategories(shape!.root)).toContain("IndirectObject");
              expect(childCategories(shape!.root)).not.toContain("Object");
            });

            it("fails closed when a realization practice target never appears in the sampled path", () => {
              const shape = sampleStructuralDerivation({
                rootCategory: "Sentence",
                rules: FORMAL_SYNTAX_RULES,
                random: ZERO_RANDOM,
                maximumAttempts: 2,
                rootProductionRuleId: "sentence.a-not-a-question",
                requiredProductionRuleIdsAnyOf: ["clause.transitive", "clause.ditransitive"],
              });
              expect(shape).toBeNull();
            });
          });
          EOF

          cat > tests/curriculum/argument-realization-practice-ticket.test.ts <<'EOF'
          import { describe, expect, it } from "vitest";
          import {
            argumentRealizationPracticeIntentForTicketUnit,
            argumentRealizationPracticeTicketUnitForTerminalUnit,
            createSentenceConstructionFamilyPlanSample,
            predicateMarkingPracticeIntentForTicketUnit,
            PRODUCT_FORMAL_SYNTAX_SAMPLING_POLICY,
          } from "../../src/curriculum/formal-syntax-sampling-policy.js";
          import { createSeededRandom } from "../../src/curriculum/random.js";
          import { FORMAL_SYNTAX_RULES } from "../../src/syntax/grammar.js";

          describe("argument realization practice ticket", () => {
            it("supports independently forced ordinary, subject-omission, and object-omission intents", () => {
              const base = PRODUCT_FORMAL_SYNTAX_SAMPLING_POLICY;
              expect(argumentRealizationPracticeIntentForTicketUnit(0.5, {
                ...base,
                version: "argument-realization-always-ordinary",
                argumentRealizationPracticeWeights: { ordinary: 1, subjectOmission: 0, objectOmission: 0 },
              })).toBe("ordinary");
              expect(argumentRealizationPracticeIntentForTicketUnit(0.5, {
                ...base,
                version: "argument-realization-always-subject",
                argumentRealizationPracticeWeights: { ordinary: 0, subjectOmission: 1, objectOmission: 0 },
              })).toBe("subject-omission");
              expect(argumentRealizationPracticeIntentForTicketUnit(0.5, {
                ...base,
                version: "argument-realization-always-object",
                argumentRealizationPracticeWeights: { ordinary: 0, subjectOmission: 0, objectOmission: 1 },
              })).toBe("object-omission");
            });

            it("domain-separates the realization ticket without moving Predicate marking boundaries", () => {
              const terminal = 0.9;
              const projected = argumentRealizationPracticeTicketUnitForTerminalUnit(terminal);
              expect(projected).toBeGreaterThanOrEqual(0);
              expect(projected).toBeLessThan(1);
              expect(projected).not.toBe(terminal);
              expect(predicateMarkingPracticeIntentForTicketUnit(0.8309)).toBe("ordinary");
              expect(predicateMarkingPracticeIntentForTicketUnit(0.831)).toBe("modal");
              expect(predicateMarkingPracticeIntentForTicketUnit(0.888)).toBe("aspect");
              expect(predicateMarkingPracticeIntentForTicketUnit(0.943)).toBe("negation");
            });

            it("keeps the provisional ticket incidence close to the legacy exposure seed", () => {
              const sampleCount = 8192;
              let subject = 0;
              let object = 0;
              for (let round = 0; round < sampleCount; round += 1) {
                const sample = createSentenceConstructionFamilyPlanSample(
                  FORMAL_SYNTAX_RULES.filter((rule) => rule.output === "Sentence"),
                  createSeededRandom(`argument-realization-terminal-ticket:${round}`),
                );
                expect(sample.argumentRealizationTicketUnit).toBe(sample.predicateMarkingTicketUnit);
                const intent = argumentRealizationPracticeIntentForTicketUnit(sample.argumentRealizationTicketUnit);
                if (intent === "subject-omission") subject += 1;
                if (intent === "object-omission") object += 1;
              }
              expect(Math.abs(subject / sampleCount - 0.1025)).toBeLessThan(0.01);
              expect(Math.abs(object / sampleCount - 0.0879)).toBeLessThan(0.01);
            });
          });
          EOF

      - name: Refresh runtime grammar lock
        shell: bash
        run: |
          cat > /tmp/update-runtime-lock.ts <<'EOF'
          import { readFileSync, writeFileSync } from "node:fs";
          import { sha256Canonical } from "./src/reference/importers/canonical-json.js";
          import { FORMAL_SYNTAX_RULES } from "./src/syntax/grammar.js";
          const path = "data/grammar/formal-syntax-runtime-lock.json";
          const lock = JSON.parse(readFileSync(path, "utf8"));
          lock.grammarRulesDigest = sha256Canonical(FORMAL_SYNTAX_RULES);
          writeFileSync(path, `${JSON.stringify(lock)}\n`);
          console.log(lock.grammarRulesDigest);
          EOF
          cp /tmp/update-runtime-lock.ts scripts/.tmp-update-runtime-lock.ts
          npx tsx scripts/.tmp-update-runtime-lock.ts
          rm scripts/.tmp-update-runtime-lock.ts

      - name: Focused validation
        run: |
          npx vitest run tests/syntax/argument-realization-axis-migration.test.ts tests/curriculum/argument-realization-practice-ticket.test.ts --reporter=verbose --testTimeout=30000
          npm run typecheck

      - name: Commit migration and remove bootstrap
        shell: bash
        run: |
          rm .github/workflows/argument-realization-axis-bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/syntax/sample.ts src/syntax/clause-rules.ts src/syntax/clause-model-v2.ts \
            src/curriculum/formal-syntax-taxonomy.ts src/curriculum/formal-syntax-sampling-policy.ts \
            src/curriculum/formal-syntax-utterance.ts src/curriculum/argument-realization-practice.ts \
            tests/syntax/argument-realization-axis-migration.test.ts \
            tests/curriculum/argument-realization-practice-ticket.test.ts \
            data/grammar/formal-syntax-runtime-lock.json .github/workflows/argument-realization-axis-bootstrap.yml
          git commit -m "refactor(syntax): move omission onto argument realization axis"
          git push origin HEAD:agent/argument-realization-axis-migration
