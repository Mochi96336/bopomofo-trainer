name: predicate modal axis bootstrap v2

on:
  push:
    branches:
      - agent/predicate-modal-axis-migration
    paths:
      - .github/workflows/predicate-modal-axis-bootstrap-v2.yml

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply predicate modal axis migration
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, found {count}: {old[:140]!r}")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              "src/syntax/sample.ts",
              '  ProductionRuleClass,\n  SyntacticFunction,',
              '  ProductionRuleClass,\n  RuntimeOccurrenceCapability,\n  SyntacticFunction,',
          )
          replace_once(
              "src/syntax/sample.ts",
              'export interface RequiredLexicalSlotConstraint {\n  /** Requirements carried by the lexical slot itself. */\n  readonly requiredFeatures?: SyntaxFeatureSet;\n  /** Requirements carried by the syntax category that directly contains the slot. */\n  readonly enclosingRequiredFunctions?: readonly SyntacticFunction[];\n}',
              'export interface RequiredLexicalSlotConstraint {\n  /** Feature requirements carried by the lexical slot itself. */\n  readonly requiredFeatures?: SyntaxFeatureSet;\n  /** Reviewed occurrence-capability requirements carried by the lexical slot itself. */\n  readonly requiredOccurrenceCapabilities?: readonly RuntimeOccurrenceCapability[];\n  /** Requirements carried by the syntax category that directly contains the slot. */\n  readonly enclosingRequiredFunctions?: readonly SyntacticFunction[];\n}',
          )
          replace_once(
              "src/syntax/sample.ts",
              '  if (!featuresMatch) return false;\n  const requiredFunctions = required.enclosingRequiredFunctions ?? [];',
              '  if (!featuresMatch) return false;\n  const requiredOccurrenceCapabilities = required.requiredOccurrenceCapabilities ?? [];\n  const slotOccurrenceCapabilities = context.slot.requiredOccurrenceCapabilities ?? [];\n  if (!requiredOccurrenceCapabilities.every((capability) =>\n    slotOccurrenceCapabilities.includes(capability),\n  )) return false;\n  const requiredFunctions = required.enclosingRequiredFunctions ?? [];',
          )

          replace_once(
              "src/curriculum/formal-syntax-sampling-policy.ts",
              'export type PredicateMarkingPracticeIntent = "ordinary" | "aspect" | "negation";\n\nexport interface PredicateMarkingPracticeWeights {\n  readonly ordinary: number;\n  readonly aspect: number;\n  readonly negation: number;\n}',
              'export type PredicateMarkingPracticeIntent = "ordinary" | "modal" | "aspect" | "negation";\n\nexport interface PredicateMarkingPracticeWeights {\n  readonly ordinary: number;\n  readonly modal: number;\n  readonly aspect: number;\n  readonly negation: number;\n}',
          )
          replace_once(
              "src/curriculum/formal-syntax-sampling-policy.ts",
              '  version: "formal-syntax-family-sampling-v6",',
              '  version: "formal-syntax-family-sampling-v7",',
          )
          replace_once(
              "src/curriculum/formal-syntax-sampling-policy.ts",
              '  // Product-practice prior for orthogonal predicate marking. Negation keeps its\n  // historical final 5.70% terminal-unit interval exactly: ticketUnit >= 0.943.\n  // Product calibration against the reconstructed #259 baseline selected a\n  // 5.50% aspect interval; ordinary absorbs the 0.20-point difference while\n  // the historical negation interval remains unchanged.\n  predicateMarkingPracticeWeights: { ordinary: 0.888, aspect: 0.055, negation: 0.057 },',
              '  // Product-practice prior for orthogonal predicate marking. Aspect keeps the\n  // calibrated [0.888, 0.943) interval and negation keeps the historical final\n  // [0.943, 1) interval exactly. Modal is provisionally seeded at 5.00% for\n  // calibration against #264 and takes mass only from the ordinary interval.\n  predicateMarkingPracticeWeights: { ordinary: 0.838, modal: 0.050, aspect: 0.055, negation: 0.057 },',
          )
          replace_once(
              "src/curriculum/formal-syntax-sampling-policy.ts",
              '  if ([marking.ordinary, marking.aspect, marking.negation]\n    .some((weight) => !Number.isFinite(weight) || weight < 0)) {',
              '  if ([marking.ordinary, marking.modal, marking.aspect, marking.negation]\n    .some((weight) => !Number.isFinite(weight) || weight < 0)) {',
          )
          replace_once(
              "src/curriculum/formal-syntax-sampling-policy.ts",
              '  if (!(marking.ordinary > 0 || marking.aspect > 0 || marking.negation > 0)) {',
              '  if (!(marking.ordinary > 0 || marking.modal > 0 || marking.aspect > 0 || marking.negation > 0)) {',
          )
          replace_once(
              "src/curriculum/formal-syntax-sampling-policy.ts",
              '  const total = weights.ordinary + weights.aspect + weights.negation;\n  const negationBoundary = 1 - weights.negation / total;\n  if (weights.negation > 0 && ticketUnit >= negationBoundary) return "negation";\n  const aspectBoundary = weights.ordinary / total;\n  if (weights.aspect > 0 && ticketUnit >= aspectBoundary) return "aspect";\n  return "ordinary";',
              '  const total = weights.ordinary + weights.modal + weights.aspect + weights.negation;\n  const negationBoundary = 1 - weights.negation / total;\n  if (weights.negation > 0 && ticketUnit >= negationBoundary) return "negation";\n  const aspectBoundary = negationBoundary - weights.aspect / total;\n  if (weights.aspect > 0 && ticketUnit >= aspectBoundary) return "aspect";\n  const modalBoundary = aspectBoundary - weights.modal / total;\n  if (weights.modal > 0 && ticketUnit >= modalBoundary) return "modal";\n  return "ordinary";',
          )

          replace_once(
              "src/curriculum/formal-syntax-utterance.ts",
              'import { FORMAL_SYNTAX_RULES } from "../syntax/grammar.js";\n',
              'import { FORMAL_SYNTAX_RULES } from "../syntax/grammar.js";\nimport { PREVERBAL_AUXILIARY_SAME_OCCURRENCE_CAPABILITY } from "../syntax/runtime-occurrence-capabilities.js";\n',
          )
          replace_once(
              "src/curriculum/formal-syntax-utterance.ts",
              '    const requiredPredicateMarkingSlot = predicateMarkingPracticeIntent === "negation"\n      ? {\n          requiredFeatures: { polarity: "negative" as const },\n          enclosingRequiredFunctions: ["predicate" as const],\n        }\n      : predicateMarkingPracticeIntent === "aspect"\n        ? {\n            requiredFeatures: { aspect: "marked" as const },\n            enclosingRequiredFunctions: ["predicate" as const],\n          }\n        : null;',
              '    const requiredPredicateMarkingSlot = predicateMarkingPracticeIntent === "negation"\n      ? {\n          requiredFeatures: { polarity: "negative" as const },\n          enclosingRequiredFunctions: ["predicate" as const],\n        }\n      : predicateMarkingPracticeIntent === "aspect"\n        ? {\n            requiredFeatures: { aspect: "marked" as const },\n            enclosingRequiredFunctions: ["predicate" as const],\n          }\n        : predicateMarkingPracticeIntent === "modal"\n          ? {\n              requiredOccurrenceCapabilities: [PREVERBAL_AUXILIARY_SAME_OCCURRENCE_CAPABILITY],\n              enclosingRequiredFunctions: ["predicate" as const],\n            }\n          : null;',
          )

          replace_once(
              "src/syntax/clause-rules.ts",
              '  production("clause.modal", "Clause", [\n    subject(),\n    lexical("modal", ["AUX"], {\n      requiredFunctions: ["auxiliary"],\n      requiredOccurrenceCapabilities: [PREVERBAL_AUXILIARY_SAME_OCCURRENCE_CAPABILITY],\n    }),\n    corePredicate([\n      "intransitive", "transitive", "ditransitive", "ambitransitive",\n      "clausal-complement", "open-clausal-complement", "adpositional-complement",\n    ]),\n    object({ minimum: 0, maximum: 1 }),\n  ]),\n',
              '',
          )
          replace_once("src/curriculum/formal-syntax-taxonomy.ts", '  | "marked.modal"\n', '')
          replace_once(
              "src/curriculum/formal-syntax-taxonomy.ts",
              '  "clause.modal": { kind: "marked", family: "marked.modal" },\n',
              '',
          )
          replace_once(
              "src/syntax/clause-model-v2.ts",
              '  "clause.aspect": {\n    targetAxes: ["predicate-marking"],\n    evidenceContract: "predicate.verb.expanded:aspect",\n    note: "Aspect is retained as a predicate-internal marking slot and practiced through the orthogonal predicate-marking ticket instead of competing with predicate frames as a peer Clause production.",\n  },\n} as const satisfies Readonly<Record<string, RetiredClauseRuleV2Decision>>;',
              '  "clause.aspect": {\n    targetAxes: ["predicate-marking"],\n    evidenceContract: "predicate.verb.expanded:aspect",\n    note: "Aspect is retained as a predicate-internal marking slot and practiced through the orthogonal predicate-marking ticket instead of competing with predicate frames as a peer Clause production.",\n  },\n  "clause.modal": {\n    targetAxes: ["predicate-marking"],\n    evidenceContract: "preverbal-auxiliary-same-occurrence",\n    note: "Clause-level modality ownership is retired; reviewed preverbal-AUX evidence remains on predicate-internal modal slots and product practice is controlled by the orthogonal predicate-marking ticket.",\n  },\n} as const satisfies Readonly<Record<string, RetiredClauseRuleV2Decision>>;',
          )
          replace_once(
              "src/syntax/clause-model-v2.ts",
              '  "clause.modal": {\n    group: "move-to-axis",\n    targetAxis: "predicate-marking",\n    target: "modality",\n    note: "Modality combines with predicate frames and must not compete with them as a Clause family.",\n  },\n',
              '',
          )

          replace_once("tests/syntax/clause-rules.test.ts", '  "clause.modal",\n', '')
          replace_once("tests/syntax/predicate-ownership.test.ts", '      "clause.modal",\n', '')
          replace_once(
              "tests/syntax/predicate-negation-axis-migration.test.ts",
              '  it("keeps negation and aspect retired while modal remains a live transitional Clause rule", () => {',
              '  it("keeps negation, aspect, and modal peer Clause rules retired", () => {',
          )
          replace_once(
              "tests/syntax/predicate-negation-axis-migration.test.ts",
              '    expect(clauseRuleIds).not.toContain("clause.aspect");\n    expect(clauseRuleIds).toContain("clause.modal");',
              '    expect(clauseRuleIds).not.toContain("clause.aspect");\n    expect(clauseRuleIds).not.toContain("clause.modal");',
          )
          replace_once(
              "tests/syntax/runtime-occurrence-capabilities.test.ts",
              '  it("uses preverbal auxiliary evidence only on the four reviewed modal consumers", () => {',
              '  it("uses preverbal auxiliary evidence only on the three reviewed live modal consumers", () => {',
          )
          replace_once(
              "tests/syntax/runtime-occurrence-capabilities.test.ts",
              '      "predicate-marking.modal:modal",\n      "clause.modal:modal",\n',
              '      "predicate-marking.modal:modal",\n',
          )
          replace_once(
              "tests/syntax/runtime-occurrence-capabilities.test.ts",
              '    const clauseModal = FORMAL_SYNTAX_RULES\n      .find((rule) => rule.id === "clause.modal")\n      ?.constituents.find((constituent) => constituent.key === "modal");\n    expect(clauseModal).toMatchObject({\n      category: "Lexeme",\n      allowedUpos: ["AUX"],\n      minimum: 1,\n      maximum: 1,\n      requiredFunctions: ["auxiliary"],\n      requiredOccurrenceCapabilities: [PREVERBAL_AUXILIARY_SAME_OCCURRENCE_CAPABILITY],\n    });\n\n',
              '',
          )
          replace_once(
              "tests/syntax/clause-model-v2.test.ts",
              '    expect(CURRENT_CLAUSE_RULE_V2_MIGRATION["clause.modal"]).toMatchObject({\n      targetAxis: "predicate-marking",\n      target: "modality",\n    });',
              '    expect(RETIRED_CLAUSE_RULE_V2_DECISIONS["clause.modal"]).toMatchObject({\n      targetAxes: ["predicate-marking"],\n      evidenceContract: "preverbal-auxiliary-same-occurrence",\n    });',
          )
          replace_once("tests/syntax/clause-model-v2.test.ts", '      "move-to-axis": 4,', '      "move-to-axis": 3,')
          replace_once(
              "tests/syntax/clause-model-v2.test.ts",
              '    expect(FORMAL_SYNTAX_RULES.some((rule) => rule.id === "clause.aspect")).toBe(false);\n',
              '    expect(FORMAL_SYNTAX_RULES.some((rule) => rule.id === "clause.aspect")).toBe(false);\n    expect(FORMAL_SYNTAX_RULES.some((rule) => rule.id === "clause.modal")).toBe(false);\n',
          )

          p = Path("tests/curriculum/predicate-marking-practice-ticket.test.ts")
          text = p.read_text()
          def r(old: str, new: str, count=None):
              global text
              found = text.count(old)
              if count is None:
                  if found < 1: raise SystemExit(f"predicate marking test missing: {old[:120]!r}")
                  text = text.replace(old, new)
              else:
                  if found != count: raise SystemExit(f"predicate marking test expected {count}, found {found}: {old[:120]!r}")
                  text = text.replace(old, new, count)

          r(
              'import { FORMAL_SYNTAX_RULES } from "../../src/syntax/grammar.js";\n',
              'import { FORMAL_SYNTAX_RULES } from "../../src/syntax/grammar.js";\nimport { PREVERBAL_AUXILIARY_SAME_OCCURRENCE_CAPABILITY } from "../../src/syntax/runtime-occurrence-capabilities.js";\n',
              1,
          )
          r('supports explicit ordinary, aspect, and negation practice tickets', 'supports explicit ordinary, modal, aspect, and negation practice tickets', 1)
          r('{ ordinary: 1, aspect: 0, negation: 0 }', '{ ordinary: 1, modal: 0, aspect: 0, negation: 0 }')
          r('{ ordinary: 0, aspect: 1, negation: 0 }', '{ ordinary: 0, modal: 0, aspect: 1, negation: 0 }')
          r('{ ordinary: 0, aspect: 0, negation: 1 }', '{ ordinary: 0, modal: 0, aspect: 0, negation: 1 }')
          r(
              'expect(PRODUCT_FORMAL_SYNTAX_SAMPLING_POLICY.version).toBe("formal-syntax-family-sampling-v6");',
              'expect(PRODUCT_FORMAL_SYNTAX_SAMPLING_POLICY.version).toBe("formal-syntax-family-sampling-v7");',
              1,
          )
          r(
              'ordinary: 0.888,\n      aspect: 0.055,\n      negation: 0.057,',
              'ordinary: 0.838,\n      modal: 0.050,\n      aspect: 0.055,\n      negation: 0.057,',
              1,
          )
          r(
              'expect(predicateMarkingPracticeIntentForTicketUnit(0.8879)).toBe("ordinary");\n    expect(predicateMarkingPracticeIntentForTicketUnit(0.888)).toBe("aspect");',
              'expect(predicateMarkingPracticeIntentForTicketUnit(0.8379)).toBe("ordinary");\n    expect(predicateMarkingPracticeIntentForTicketUnit(0.838)).toBe("modal");\n    expect(predicateMarkingPracticeIntentForTicketUnit(0.8879)).toBe("modal");\n    expect(predicateMarkingPracticeIntentForTicketUnit(0.888)).toBe("aspect");',
              1,
          )
          r('{ ordinary: 0, aspect: 0, negation: 0 }', '{ ordinary: 0, modal: 0, aspect: 0, negation: 0 }', 1)
          aspect_case = '''    expect(predicateMarkingPracticeIntentForTicketUnit(0.5, {\n      ...PRODUCT_FORMAL_SYNTAX_SAMPLING_POLICY,\n      version: "predicate-marking-ticket-test-always-aspect",\n      predicateMarkingPracticeWeights: { ordinary: 0, modal: 0, aspect: 1, negation: 0 },\n    })).toBe("aspect");\n'''
          modal_case = '''    expect(predicateMarkingPracticeIntentForTicketUnit(0.5, {\n      ...PRODUCT_FORMAL_SYNTAX_SAMPLING_POLICY,\n      version: "predicate-marking-ticket-test-always-modal",\n      predicateMarkingPracticeWeights: { ordinary: 0, modal: 1, aspect: 0, negation: 0 },\n    })).toBe("modal");\n'''
          r(aspect_case, modal_case + aspect_case, 1)
          r('    let aspectCount = 0;\n    let negationCount = 0;', '    let modalCount = 0;\n    let aspectCount = 0;\n    let negationCount = 0;', 1)
          r(
              '      if (intent === "aspect") aspectCount += 1;\n      if (intent === "negation") negationCount += 1;\n    }\n    expect(Math.abs(aspectCount / sampleCount - 0.055)).toBeLessThan(0.008);',
              '      if (intent === "modal") modalCount += 1;\n      if (intent === "aspect") aspectCount += 1;\n      if (intent === "negation") negationCount += 1;\n    }\n    expect(Math.abs(modalCount / sampleCount - 0.050)).toBeLessThan(0.008);\n    expect(Math.abs(aspectCount / sampleCount - 0.055)).toBeLessThan(0.008);',
              1,
          )
          modal_anchor = '  it("accepts only overt aspect surfaces when the product ticket always requires aspect", () => {'
          modal_test = '''  it("accepts only reviewed preverbal AUX profiles when the product ticket always requires modal", () => {\n    const policy = {\n      ...PRODUCT_FORMAL_SYNTAX_SAMPLING_POLICY,\n      version: "predicate-marking-ticket-test-product-modal",\n      predicateMarkingPracticeWeights: { ordinary: 0, modal: 1, aspect: 0, negation: 0 },\n    } as const;\n    const profileById = new Map(SYNTAX_PROFILES.map((profile) => [profile.id, profile]));\n    for (let round = 0; round < 16; round += 1) {\n      const composition = composeFormalSyntaxUtterances({\n        eligibleEntries: PRACTICE_CATALOG,\n        profiles: SYNTAX_PROFILES,\n        random: createSeededRandom(`predicate-marking-ticket-modal:${round}`),\n        samplingMode: "product-family",\n        samplingPolicy: policy,\n        minimumLexicalEntries: 2,\n        maximumCandidates: 1,\n        maximumAttempts: 64,\n        bounds: PRODUCT_BOUNDS,\n      });\n      expect(composition.candidates, JSON.stringify(composition.fallbackReasons)).toHaveLength(1);\n      expect(composition.candidates[0]!.syntaxProfileIds.some((id) =>\n        profileById.get(id)?.occurrenceCapabilities?.includes(\n          PREVERBAL_AUXILIARY_SAME_OCCURRENCE_CAPABILITY,\n        ) ?? false,\n      )).toBe(true);\n    }\n  }, 30_000);\n\n'''
          r(modal_anchor, modal_test + modal_anchor, 1)
          p.write_text(text)
          PY

      - name: Refresh runtime grammar lock
        shell: bash
        run: |
          DIGEST="$(npx tsx -e 'import { FORMAL_SYNTAX_RULES } from "./src/syntax/grammar.ts"; import { sha256Canonical } from "./src/reference/importers/canonical-json.ts"; console.log(sha256Canonical(FORMAL_SYNTAX_RULES));')"
          node - "$DIGEST" <<'NODE'
          const fs = require('node:fs');
          const digest = process.argv[2];
          const path = 'data/grammar/formal-syntax-runtime-lock.json';
          const lock = JSON.parse(fs.readFileSync(path, 'utf8'));
          lock.grammarRulesDigest = digest;
          fs.writeFileSync(path, `${JSON.stringify(lock)}\n`);
          console.log(`grammarRulesDigest=${digest}`);
          NODE

      - name: Generate catalog and run focused validation
        shell: bash
        run: |
          npm run app:catalog
          npm run typecheck
          npx vitest run \
            tests/curriculum/predicate-marking-practice-ticket.test.ts \
            tests/syntax/clause-model-v2.test.ts \
            tests/syntax/runtime-occurrence-capabilities.test.ts \
            tests/syntax/predicate-negation-axis-migration.test.ts \
            tests/syntax/predicate-ownership.test.ts \
            tests/syntax/clause-rules.test.ts

      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests data/grammar/formal-syntax-runtime-lock.json
          git commit -m "refactor(syntax): move modal practice onto Predicate axis"
          git push origin HEAD:agent/predicate-modal-axis-migration
