name: tmp expected-token trace cache

on:
  push:
    branches:
      - agent/expected-token-trace-cache

permissions:
  contents: write

jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Apply narrow runtime patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/curriculum/frequency-first-utterance.ts')
          source = path.read_text()
          old = '''function expectedTokenTrace(
            entries: readonly CatalogEntry[],
            input: FrequencyFirstScoringInput,
          ): readonly ExpectedTokenBoostTrace[] {
            return scoringTokens(entries, input).map((tokenId) => {
              const aggregate = input.bindingsByToken[tokenId];
              if (aggregate === undefined) {
                return {
                  tokenId,
                  attempts: 0,
                  errors: 0,
                  timingSamples: 0,
                  errorRate: null,
                  timingRatio: null,
                  boost: 1,
                };
              }
              const errorRate = aggregate.attempts >= input.policy.minimumBindingAttempts
                ? aggregate.errors / aggregate.attempts
                : null;
              const timingRatio = aggregate.timingSamples >= input.policy.minimumBindingTimingSamples
                && aggregate.currentTimeToTypeMs !== null
                && aggregate.bestTimeToTypeMs !== null
                && aggregate.bestTimeToTypeMs > 0
                ? aggregate.currentTimeToTypeMs / aggregate.bestTimeToTypeMs
                : null;
              const errorContribution = errorRate === null ? 0 : errorRate * input.policy.errorBoostScale;
              const timingContribution = timingRatio === null
                ? 0
                : Math.max(0, timingRatio - 1) * input.policy.timingBoostScale;
              return {
                tokenId,
                attempts: aggregate.attempts,
                errors: aggregate.errors,
                timingSamples: aggregate.timingSamples,
                errorRate,
                timingRatio,
                boost: clamp(
                  1 + errorContribution + timingContribution,
                  1,
                  input.policy.maximumExpectedTokenBoost,
                ),
              };
            });
          }
          '''
          new = '''const expectedTokenTraceCache = new WeakMap<
            FrequencyFirstScoringInput,
            Map<TokenId, ExpectedTokenBoostTrace>
          >();

          function expectedTokenTraceForToken(
            tokenId: TokenId,
            input: FrequencyFirstScoringInput,
          ): ExpectedTokenBoostTrace {
            let byToken = expectedTokenTraceCache.get(input);
            if (byToken === undefined) {
              byToken = new Map<TokenId, ExpectedTokenBoostTrace>();
              expectedTokenTraceCache.set(input, byToken);
            }
            const cached = byToken.get(tokenId);
            if (cached !== undefined) return cached;

            const aggregate = input.bindingsByToken[tokenId];
            let trace: ExpectedTokenBoostTrace;
            if (aggregate === undefined) {
              trace = {
                tokenId,
                attempts: 0,
                errors: 0,
                timingSamples: 0,
                errorRate: null,
                timingRatio: null,
                boost: 1,
              };
            } else {
              const errorRate = aggregate.attempts >= input.policy.minimumBindingAttempts
                ? aggregate.errors / aggregate.attempts
                : null;
              const timingRatio = aggregate.timingSamples >= input.policy.minimumBindingTimingSamples
                && aggregate.currentTimeToTypeMs !== null
                && aggregate.bestTimeToTypeMs !== null
                && aggregate.bestTimeToTypeMs > 0
                ? aggregate.currentTimeToTypeMs / aggregate.bestTimeToTypeMs
                : null;
              const errorContribution = errorRate === null ? 0 : errorRate * input.policy.errorBoostScale;
              const timingContribution = timingRatio === null
                ? 0
                : Math.max(0, timingRatio - 1) * input.policy.timingBoostScale;
              trace = {
                tokenId,
                attempts: aggregate.attempts,
                errors: aggregate.errors,
                timingSamples: aggregate.timingSamples,
                errorRate,
                timingRatio,
                boost: clamp(
                  1 + errorContribution + timingContribution,
                  1,
                  input.policy.maximumExpectedTokenBoost,
                ),
              };
            }
            byToken.set(tokenId, trace);
            return trace;
          }

          function expectedTokenTrace(
            entries: readonly CatalogEntry[],
            input: FrequencyFirstScoringInput,
          ): readonly ExpectedTokenBoostTrace[] {
            return scoringTokens(entries, input).map((tokenId) =>
              expectedTokenTraceForToken(tokenId, input)
            );
          }
          '''
          if source.count(old) != 1:
            raise SystemExit(f'expectedTokenTrace patch anchor count {source.count(old)}')
          path.write_text(source.replace(old, new))
          PY
      - run: npm ci --include=dev --ignore-scripts
      - run: npm run typecheck
      - name: Targeted curriculum tests
        run: npx vitest run tests/curriculum/frequency-first-utterance.test.ts tests/curriculum/formal-syntax-utterance.test.ts tests/curriculum/selection-evidence-contract.test.ts
      - name: Commit staged runtime patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/curriculum/frequency-first-utterance.ts
          git commit -m "perf(curriculum): cache expected token traces per selection"
          git rm .github/workflows/tmp-expected-token-trace-cache.yml
          git commit -m "chore: remove token-trace staging workflow"
          git push origin HEAD:agent/expected-token-trace-cache
