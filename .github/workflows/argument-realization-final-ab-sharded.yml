            for (const child of syntaxChildren(node)) visit(child, out);
          }
          function hasDirect(node: StructuralSyntaxNode, category: string): boolean {
            return syntaxChildren(node).some((child) => child.category === category);
          }
          const coreFrames = new Set(["clause.intransitive", "clause.transitive", "clause.ditransitive"]);
          const objectFrames = new Set(["clause.transitive", "clause.ditransitive"]);
          const rows = [];
          for (let round = START; round < END; round += 1) {
            const composition = composeFormalSyntaxUtterances({
              eligibleEntries: PRACTICE_CATALOG,
              profiles: SYNTAX_PROFILES,
              random: createSeededRandom(`${SEED_NAMESPACE}:${round}`),
              samplingMode: "product-family",
              samplingPolicy: PRODUCT_FORMAL_SYNTAX_SAMPLING_POLICY,
