name: argument realization final immutable A-B sharded

on:
  push:
    branches:
      - agent/argument-realization-axis-migration
    paths:
      - .github/workflows/argument-realization-final-ab-sharded.yml

permissions:
  contents: read

jobs:
  baseline:
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          ref: e99122eb81aeb0995a12a9eef63fcfd3573e4848
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm ci
      - run: npm run app:catalog
      - name: Expose audit-only structural root
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/curriculum/formal-syntax-utterance.ts')
          text = path.read_text()
          needle = '      syntaxProfileIds: realization.syntaxProfileIds,\n'
          if text.count(needle) != 1:
              raise SystemExit('unexpected formal-syntax candidate shape')
          path.write_text(text.replace(needle, needle + '      __auditStructuralRoot: shape.root,\n'))
          PY
      - name: Write shard probe
        run: |
          cat > scripts/.tmp-argument-realization-final-ab-shard.ts <<'TS'
          import { writeFileSync } from "node:fs";
          import { PRACTICE_CATALOG, SYNTAX_PROFILES } from "../src/app/generated/catalog.js";
          import { PRODUCT_FORMAL_SYNTAX_SAMPLING_POLICY } from "../src/curriculum/formal-syntax-sampling-policy.js";
          import { composeFormalSyntaxUtterances } from "../src/curriculum/formal-syntax-utterance.js";
          import { createSeededRandom } from "../src/curriculum/random.js";
          import { sentenceConstructionClassification } from "../src/curriculum/formal-syntax-taxonomy.js";
          import type { StructuralSyntaxNode } from "../src/syntax/derive.js";

          const SHARD = Number(process.env.AB_SHARD);
          const SHARD_SIZE = 2048;
          const START = SHARD * SHARD_SIZE;
          const END = START + SHARD_SIZE;
          const SEED_NAMESPACE = "argument-realization-final-ab-v1";
          const MODE = process.env.AB_MODE as "baseline" | "candidate";
          const HEAD = process.env.AB_HEAD ?? "unknown";
          const OUTPUT = process.env.AB_OUTPUT;
          if (!Number.isInteger(SHARD) || SHARD < 0 || SHARD > 3) throw new Error(`invalid shard ${SHARD}`);
          if (!OUTPUT) throw new Error("AB_OUTPUT missing");
          if (MODE !== "baseline" && MODE !== "candidate") throw new Error(`invalid mode ${MODE}`);

          const PRODUCT_BOUNDS = {
            maximumPhraseDepth: 3,
            maximumClauseNesting: 1,
            maximumClausesPerSentence: 2,
            maximumCoordinationItems: 2,
            maximumConsecutiveModifiers: 2,
            maximumComplementsPerPredicate: 1,
            maximumLexicalEntriesPerUtterance: 6,
          } as const;

          interface AuditCandidate {
            readonly __auditStructuralRoot?: StructuralSyntaxNode;
            readonly syntaxRootRuleId: string;
            readonly syntaxDerivationId: string;
            readonly syntaxProfileIds: readonly string[];
            readonly text: string;
          }
          function syntaxChildren(node: StructuralSyntaxNode): StructuralSyntaxNode[] {
            return node.children.filter((child): child is StructuralSyntaxNode => child.kind === "syntax-node");
          }
          function visit(node: StructuralSyntaxNode, out: StructuralSyntaxNode[]): void {
            out.push(node);
            for (const child of syntaxChildren(node)) visit(child, out);
          }
          function hasDirect(node: StructuralSyntaxNode, category: string): boolean {
            return syntaxChildren(node).some((child) => child.category === category);
          }

          const coreFrames = new Set(["clause.intransitive", "clause.transitive", "clause.ditransitive"]);
          const objectFrames = new Set(["clause.transitive", "clause.ditransitive"]);
          const rows = [];
          for (let round = START; round < END; round += 1) {
            const composition = composeFormalSyntaxUtterances({
              eligibleEntries: PRACTICE_CATALOG,
              profiles: SYNTAX_PROFILES,
              random: createSeededRandom(`${SEED_NAMESPACE}:${round}`),
              samplingMode: "product-family",
              samplingPolicy: PRODUCT_FORMAL_SYNTAX_SAMPLING_POLICY,
              minimumLexicalEntries: 2,
              maximumCandidates: 1,
              maximumAttempts: 64,
              bounds: PRODUCT_BOUNDS,
            });
            const candidate = (composition.candidates[0] ?? null) as AuditCandidate | null;
            const nodes: StructuralSyntaxNode[] = [];
            if (candidate?.__auditStructuralRoot !== undefined) visit(candidate.__auditStructuralRoot, nodes);
            const subject = MODE === "baseline"
              ? nodes.some((node) => node.productionRuleId === "clause.subject-omission")
              : nodes.some((node) => coreFrames.has(node.productionRuleId) && !hasDirect(node, "Subject"));
            const object = MODE === "baseline"
              ? nodes.some((node) => node.productionRuleId === "clause.object-omission")
              : nodes.some((node) => objectFrames.has(node.productionRuleId)
                  && hasDirect(node, "Subject") && !hasDirect(node, "Object"));
            const root = candidate?.syntaxRootRuleId ?? null;
            rows.push({
              round,
              success: candidate !== null,
              subject,
              object,
              any: subject || object,
              both: subject && object,
              root,
              family: root === null ? null : sentenceConstructionClassification(root)?.family ?? null,
              fallback: composition.fallbackReasons.join("\u0000"),
              derivation: candidate?.syntaxDerivationId ?? null,
              text: candidate?.text ?? null,
              profiles: (candidate?.syntaxProfileIds ?? []).join("\u0000"),
            });
          }
          const policy = PRODUCT_FORMAL_SYNTAX_SAMPLING_POLICY as unknown as {
            version: string;
            argumentRealizationPracticeWeights?: unknown;
          };
          writeFileSync(OUTPUT, `${JSON.stringify({
            mode: MODE,
            head: HEAD,
            shard: SHARD,
            start: START,
            end: END,
            seedNamespace: SEED_NAMESPACE,
            bounds: PRODUCT_BOUNDS,
            policyVersion: policy.version,
            argumentRealizationPracticeWeights: policy.argumentRealizationPracticeWeights ?? null,
            rows,
          })}\n`);
          TS
      - name: Run baseline shard
        env:
          AB_MODE: baseline
          AB_HEAD: e99122eb81aeb0995a12a9eef63fcfd3573e4848
          AB_SHARD: ${{ matrix.shard }}
          AB_OUTPUT: argument-realization-final-ab-baseline-${{ matrix.shard }}.json
        run: npx tsx scripts/.tmp-argument-realization-final-ab-shard.ts
      - uses: actions/upload-artifact@v4
        with:
          name: argument-realization-final-ab-shard-baseline-${{ matrix.shard }}
          path: argument-realization-final-ab-baseline-${{ matrix.shard }}.json
          if-no-files-found: error

  candidate:
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 13ce7c7864274b67700bdacab5a9bd9a193f977e
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm ci
      - run: npm run app:catalog
      - name: Expose audit-only structural root
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/curriculum/formal-syntax-utterance.ts')
          text = path.read_text()
          needle = '      syntaxProfileIds: realization.syntaxProfileIds,\n'
          if text.count(needle) != 1:
              raise SystemExit('unexpected formal-syntax candidate shape')
          path.write_text(text.replace(needle, needle + '      __auditStructuralRoot: shape.root,\n'))
          PY
      - name: Write shard probe
        run: |
          cat > scripts/.tmp-argument-realization-final-ab-shard.ts <<'TS'
          import { writeFileSync } from "node:fs";
          import { PRACTICE_CATALOG, SYNTAX_PROFILES } from "../src/app/generated/catalog.js";
          import { PRODUCT_FORMAL_SYNTAX_SAMPLING_POLICY } from "../src/curriculum/formal-syntax-sampling-policy.js";
          import { composeFormalSyntaxUtterances } from "../src/curriculum/formal-syntax-utterance.js";
          import { createSeededRandom } from "../src/curriculum/random.js";
          import { sentenceConstructionClassification } from "../src/curriculum/formal-syntax-taxonomy.js";
          import type { StructuralSyntaxNode } from "../src/syntax/derive.js";

          const SHARD = Number(process.env.AB_SHARD);
          const SHARD_SIZE = 2048;
          const START = SHARD * SHARD_SIZE;
          const END = START + SHARD_SIZE;
          const SEED_NAMESPACE = "argument-realization-final-ab-v1";
          const MODE = process.env.AB_MODE as "baseline" | "candidate";
          const HEAD = process.env.AB_HEAD ?? "unknown";
          const OUTPUT = process.env.AB_OUTPUT;
          if (!Number.isInteger(SHARD) || SHARD < 0 || SHARD > 3) throw new Error(`invalid shard ${SHARD}`);
          if (!OUTPUT) throw new Error("AB_OUTPUT missing");
          if (MODE !== "baseline" && MODE !== "candidate") throw new Error(`invalid mode ${MODE}`);

          const PRODUCT_BOUNDS = {
            maximumPhraseDepth: 3,
            maximumClauseNesting: 1,
            maximumClausesPerSentence: 2,
            maximumCoordinationItems: 2,
            maximumConsecutiveModifiers: 2,
            maximumComplementsPerPredicate: 1,
            maximumLexicalEntriesPerUtterance: 6,
          } as const;
          interface AuditCandidate {
            readonly __auditStructuralRoot?: StructuralSyntaxNode;
            readonly syntaxRootRuleId: string;
            readonly syntaxDerivationId: string;
            readonly syntaxProfileIds: readonly string[];
            readonly text: string;
          }
          function syntaxChildren(node: StructuralSyntaxNode): StructuralSyntaxNode[] {
            return node.children.filter((child): child is StructuralSyntaxNode => child.kind === "syntax-node");
          }
          function visit(node: StructuralSyntaxNode, out: StructuralSyntaxNode[]): void {
