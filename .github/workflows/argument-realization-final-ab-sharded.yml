              : nodes.some((node) => coreFrames.has(node.productionRuleId) && !hasDirect(node, "Subject"));
            const object = MODE === "baseline"
              ? nodes.some((node) => node.productionRuleId === "clause.object-omission")
              : nodes.some((node) => objectFrames.has(node.productionRuleId)
                  && hasDirect(node, "Subject") && !hasDirect(node, "Object"));
            const root = candidate?.syntaxRootRuleId ?? null;
            rows.push({
