    FORMAL_ATTRIBUTION.groupedCacheHits += 1;
    return cached;
  }
  FORMAL_ATTRIBUTION.groupedCacheMisses += 1;
''',
              ),
              (
                  'grouped built groups',
                  '''  const groups = [...profilesByEntryId].map(([entryId, profiles]) => ({
    entryId,
