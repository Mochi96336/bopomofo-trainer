name: tmp post-294 formal composer attribution

on:
  push:
    branches:
      - agent/tmp-post294-formal-attribution

permissions:
  contents: read

jobs:
  attribution:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TARGET_REF: 806b8dd05b76b11a5ea9895db3e29e2c381c3a7a
      SAMPLE_COUNT: 256
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Checkout production target
        run: git checkout --force "$TARGET_REF"
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci --include=dev --ignore-scripts
      - run: npm run app:catalog
      - name: Instrument and measure formal composer work
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def patch(path, changes):
              p = Path(path)
              s = p.read_text()
              for label, old, new in changes:
                  if old not in s:
                      raise SystemExit(f'{path}: {label} anchor missing: {old!r}')
                  s = s.replace(old, new, 1)
              p.write_text(s)

          patch('src/curriculum/formal-syntax-utterance.ts', [
              (
                  'formal stats block',
                  '''const compatibleProfileGroupsCache = new WeakMap<
  readonly RuntimeSyntaxProfile[],
  readonly CompatibleProfileGroup[]
