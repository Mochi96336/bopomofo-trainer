name: tmp post-294 formal composer attribution

on:
  push:
    branches:
      - agent/tmp-post294-formal-attribution

permissions:
  contents: read

jobs:
  attribution:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TARGET_REF: 806b8dd05b76b11a5ea9895db3e29e2c381c3a7a
      SAMPLE_COUNT: 256
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci --include=dev --ignore-scripts
      - run: npm run app:catalog
      - name: Instrument formal composer
        run: python scripts/tmp-post294-formal-attribution.py
      - name: Typecheck instrumentation
        run: npx tsc --noEmit
      - name: Measure production-shaped call volume
        run: node --import tsx .tmp-post294-attribution.ts
