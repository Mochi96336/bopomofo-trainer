          PY

          npx tsc --noEmit

          cat > .tmp-post294-attribution.ts <<'EOF'
          import { EVALUATION_CATALOG, PRACTICE_CATALOG, SYNTAX_PROFILES } from "./src/app/generated/catalog.js";
          import { readFormalSyntaxAttribution } from "./src/curriculum/formal-syntax-utterance.js";
          import { readFrequencyFirstAttribution } from "./src/curriculum/frequency-first-utterance.js";
          import {
            createFreshProgressForEnvironment,
            createProductEnvironment,
            createProductState,
          } from "./src/product/session.js";

          const sampleCount = Number(process.env.SAMPLE_COUNT);
          const environment = createProductEnvironment({
            practice: PRACTICE_CATALOG,
            evaluation: EVALUATION_CATALOG,
            syntaxProfiles: SYNTAX_PROFILES,
          });
          const baseProgress = createFreshProgressForEnvironment(
            environment,
            "post294-formal-attribution",
            "guided",
            "standard",
          );
          let attemptTotal = 0;
          for (let round = 0; round < sampleCount; round += 1) {
            const state = createProductState(
              environment,
              { ...baseProgress, practiceRoundsCompleted: round },
              0,
            );
            attemptTotal += state.round.selection.generationAttempts;
          }
          const formal = readFormalSyntaxAttribution();
          const frequency = readFrequencyFirstAttribution();
          const ratio = (a: number, b: number) => b === 0 ? 0 : Number((a / b * 100).toFixed(2));
          console.log(JSON.stringify({
            sampleCount,
            attemptTotal,
            formal,
            frequency,
            derived: {
              avgSourceGroupsPerSelect: Number((formal.sourceGroups / formal.selectCalls).toFixed(2)),
              avgEligibleGroupsPerSelect: Number((formal.eligibleGroups / formal.selectCalls).toFixed(2)),
              reuseFilterPct: ratio(formal.groupsFilteredByReuse, formal.sourceGroups),
              avgWeightsPerSelect: Number((formal.weightEvaluations / formal.selectCalls).toFixed(2)),
              surfaceCompatibilityPctOfWeights: ratio(formal.surfaceCompatibilityCalls, formal.weightEvaluations),
              groupedCacheHitPct: ratio(formal.groupedCacheHits, formal.groupedCalls),
              reachabilityRejectPct: ratio(formal.reachabilityRejected, formal.reachabilityCalls - formal.reachabilityPunctuationFastPath),
              avgAllCompatibleProfilesPerSlot: Number((formal.allCompatibleProfiles / Math.max(1, formal.lexicalSlotVisits - formal.reachabilityPunctuationFastPath)).toFixed(2)),
              bindingFilterPctOfSlots: ratio(formal.bindingFilterCalls, formal.lexicalSlotVisits),
              entryWeightCacheHitPct: ratio(frequency.entryWeightCacheHits, frequency.entryWeightCalls),
              avgBindingTokensPerMiss: Number((frequency.bindingOnlyTokenVisits / frequency.bindingOnlyCalls).toFixed(2)),
              expectedTokenTraceCacheHitPct: ratio(frequency.expectedTokenTraceCacheHits, frequency.expectedTokenTraceCalls),
            },
          }, null, 2));
          EOF

          node --import tsx .tmp-post294-attribution.ts
