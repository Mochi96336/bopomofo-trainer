name: tmp prepared surface order benchmark

on:
  push:
    branches:
      - agent/tmp-prepared-surface-order-ab

permissions:
  contents: read

env:
  PRODUCTION_REF: 7b4535b2c371d296f0a15cd39b405bd579afe9d5
  SAMPLE_COUNT: 256

jobs:
  paired-benchmark:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Prove and benchmark prepared surface-order constituents
        shell: bash
        run: |
          set -euo pipefail

          patch_candidate() {
            python - <<'PY'
          from pathlib import Path
          p = Path('src/syntax/sample.ts')
          s = p.read_text()

          def once(old, new, label):
              global s
              if old not in s:
                  raise SystemExit(f'{label} anchor missing: {old!r}')
              s = s.replace(old, new, 1)

          once(
              '  SyntacticFunction,\n  SyntaxCategory,\n',
              '  SyntacticFunction,\n  SurfaceOrder,\n  SyntaxCategory,\n',
              'SurfaceOrder import',
          )

          once(
              '  readonly rulesByOutput: ReadonlyMap<SyntaxCategory, readonly ProductionRule[]>;\n}',
              '  readonly rulesByOutput: ReadonlyMap<SyntaxCategory, readonly ProductionRule[]>;\n  readonly orderedConstituentsBySurfaceOrder: ReadonlyMap<SurfaceOrder, readonly ProductionConstituent[]>;\n}',
              'prepared context field',
          )

          once(
              '  const rulesByOutput = new Map<SyntaxCategory, readonly ProductionRule[]>();\n  for (const rule of rules) {\n    rulesByOutput.set(rule.output, [...(rulesByOutput.get(rule.output) ?? []), rule]);\n  }\n  return { rules, bounds, rulesByOutput };',
              '''  const rulesByOutput = new Map<SyntaxCategory, readonly ProductionRule[]>();
  const orderedConstituentsBySurfaceOrder = new Map<SurfaceOrder, readonly ProductionConstituent[]>();
  for (const rule of rules) {
    rulesByOutput.set(rule.output, [...(rulesByOutput.get(rule.output) ?? []), rule]);
    const byKey = new Map(rule.constituents.map((item) => [item.key, item]));
    for (const order of rule.surfaceOrders) {
      const ordered = order.constituentKeys.map((key) => byKey.get(key));
      if (ordered.some((item) => item === undefined)) {
        throw new Error(`surface order references missing constituent after validation: ${rule.id}:${order.id}`);
      }
      orderedConstituentsBySurfaceOrder.set(
        order,
        ordered as readonly ProductionConstituent[],
      );
    }
  }
  return { rules, bounds, rulesByOutput, orderedConstituentsBySurfaceOrder };''',
              'prepared order construction',
          )

          once(
              '  rulesByOutput: ReadonlyMap<SyntaxCategory, readonly ProductionRule[]>,\n  random: RandomSource,',
              '  rulesByOutput: ReadonlyMap<SyntaxCategory, readonly ProductionRule[]>,\n  orderedConstituentsBySurfaceOrder: ReadonlyMap<SurfaceOrder, readonly ProductionConstituent[]>,\n  random: RandomSource,',
              'sampleRuleChildren prepared map argument',
          )
          once(
              '        rulesByOutput,\n        random,\n        bounds,',
              '        rulesByOutput,\n        orderedConstituentsBySurfaceOrder,\n        random,\n        bounds,',
              'recursive sampleCategory prepared map argument',
          )

          # This replaces the second matching signature occurrence, for sampleCategory.
          signature = '  rulesByOutput: ReadonlyMap<SyntaxCategory, readonly ProductionRule[]>,\n  random: RandomSource,'
          replacement = '  rulesByOutput: ReadonlyMap<SyntaxCategory, readonly ProductionRule[]>,\n  orderedConstituentsBySurfaceOrder: ReadonlyMap<SurfaceOrder, readonly ProductionConstituent[]>,\n  random: RandomSource,'
          if signature not in s:
              raise SystemExit('sampleCategory signature anchor missing')
          s = s.replace(signature, replacement, 1)

          once(
              '    const byKey = new Map(rule.constituents.map((item) => [item.key, item]));\n    const ordered = order.constituentKeys.map((key) => byKey.get(key));\n    if (ordered.some((item) => item === undefined)) continue;\n',
              '''    const ordered = orderedConstituentsBySurfaceOrder.get(order);
    if (ordered === undefined) {
      throw new Error(`missing prepared surface order: ${rule.id}:${order.id}`);
    }
''',
              'candidate ordered constituents lookup',
          )

          once(
              '      rulesByOutput,\n      candidateRandom,\n      bounds,',
              '      rulesByOutput,\n      orderedConstituentsBySurfaceOrder,\n      candidateRandom,\n      bounds,',
              'sampleRuleChildren prepared map argument',
          )

          once(
              '  const rulesByOutput = context.rulesByOutput;\n  for (let attempt = 0; attempt < maximumAttempts; attempt += 1) {',
              '  const rulesByOutput = context.rulesByOutput;\n  const orderedConstituentsBySurfaceOrder = context.orderedConstituentsBySurfaceOrder;\n  for (let attempt = 0; attempt < maximumAttempts; attempt += 1) {',
              'prepared map local',
          )
          once(
              '      rulesByOutput,\n      options.random,\n      bounds,',
              '      rulesByOutput,\n      orderedConstituentsBySurfaceOrder,\n      options.random,\n      bounds,',
              'root sampleCategory prepared map argument',
          )

          p.write_text(s)
          PY
          }

          git checkout --force "$PRODUCTION_REF"
          git clean -fdx
          npm ci --include=dev --ignore-scripts
          patch_candidate
          npm run typecheck
          npx vitest run tests/syntax/sample.test.ts tests/syntax/nested-clause-order-stability.test.ts tests/product/session.test.ts

          results="$RUNNER_TEMP/prepared-surface-order-results.jsonl"
          : > "$results"

          measure() {
            local label="$1"
            local candidate="$2"
            git checkout --force "$PRODUCTION_REF" >/dev/null
            git clean -fdx >/dev/null
            npm ci --include=dev --ignore-scripts >/dev/null
            if [[ "$candidate" == "1" ]]; then patch_candidate; fi
            npm run app:catalog >/dev/null
            cat > .tmp-product-environment-paired.ts <<'EOF'
          import { appendFileSync } from "node:fs";
          import { performance } from "node:perf_hooks";
          import { EVALUATION_CATALOG, PRACTICE_CATALOG, SYNTAX_PROFILES } from "./src/app/generated/catalog.js";
          import { stableRuntimeDigest } from "./src/core/stable-id.js";
          import { createFreshProgressForEnvironment, createProductEnvironment, createProductState } from "./src/product/session.js";

          const sampleCount = Number(process.env.SAMPLE_COUNT);
          const environmentStartedAt = performance.now();
          const environment = createProductEnvironment({
            practice: PRACTICE_CATALOG,
            evaluation: EVALUATION_CATALOG,
            syntaxProfiles: SYNTAX_PROFILES,
          });
          const environmentMs = Math.round(performance.now() - environmentStartedAt);
          const baseProgress = createFreshProgressForEnvironment(
            environment,
            "prepared-surface-order-paired",
            "guided",
            "standard",
          );
          const outputs: object[] = [];
          let attemptTotal = 0;
          const startedAt = performance.now();
          for (let round = 0; round < sampleCount; round += 1) {
            const state = createProductState(
              environment,
              { ...baseProgress, practiceRoundsCompleted: round },
              0,
            );
            const selection = state.round.selection;
            if (selection.generationAttempts !== 1) {
              throw new Error(`normal product round unexpectedly retried: ${selection.generationAttempts}`);
            }
            attemptTotal += selection.generationAttempts;
            outputs.push({
              id: selection.utterance.id,
              text: selection.utterance.text,
              root: selection.utterance.syntaxRootRuleId ?? null,
              profileIds: selection.utterance.syntaxProfileIds ?? [],
              generationAttempts: selection.generationAttempts,
              fallbackReasons: selection.grammarFallbackReasons,
            });
          }
          const row = {
            label: process.env.TARGET_LABEL,
            sampleCount,
            attemptTotal,
            outputDigest: stableRuntimeDigest(outputs),
            environmentMs,
            elapsedMs: Math.round(performance.now() - startedAt),
          };
          appendFileSync(process.env.RESULTS_PATH!, `${JSON.stringify(row)}\n`);
          console.log(JSON.stringify(row));
          EOF
            TARGET_LABEL="$label" RESULTS_PATH="$results" node --import tsx .tmp-product-environment-paired.ts
          }

          measure production-1 0
          measure candidate-1 1
          measure candidate-2 1
          measure production-2 0
          measure production-3 0
          measure candidate-3 1
          measure candidate-4 1
          measure production-4 0

          RESULTS_PATH="$results" node <<'EOF'
          const fs = require('node:fs');
          const rows = fs.readFileSync(process.env.RESULTS_PATH, 'utf8').trim().split('\n').map(JSON.parse);
          const digests = new Set(rows.map((row) => row.outputDigest));
          const attempts = new Set(rows.map((row) => row.attemptTotal));
          const expectedAttempts = Number(process.env.SAMPLE_COUNT);
          if (digests.size !== 1) throw new Error(`output digest drift: ${JSON.stringify(rows)}`);
          if (attempts.size !== 1 || !attempts.has(expectedAttempts)) throw new Error(`attempt-count drift: ${JSON.stringify(rows)}`);
          const production = rows.filter((row) => row.label.startsWith('production'));
          const candidate = rows.filter((row) => row.label.startsWith('candidate'));
          const mean = (items, key) => items.reduce((sum, row) => sum + row[key], 0) / items.length;
          const median = (values) => {
            const sorted = [...values].sort((a, b) => a - b);
            return (sorted[1] + sorted[2]) / 2;
          };
          const productionTimes = production.map((row) => row.elapsedMs);
          const candidateTimes = candidate.map((row) => row.elapsedMs);
          const productionMeanMs = mean(production, 'elapsedMs');
          const candidateMeanMs = mean(candidate, 'elapsedMs');
          const productionMedianMs = median(productionTimes);
          const candidateMedianMs = median(candidateTimes);
          const pairedDeltas = production.map((row, index) => row.elapsedMs - candidate[index].elapsedMs);
          console.log(JSON.stringify({
            rows,
            outputDigest: rows[0].outputDigest,
            attemptTotal: rows[0].attemptTotal,
            productionTimes,
            candidateTimes,
            productionMeanMs: Math.round(productionMeanMs),
            candidateMeanMs: Math.round(candidateMeanMs),
            meanSpeedupPct: Number(((productionMeanMs - candidateMeanMs) / productionMeanMs * 100).toFixed(2)),
            productionMedianMs: Math.round(productionMedianMs),
            candidateMedianMs: Math.round(candidateMedianMs),
            medianSpeedupPct: Number(((productionMedianMs - candidateMedianMs) / productionMedianMs * 100).toFixed(2)),
            pairedDeltas,
            candidateFasterPairs: pairedDeltas.filter((delta) => delta > 0).length,
            productionEnvironmentMeanMs: Math.round(mean(production, 'environmentMs')),
            candidateEnvironmentMeanMs: Math.round(mean(candidate, 'environmentMs')),
          }, null, 2));
          EOF
