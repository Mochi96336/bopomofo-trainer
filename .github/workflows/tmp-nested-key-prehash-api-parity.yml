name: tmp nested key prehash API parity

on:
  push:
    branches:
      - agent/tmp-nested-key-prehash-api-parity

permissions:
  contents: read

env:
  PRODUCTION_REF: 76c5a18e05110f06b48665fdf01f7df7013fb785

jobs:
  parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Verify prefix hash and structural parity
        shell: bash
        run: |
          set -euo pipefail
          cp scripts/tmp-nested-key-prehash-api.py "$RUNNER_TEMP/patch.py"
          cp scripts/tmp-nested-key-prehash-api-parity.ts "$RUNNER_TEMP/hash-parity.ts"
          cp scripts/tmp-nested-key-prehash-api-structural-parity.ts "$RUNNER_TEMP/shape-parity.ts"

          git checkout --force "$PRODUCTION_REF"
          git clean -fdx
          npm ci --include=dev --ignore-scripts >/dev/null

          python "$RUNNER_TEMP/patch.py"
          git diff --check
          npm run typecheck >/dev/null
          cp "$RUNNER_TEMP/hash-parity.ts" scripts/.tmp-hash-parity.ts
          node --import tsx scripts/.tmp-hash-parity.ts
          cp "$RUNNER_TEMP/shape-parity.ts" scripts/.tmp-shape-parity.ts
          node --import tsx scripts/.tmp-shape-parity.ts > "$RUNNER_TEMP/candidate.jsonl" 2> "$RUNNER_TEMP/candidate.stderr"

          git checkout --force "$PRODUCTION_REF"
          git clean -fdx
          npm ci --include=dev --ignore-scripts >/dev/null
          cp "$RUNNER_TEMP/shape-parity.ts" scripts/.tmp-shape-parity.ts
          node --import tsx scripts/.tmp-shape-parity.ts > "$RUNNER_TEMP/production.jsonl" 2> "$RUNNER_TEMP/production.stderr"

          cmp "$RUNNER_TEMP/production.jsonl" "$RUNNER_TEMP/candidate.jsonl"
          cmp "$RUNNER_TEMP/production.stderr" "$RUNNER_TEMP/candidate.stderr"
          cat "$RUNNER_TEMP/production.stderr"
          sha256sum "$RUNNER_TEMP/production.jsonl" "$RUNNER_TEMP/candidate.jsonl"
          echo "nested keyed API structural derivations are byte-identical"
