name: analysis-stack-migration-repair

on:
  push:
    branches:
      - agent/analysis-v2-immediate-token-history

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/analysis-v2-immediate-token-history
          fetch-depth: 0

      - name: Guard stack heads
        shell: bash
        run: |
          set -euo pipefail
          test "$(git log -1 --pretty=%s)" = "chore: stage analysis migration repair"
          test "$(git rev-parse HEAD^)" = "4e9c8ac37d1c7573a926a906154dd23153e8ea26"
          git fetch origin agent/analysis-v2-strategy-permutations-v2
          test "$(git rev-parse origin/agent/analysis-v2-strategy-permutations-v2)" = "5ac84c65d1e31d944e1ab0ba7df96b8db58e7715"

      - name: Record repaired parent ancestry
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge -s ours --no-commit origin/agent/analysis-v2-strategy-permutations-v2

      - name: Patch migration trust boundary and docs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          source = Path("src/measurement-v2/serialize.ts")
          text = source.read_text()
          start = text.index("function migrateLegacyStrategyRecord(")
          end = text.index("\nexport function parseMeasurementSummaryV2", start)
          segment = text[start:end]
          needle = "    const expectedKey = JSON.stringify([\n"
          validation = '''    if (!bodyPosition(candidate.scope.canonicalPosition)
              || !bodyPosition(candidate.scope.acceptedPosition)
              || !isNonNegativeInteger(candidate.observations)
              || candidate.observations === 0) return null;
          '''
          if "!bodyPosition(candidate.scope.canonicalPosition)" not in segment:
              if segment.count(needle) != 1:
                  raise SystemExit(f"expected one Strategy expectedKey, found {segment.count(needle)}")
              segment = segment.replace(needle, validation + needle, 1)
              source.write_text(text[:start] + segment + text[end:])

          test = Path("tests/measurement-v2/serialize.test.ts")
          text = test.read_text()
          anchor = '  it("rejects 4+ in the current aggregate policy instead of silently dropping it", () => {\n'
          addition = '''  it("rejects malformed obsolete 4+ Strategy buckets before discarding them", () => {
            for (const [key, candidate] of [
              [
                '["input-order-position","4+","garbage","last"]',
                {
                  scope: { bodySize: "4+", canonicalPosition: "garbage", acceptedPosition: "last" },
                  observations: 11,
                },
              ],
              [
                '["input-order-position","4+","first","last"]',
                {
                  scope: { bodySize: "4+", canonicalPosition: "first", acceptedPosition: "last" },
                  observations: 0,
                },
              ],
            ] as const) {
              const legacy = structuredClone(createEmptyMeasurementSummaryV2()) as unknown as Record<string, unknown>;
              legacy.policyVersion = LEGACY_MEASUREMENT_V2_POLICY_VERSION;
              legacy.strategy = { inputOrderPositions: { [key]: candidate } };
              expect(parseMeasurementSummaryV2(legacy, "guided", "zhuyin-standard", TOKENS)).toBeNull();
            }
          });

          '''
          if "rejects malformed obsolete 4+ Strategy buckets before discarding them" not in text:
              if text.count(anchor) != 1:
                  raise SystemExit(f"expected one serialize test anchor, found {text.count(anchor)}")
              test.write_text(text.replace(anchor, addition + anchor, 1))

          doc = Path("docs/diagnostic-progress-history.md")
          text = doc.read_text()
          replacements = {
              "Progress-history schema 7 stores per-key semantic history plus bounded V2 motor history.":
                  "Progress-history schema 8 stores per-key semantic history plus bounded V2 motor history.",
              "`PROGRESS_HISTORY_SCHEMA_VERSION` is currently **7**.":
                  "`PROGRESS_HISTORY_SCHEMA_VERSION` is currently **8**.",
              "Schema 8 adds `motor.immediateTokens`, keyed by the existing exact directed token-pair aggregate identity.\n\nSchema 6 did not store pair-level history. A schema-6 record therefore migrates to schema 7 with `immediateTokens: {}` while preserving its valid word-structure coordination, immediate-hand, same-hand-revisit, and tone-commit histories. The parser does **not** take a cumulative pair aggregate and manufacture historical points from it: the joint sequence of past buckets is not recoverable from one cumulative value.":
                  "Schema 8 adds `motor.immediateTokens`, keyed by the existing exact directed token-pair aggregate identity. Migration is explicit across the two immediately preceding generations:\n\n- schema 7 → 8 preserves tone-aware same-hand-revisit history and starts `immediateTokens: {}` because schema 7 never stored pair-level history;\n- schema 6 → 8 validates then discards body-only same-hand-revisit history and also starts `immediateTokens: {}`.\n\nThe parser does **not** take a cumulative pair aggregate and manufacture historical points from it: the joint sequence of past buckets is not recoverable from one cumulative value.",
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f"progress-history doc text did not match expected head: {old[:60]}")
              text = text.replace(old, new, 1)
          doc.write_text(text)
          PY

      - name: Validate targeted migration tests
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npx vitest run \
            tests/measurement-v2/serialize.test.ts \
            tests/measurement-v2/legacy-strategy-evidence.test.ts \
            tests/progress-history/serialize.test.ts

      - name: Commit repaired stack child
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/analysis-stack-migration-repair.yml
          git add src/measurement-v2/serialize.ts tests/measurement-v2/serialize.test.ts docs/diagnostic-progress-history.md
          git commit -m "fix: close Analysis V2 migration review findings"
          git push origin HEAD:agent/analysis-v2-immediate-token-history
