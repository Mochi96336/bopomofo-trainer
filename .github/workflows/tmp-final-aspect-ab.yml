name: tmp final aspect 8192 A-B

on:
  push:
    branches:
      - agent/aspect-predicate-marking-axis
    paths:
      - .github/workflows/tmp-final-aspect-ab.yml

permissions:
  contents: read

jobs:
  final-ab:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: agent/aspect-predicate-marking-axis

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate packaged app catalog
        run: npm run app:catalog

      - name: Write final A-B probe
        shell: bash
        run: |
          cat > scripts/.tmp-final-aspect-ab.ts <<'EOF'
          import { writeFileSync } from "node:fs";
          import { PRACTICE_CATALOG, SYNTAX_PROFILES } from "../src/app/generated/catalog.js";
          import {
            PRODUCT_FORMAL_SYNTAX_SAMPLING_POLICY,
            predicateMarkingPracticeIntentForTicketUnit,
            type FormalSyntaxSamplingPolicy,
          } from "../src/curriculum/formal-syntax-sampling-policy.js";
          import { createSeededRandom } from "../src/curriculum/random.js";
          import { composeFormalSyntaxUtterances } from "../src/curriculum/formal-syntax-utterance.js";
          import { sentenceConstructionClassification } from "../src/curriculum/formal-syntax-taxonomy.js";
          import type { StructuralLexicalSlot } from "../src/syntax/derive.js";
          import { FORMAL_GRAMMAR_VERSION } from "../src/syntax/features.js";
          import { FORMAL_SYNTAX_RULES } from "../src/syntax/grammar.js";
          import { buildLexicalProfileIndex, compatibleProfilesForSlot } from "../src/syntax/realize.js";
          import type {
            ProductionConstituent,
            ProductionRule,
            SyntaxCategory,
            SyntaxFeatureSet,
            Upos,
          } from "../src/syntax/types.js";

          const SAMPLE_COUNT = 8192;
          const SEED_NAMESPACE = "aspect-predicate-marking-final-ab-v1";
          const BASE_HEAD = "4d97bfec67946df620cf8a5d70bc87b704edfa75";
          const IMPLEMENTATION_BEHAVIOR_HEAD = "7a0d7ebbcea565268522a0e1193bf92fe6a4f1d9";
          const PRODUCT_BOUNDS = {
            maximumPhraseDepth: 3,
            maximumClauseNesting: 1,
            maximumClausesPerSentence: 2,
            maximumCoordinationItems: 2,
            maximumConsecutiveModifiers: 2,
            maximumComplementsPerPredicate: 1,
            maximumLexicalEntriesPerUtterance: 6,
          } as const;

          interface RecordRow {
            success: boolean;
            aspect: boolean;
            root: string | null;
            family: string | null;
            fallback: string;
            derivation: string | null;
            text: string | null;
          }

          interface Summary {
            sampleCount: number;
            success: number;
            aspectExposure: number;
            aspectShare: number;
            roots: Record<string, number>;
            families: Record<string, number>;
            fallbacks: Record<string, number>;
          }

          function constituent(
            key: string,
            category: SyntaxCategory,
            options: {
              minimum?: number;
              maximum?: number;
              allowedUpos?: readonly Upos[];
              requiredFunctions?: readonly ["predicate"];
              requiredFeatures?: SyntaxFeatureSet;
            } = {},
          ): ProductionConstituent {
            return {
              key,
              category,
              minimum: options.minimum ?? 1,
              maximum: options.maximum ?? 1,
              recursive: false,
              allowedUpos: options.allowedUpos ?? [],
              requiredFunctions: options.requiredFunctions ?? [],
              requiredValencyFrames: [],
              requiredFeatures: options.requiredFeatures ?? {},
            };
          }

          const clauseAspectRule: ProductionRule = {
            id: "clause.aspect",
            grammarVersion: FORMAL_GRAMMAR_VERSION,
            output: "Clause",
            constituents: [
              constituent("subject", "Subject", { minimum: 0, maximum: 1 }),
              constituent("predicate", "Predicate", { requiredFunctions: ["predicate"] }),
              constituent("aspect", "Lexeme", {
                allowedUpos: ["AUX", "PART"],
                requiredFeatures: { aspect: "marked" },
              }),
              constituent("object", "Object", { minimum: 0, maximum: 1 }),
            ],
            surfaceOrders: [{
              id: "canonical",
              constituentKeys: ["subject", "predicate", "aspect", "object"],
            }],
            constraints: [],
            positiveFixtureIds: ["clause.aspect:minimum", "clause.aspect:maximum"],
            negativeFixtureIds: ["clause.aspect:overflow"],
          };

          const aspectSlot: StructuralLexicalSlot = {
            kind: "lexical-slot",
            id: "final-ab:aspect-marked",
            constituentKey: "aspect",
            occurrenceIndex: 0,
            allowedUpos: ["AUX", "PART"],
            requiredFunctions: [],
            requiredValencyFrames: [],
            requiredFeatures: { aspect: "marked" },
          };

          const profileIndex = buildLexicalProfileIndex(PRACTICE_CATALOG, SYNTAX_PROFILES);
          const aspectProfileIds = new Set(
            compatibleProfilesForSlot(aspectSlot, profileIndex).map((profile) => profile.id),
          );
          if (aspectProfileIds.size === 0) throw new Error("empty exact aspect profile frontier");

          const currentWeights = PRODUCT_FORMAL_SYNTAX_SAMPLING_POLICY.predicateMarkingPracticeWeights;
          if (currentWeights.ordinary !== 0.888 || currentWeights.aspect !== 0.055 || currentWeights.negation !== 0.057) {
            throw new Error(`unexpected calibrated weights: ${JSON.stringify(currentWeights)}`);
          }
          if (predicateMarkingPracticeIntentForTicketUnit(0.942999999999) !== "aspect"
            || predicateMarkingPracticeIntentForTicketUnit(0.943) !== "negation") {
            throw new Error("historical negation boundary moved");
          }

          const baselinePolicy: FormalSyntaxSamplingPolicy = {
            ...PRODUCT_FORMAL_SYNTAX_SAMPLING_POLICY,
            version: "final-ab-reconstructed-259",
            predicateMarkingPracticeWeights: { ordinary: 0.943, aspect: 0, negation: 0.057 },
          };

          function increment(map: Map<string, number>, key: string): void {
            map.set(key, (map.get(key) ?? 0) + 1);
          }

          function sorted(map: Map<string, number>): Record<string, number> {
            return Object.fromEntries([...map.entries()].sort(([a], [b]) => a.localeCompare(b)));
          }

          function summarize(rows: readonly RecordRow[]): Summary {
            let success = 0;
            let aspectExposure = 0;
            const roots = new Map<string, number>();
            const families = new Map<string, number>();
            const fallbacks = new Map<string, number>();
            for (const row of rows) {
              if (row.success) success += 1;
              if (row.aspect) aspectExposure += 1;
              if (row.root !== null) increment(roots, row.root);
              if (row.family !== null) increment(families, row.family);
              if (row.fallback !== "") {
                for (const reason of row.fallback.split("\u0000")) increment(fallbacks, reason);
              }
            }
            return {
              sampleCount: rows.length,
              success,
              aspectExposure,
              aspectShare: aspectExposure / rows.length,
              roots: sorted(roots),
              families: sorted(families),
              fallbacks: sorted(fallbacks),
            };
          }

          function measure(policy: FormalSyntaxSamplingPolicy): RecordRow[] {
            const rows: RecordRow[] = [];
            for (let round = 0; round < SAMPLE_COUNT; round += 1) {
              const composition = composeFormalSyntaxUtterances({
                eligibleEntries: PRACTICE_CATALOG,
                profiles: SYNTAX_PROFILES,
                random: createSeededRandom(`${SEED_NAMESPACE}:${round}`),
                samplingMode: "product-family",
                samplingPolicy: policy,
                minimumLexicalEntries: 2,
                maximumCandidates: 1,
                maximumAttempts: 64,
                bounds: PRODUCT_BOUNDS,
              });
              const candidate = composition.candidates[0] ?? null;
              const root = candidate?.syntaxRootRuleId ?? null;
              rows.push({
                success: candidate !== null,
                aspect: (candidate?.syntaxProfileIds ?? []).some((id) => aspectProfileIds.has(id)),
                root,
                family: root === null ? null : sentenceConstructionClassification(root)?.family ?? null,
                fallback: composition.fallbackReasons.join("\u0000"),
                derivation: candidate?.syntaxDerivationId ?? null,
                text: candidate?.text ?? null,
              });
            }
            return rows;
          }

          function withRestoredClauseAspect<T>(operation: () => T): T {
            const rules = FORMAL_SYNTAX_RULES as ProductionRule[];
            if (rules.some((rule) => rule.id === "clause.aspect")) {
              throw new Error("current implementation unexpectedly contains clause.aspect");
            }
            const insertAt = rules.findIndex((rule) => rule.id === "clause.ba");
            if (insertAt < 0) throw new Error("clause.ba baseline insertion seam missing");
            rules.splice(insertAt, 0, clauseAspectRule);
            try {
              return operation();
            } finally {
              const index = rules.findIndex((rule) => rule === clauseAspectRule);
              if (index < 0) throw new Error("baseline clause.aspect reconstruction lost");
              rules.splice(index, 1);
            }
          }

          function tv(left: Record<string, number>, right: Record<string, number>): number {
            const keys = new Set([...Object.keys(left), ...Object.keys(right)]);
            let sum = 0;
            for (const key of keys) sum += Math.abs((left[key] ?? 0) - (right[key] ?? 0));
            return sum / (2 * SAMPLE_COUNT);
          }

          const baselineRows = withRestoredClauseAspect(() => measure(baselinePolicy));
          const currentRows = measure(PRODUCT_FORMAL_SYNTAX_SAMPLING_POLICY);
          const baseline = summarize(baselineRows);
          const current = summarize(currentRows);

          let successMismatch = 0;
          let aspectChanged = 0;
          let baseAspectToNonAspect = 0;
          let baseNonAspectToAspect = 0;
          let rootChanged = 0;
          let familyChanged = 0;
          let fallbackChanged = 0;
          let derivationChanged = 0;
          let textChanged = 0;
          for (let i = 0; i < SAMPLE_COUNT; i += 1) {
            const base = baselineRows[i]!;
            const now = currentRows[i]!;
            if (base.success !== now.success) successMismatch += 1;
            if (base.aspect !== now.aspect) {
              aspectChanged += 1;
              if (base.aspect) baseAspectToNonAspect += 1;
              else baseNonAspectToAspect += 1;
            }
            if (base.root !== now.root) rootChanged += 1;
            if (base.family !== now.family) familyChanged += 1;
            if (base.fallback !== now.fallback) fallbackChanged += 1;
            if (base.derivation !== now.derivation) derivationChanged += 1;
            if (base.text !== now.text) textChanged += 1;
          }

          const report = {
            schemaVersion: "aspect-predicate-marking-final-ab-v1",
            baseHead: BASE_HEAD,
            implementationBehaviorHead: IMPLEMENTATION_BEHAVIOR_HEAD,
            sampleCount: SAMPLE_COUNT,
            seedNamespace: SEED_NAMESPACE,
            exactAspectProfileCount: aspectProfileIds.size,
            calibratedWeights: currentWeights,
            baseline,
            current,
            drift: {
              successDelta: current.success - baseline.success,
              aspectExposureDelta: current.aspectExposure - baseline.aspectExposure,
              aspectShareDelta: current.aspectShare - baseline.aspectShare,
              rootTv: tv(baseline.roots, current.roots),
              familyTv: tv(baseline.families, current.families),
              successMismatch,
              aspectChanged,
              baseAspectToNonAspect,
              baseNonAspectToAspect,
              rootChanged,
              familyChanged,
              fallbackChanged,
              derivationChanged,
              textChanged,
            },
          };

          const pct = (value: number) => `${(value * 100).toFixed(3)}%`;
          const md = [
            "# Final 8,192-seed aspect A/B",
            "",
            `- Reconstructed #259 baseline: **${baseline.aspectExposure}/${SAMPLE_COUNT} (${pct(baseline.aspectShare)})**`,
            `- Calibrated #261 (aspect ticket 5.50%): **${current.aspectExposure}/${SAMPLE_COUNT} (${pct(current.aspectShare)})**`,
            `- Exposure delta: **${report.drift.aspectExposureDelta} (${pct(report.drift.aspectShareDelta)})**`,
            `- Success: **${baseline.success} -> ${current.success}**, mismatch **${successMismatch}/${SAMPLE_COUNT}**`,
            `- Root TV: **${pct(report.drift.rootTv)}**`,
            `- Family TV: **${pct(report.drift.familyTv)}**`,
            `- Per-seed aspect classification changed: **${aspectChanged}** (${baseAspectToNonAspect} base->non, ${baseNonAspectToAspect} non->current)`,
            `- Root changed: **${rootChanged}**; family changed: **${familyChanged}**`,
            `- Fallback changed: **${fallbackChanged}**; derivation changed: **${derivationChanged}**; text changed: **${textChanged}**`,
            "",
            `Behavior head under test: \`${IMPLEMENTATION_BEHAVIOR_HEAD}\` (workflow-only child commit has identical product sources).`,
          ].join("\n");

          writeFileSync("aspect-final-ab.json", `${JSON.stringify(report, null, 2)}\n`);
          writeFileSync("aspect-final-ab.md", `${md}\n`);
          console.log(md);
          EOF

      - name: Run final 8192-seed A-B
        run: npx tsx scripts/.tmp-final-aspect-ab.ts

      - name: Publish summary
        if: always()
        run: |
          if [ -f aspect-final-ab.md ]; then
            cat aspect-final-ab.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload final A-B artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aspect-predicate-marking-final-ab
          path: |
            aspect-final-ab.json
            aspect-final-ab.md
          if-no-files-found: warn
