name: argument realization axis bootstrap fix

on:
  push:
    branches:
      - agent/argument-realization-axis-migration
    paths:
      - .github/workflows/argument-realization-axis-bootstrap-fix.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/argument-realization-axis-migration
          fetch-depth: 0
      - name: Correct domain-separated ticket projection
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/argument-realization-axis-bootstrap.yml')
          text = path.read_text()
          old = 'digest.slice(0, 13), 16) / 0x1_0000_0000_0000'
          new = 'digest.slice(0, 12), 16) / 281_474_976_710_656'
          if text.count(old) != 1:
              raise SystemExit(f'expected one projection match, got {text.count(old)}')
          path.write_text(text.replace(old, new), newline='\n')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/argument-realization-axis-bootstrap.yml
          git commit -m "ci: fix argument realization ticket projection"
          git push origin HEAD:agent/argument-realization-axis-migration
