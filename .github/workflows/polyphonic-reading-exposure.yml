name: Polyphonic reading exposure

on:
  pull_request:
    paths:
      - ".github/workflows/polyphonic-reading-exposure.yml"
      - "scripts/audit-polyphonic-context.ts"
      - "scripts/compare-zhong-role-trial.ts"
      - "scripts/compare-ordinal-line-trial.ts"
      - "scripts/audit-conflicting-reading-target.ts"
      - "scripts/audit-same-upos-polyphones.ts"
      - "scripts/audit-targeted-polyphonic-identities.ts"
      - "scripts/prepare-moe-sense-targets.ts"
      - "scripts/audit-moe-single-reading-conflicts.ts"
      - "scripts/audit-dongxi-ud-intake.ts"
      - "data/readings/dongxi-ud-gsd-attested-review-candidates.json"
      - "src/readings/**"
      - "tests/readings/**"
      - "package.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci --include=dev --ignore-scripts
      - name: Validate attested UD 東西 contexts without generating reading labels
        run: npx tsx scripts/audit-dongxi-ud-intake.ts
      - name: Generate the product catalog
        run: npm run app:catalog
      - name: Prepare five-word exact reading identities for private MOE review
        run: npx tsx scripts/prepare-moe-sense-targets.ts
      - name: Detect exact full-word reading disagreements against pinned MOE unique readings
        run: |
          npx vitest run tests/readings/moe-single-reading-catalog-crosscheck.test.ts
          npx tsx scripts/audit-moe-single-reading-conflicts.ts
      - name: Assert legal-only lexical redraw and actual learner target weighting
        run: npx tsx scripts/audit-conflicting-reading-target.ts
      - name: Audit 2048 deterministic generated sentences
        run: npm run readings:audit
      - name: Trial closed-class reading eligibility against the same seeds
        run: npm run readings:audit -- --policy reviewed-closed --output data/generated/polyphonic-context-reviewed-closed.json
      - name: Trial reviewed lexical roles against the same seeds
        run: npm run readings:audit -- --policy reviewed-roles --output data/generated/polyphonic-context-reviewed-roles.json
      - name: Audit exact host-lexeme boundaries without inferring character readings
        run: npx tsx scripts/audit-lexeme-boundary-readiness.ts
      - name: Probe whole-lexeme reachability with bounded biased sampling
        run: npx tsx scripts/probe-whole-lexeme-reachability.ts --probes 16
      - name: Record exact 東西 sense-context review candidates without declaring reading correctness
        run: npx tsx scripts/audit-dongxi-context.ts --samples-per-reading 24
      - name: Trial reviewed 種 noun/verb reading identity restrictions
        run: npm run readings:audit -- --policy zhong-role-trial --output data/generated/polyphonic-context-zhong-role-trial.json
      - name: Verify 種 opt-in trial has zero unlicensed selection and unrelated seed drift
        run: >-
          npx tsx scripts/compare-zhong-role-trial.ts
          data/generated/polyphonic-context-reviewed-roles.json
          data/generated/polyphonic-context-zhong-role-trial.json
          data/generated/polyphonic-zhong-role-trial-comparison.json
      - name: Trial local 第N行 legal pronunciation during lexical-slot selection
        run: npm run readings:audit -- --policy ordinal-line-trial --output data/generated/polyphonic-context-ordinal-line-trial.json
      - name: Verify 第N行 legal-first redraw changes only ordinal-adjacent lexical slots
        run: >-
          npx tsx scripts/compare-ordinal-line-trial.ts
          data/generated/polyphonic-context-reviewed-roles.json
          data/generated/polyphonic-context-ordinal-line-trial.json
          data/generated/polyphonic-ordinal-line-trial-comparison.json
      - name: Verify exact-seed changes and reviewed-role rejection counts
        run: >-
          npx tsx scripts/compare-polyphonic-role-trial.ts
          data/generated/polyphonic-context-exposure.json
          data/generated/polyphonic-context-reviewed-closed.json
          data/generated/polyphonic-context-reviewed-roles.json
          data/generated/polyphonic-role-trial-comparison.json
      - name: Extract ranked same-UPOS pronunciation review queue
        run: npx tsx scripts/audit-same-upos-polyphones.ts
      - name: Probe missing reading identities in bounded biased generation
        run: npx tsx scripts/audit-targeted-polyphonic-identities.ts --probes 3
      - name: Prepare annotated review summary
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync, appendFileSync } from 'node:fs';
          const report = JSON.parse(readFileSync('data/generated/polyphonic-context-exposure.json', 'utf8'));
          const gated = JSON.parse(readFileSync('data/generated/polyphonic-context-reviewed-closed.json', 'utf8'));
          const roles = JSON.parse(readFileSync('data/generated/polyphonic-context-reviewed-roles.json', 'utf8'));
          const comparison = JSON.parse(readFileSync('data/generated/polyphonic-role-trial-comparison.json', 'utf8'));
          const queue = JSON.parse(readFileSync('data/generated/same-upos-polyphone-review.json', 'utf8'));
          const targets = JSON.parse(readFileSync('data/generated/polyphonic-targeted-identity-coverage.json', 'utf8'));
          const zhongTrial = JSON.parse(readFileSync('data/generated/polyphonic-zhong-role-trial-comparison.json', 'utf8'));
          const ordinalTrial = JSON.parse(readFileSync('data/generated/polyphonic-ordinal-line-trial-comparison.json', 'utf8'));
          const conflict = JSON.parse(readFileSync('data/generated/conflicting-target-exposure.json', 'utf8'));
          const escape = (value) => String(value).replaceAll('|', '\\|').replaceAll('\n', ' ');
          const count = Object.entries(report.occurrenceCountByText)
            .sort((a,b) => b[1] - a[1] || a[0].localeCompare(b[0]));
          const lines = [
            '<!-- polyphonic-reading-exposure-report-v1 -->',
            '### Polyphonic reading exposure: 2,048 deterministic seeds',
            '',
            '**Diagnostic only:** a sampled multireading entry is not necessarily a wrong pronunciation.',
            'Numbers are from generated sentences, not actual user sessions.',
            '',
            '| Measure | Result |',
            '|---|---:|',
            ...[
              ['Sampled seeds', report.sampleCount],
              ['Successful sentences', report.successfulSentences],
              ['Failed sentences', report.failedSentences],
              ['Multireading forms in practice catalog', report.ambiguousTextCount],
              ['Multireading forms actually sampled', report.observedAmbiguousTextCount],
              ['Sentences containing a multireading form', report.sentencesWithAmbiguousReadings],
              ['Total sampled multireading occurrences', report.polyphonicOccurrences],
            ].map(([key,val]) => `| ${key} | ${val} |`),
            '',
            '#### Deterministic controls (reviewed-roles is active in the product)',
            '',
            '| Metric | Original | Closed-class trial | + Reviewed lexical roles |',
            '|---|---:|---:|---:|',
            ...[
              ['Successfully generated', report.successfulSentences, gated.successfulSentences, roles.successfulSentences],
              ['Sentences containing a multireading form', report.sentencesWithAmbiguousReadings, gated.sentencesWithAmbiguousReadings, roles.sentencesWithAmbiguousReadings],
              ['Multireading occurrences', report.polyphonicOccurrences, gated.polyphonicOccurrences, roles.polyphonicOccurrences],
              ['Distinct forms sampled', report.observedAmbiguousTextCount, gated.observedAmbiguousTextCount, roles.observedAmbiguousTextCount],
            ].map(([key, original, trial, role]) => `| ${key} | ${original} | ${trial} | ${role} |`),
            '',
            'Different generation paths are expected after filtering. Do not interpret fewer multireading hits as higher quality by itself.',
            '',
            `Exact seeds with changed candidate identities: closed-class ${comparison.changedSentenceCount.reviewedClosed}; reviewed roles ${comparison.changedSentenceCount.reviewedRoles}.`,
            '',
            '#### Reviewed role rejections (eligible syntactic roles only; including 好/ADJ)',
            '',
            '| Role | Before | After reviewed-role trial |',
            '|---|---:|---:|',
            ...['哪/PRON', '那/DET', '好/ADJ'].map(key => `| ${key} | ${comparison.reviewedRoleMismatchCountByRole.closedClassOnly[key] ?? 0} | ${comparison.reviewedRoleMismatchCountByRole.reviewedRoles[key] ?? 0} |`),
            '',
            '#### Exact reading identity coverage (not correctness)',
            '',
            `Total ambiguous catalog reading identities: ${targets.ambiguousReadingIdentityCount}; unbiased vs biased sampling are intentionally separated.`,
            '',
            '| Coverage label | Identities |',
            '|---|---:|',
            ...Object.entries(targets.statusCounts).map(([key, count]) => `| ${key} | ${count} |`),
            '',
            'Targets not seen in bounded probes remain UNKNOWN, not unreachable. Biased samples are not pronunciation-validity evidence.',
            '',
            '#### Opt-in 種 lexical role trial (never active in product)',
            '',
            `Reviewed NOUN/VERB mismatches: ${zhongTrial.priorDisallowedOccurrences} → ${zhongTrial.trialDisallowedOccurrences}. Changed seeds: ${zhongTrial.alteredSeeds}; unrelated changes: ${zhongTrial.unrelatedAlteredSeeds}.`,
            '',
            '#### Legal pronunciation and target weighting are separate',
            '',
            `In a 1,024-seed restricted lexical fixture, illegal 好/ADJ:ㄏㄠ4 was rejected in ${conflict.counts['legal-weak-tone4'].invalidDrawsCorrected} cases with four-tone weakness, and ${conflict.counts['legal-no-weakness'].invalidDrawsCorrected} cases without weakness.`,
            `Legitimate four-tone exercises: without weakness ${conflict.counts['legal-no-weakness'].validFourthToneCount}, with weakness ${conflict.counts['legal-weak-tone4'].validFourthToneCount}. Already-valid draws changed in neither cohort.`,
            'These are controlled, synthetic samples, not observed learner accuracy or validated natural sentences.',
            '',
            '#### Reviewed 第N行 context at lexical slot',
            '',
            `Disallowed 第N行 readings: ${ordinalTrial.wrongOrdinalLineHitsBefore} → ${ordinalTrial.wrongOrdinalLineHitsAfter}. Changed seed count: ${ordinalTrial.alteredSeeds.length}; changes outside the single ordinal-adjacent lexical slot: ${ordinalTrial.changedSeedsOutsideOrdinalLexicalSlot}. No whole-utterance rejection. A fixed-seed candidate distribution is expected to change when illegal reading weights are removed.`,
            '',
            '#### Same-UPOS sense-review queue (not error labels)',
            '',
            `Observed ${queue.unreviewedGroups} unreviewed multi-reading text/UPOS groups, ${queue.unreviewedOccurrences} occurrences; examples need human review.`,
            '',
            '| Written form / UPOS | Occurrences | Observed reading identities |',
            '|---|---:|---:|',
            ...queue.groups.filter(g => g.kind === 'unreviewed-role-variation')
              .slice(0, 12).map(g => `| ${escape(g.text)} / ${g.upos} | ${g.occurrences} | ${g.selectedReadingEntryIds.length} |`),
            '',
            '#### Most exposed written forms',
            '',
            '| Text | Occurrences | Distinct readings sampled |',
            '|---|---:|---:|',
            ...count.slice(0,25).map(([text,num]) => {
              const ids = new Set(report.hits.filter(hit => hit.text === text).map(hit => hit.selectedEntryId));
              return `| ${escape(text)} | ${num} | ${ids.size} |`;
            }),
            '',
            '#### Representative contexts (not labeled incorrect)',
            '',
            '| Seed | Sentence | Reading identity | UPOS / functions | Previous / next entry |',
            '|---:|---|---|---|---|',
          ];
          for (const [text] of count.slice(0,12)) {
            const examples = report.hits.filter(hit => hit.text === text);
            const byReading = new Map();
            for (const hit of examples) {
              if (!byReading.has(hit.selectedEntryId)) byReading.set(hit.selectedEntryId, hit);
            }
            for (const hit of [...byReading.values()].slice(0,3)) {
              lines.push(`| ${hit.seedIndex} | ${escape(hit.sentence)} |  ${escape(hit.selectedEntryId)} | ${escape(hit.selectedUpos ?? '∅')} / ${escape(hit.selectedFunctions.join(','))} | ${escape(hit.previousEntryText ?? '∅')} / ${escape(hit.nextEntryText ?? '∅')} |`);
            }
          }
          lines.push('', `Full per-hit JSON is attached to the workflow run; ${report.unsampledAmbiguousTexts.length} multireading written forms were not observed in this finite sample.`, '');
          const markdown = lines.join('\n');
          writeFileSync('polyphonic-audit-comment.md', markdown + '\n');
          if (process.env.GITHUB_STEP_SUMMARY) appendFileSync(process.env.GITHUB_STEP_SUMMARY, markdown + '\n');
          console.log(markdown);
          NODE
      - name: Upload complete reading audit
        uses: actions/upload-artifact@v4
        with:
          name: polyphonic-reading-exposure-json
          path: |
            data/generated/polyphonic-context-exposure.json
            data/generated/polyphonic-context-reviewed-closed.json
            data/generated/polyphonic-context-reviewed-roles.json
            data/generated/polyphonic-role-trial-comparison.json
            data/generated/same-upos-polyphone-review.json
            data/generated/polyphonic-targeted-identity-coverage.json
            data/generated/polyphonic-context-ordinal-line-trial.json
            data/generated/polyphonic-ordinal-line-trial-comparison.json
            data/generated/polyphonic-context-zhong-role-trial.json
            data/generated/polyphonic-zhong-role-trial-comparison.json
            data/generated/conflicting-target-exposure.json
            data/generated/polyphonic-lexeme-boundary-readiness.json
            data/generated/polyphonic-host-lexeme-reachability.json
            data/generated/dongxi-context-review.json
            data/generated/dongxi-ud-intake-summary.json
            data/generated/moe-sense-pilot-targets.json
            data/generated/moe-single-reading-catalog-crosscheck.json
          retention-days: 14
          if-no-files-found: error
