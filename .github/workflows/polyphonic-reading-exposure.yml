name: Polyphonic reading exposure

on:
  pull_request:
    paths:
      - ".github/workflows/polyphonic-reading-exposure.yml"
      - "scripts/audit-polyphonic-context.ts"
      - "scripts/audit-selected-moe-headword-coverage.ts"
      - "data/readings/moe-concised-2014_20260626-active-catalog.json"
      - "data/readings/moe-revised-2015_20260625-active-catalog-fallback.json"
      - "scripts/compare-moe-standard-le.ts"
      - "scripts/compare-moe-standard-bi.ts"
      - "scripts/compare-moe-standard-de.ts"
      - "scripts/compare-moe-standard-yu.ts"
      - "scripts/compare-moe-standard-nan.ts"
      - "scripts/compare-moe-standard-xing.ts"
      - "scripts/compare-moe-standard-guo.ts"
      - "scripts/compare-moe-na-surname.ts"
      - "scripts/compare-moe-attested-roles.ts"
      - "scripts/compare-moe-role-followup.ts"
      - "scripts/compare-moe-role-third.ts"
      - "scripts/compare-moe-role-fourth.ts"
      - "scripts/compare-moe-role-fifth.ts"
      - "scripts/compare-moe-role-sixth.ts"
      - "scripts/compare-moe-role-seventh.ts"
      - "scripts/compare-moe-role-eighth.ts"
      - "scripts/compare-moe-ordinal-room.ts"
      - "src/readings/moe-attested-role-compatibility.ts"
      - "src/readings/moe-na-surname-role.ts"
      - "src/readings/moe-standard-guo.ts"
      - "src/readings/moe-standard-xing.ts"
      - "src/readings/moe-standard-nan.ts"
      - "src/readings/moe-standard-yu.ts"
      - "src/readings/moe-standard-de.ts"
      - "scripts/compare-zhong-role-trial.ts"
      - "scripts/compare-ordinal-line-trial.ts"
      - "scripts/compare-duoshao-zhong-trial.ts"
      - "scripts/audit-conflicting-reading-target.ts"
      - "scripts/audit-same-upos-polyphones.ts"
      - "scripts/audit-same-upos-sense-readiness.ts"
      - "scripts/audit-targeted-polyphonic-identities.ts"
      - "scripts/prepare-moe-sense-targets.ts"
      - "scripts/audit-dongxi-ud-intake.ts"
      - "data/readings/dongxi-ud-gsd-attested-review-candidates.json"
      - "src/readings/**"
      - "tests/readings/**"
      - "package.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci --include=dev --ignore-scripts
      - name: Validate attested UD 東西 contexts without generating reading labels
        run: npx tsx scripts/audit-dongxi-ud-intake.ts
      - name: Generate the product catalog
        run: npm run app:catalog
      - name: Prepare five-word exact reading identities for private MOE review
        run: npx tsx scripts/prepare-moe-sense-targets.ts
      - name: Assert legal-only lexical redraw and actual learner target weighting
        run: npx tsx scripts/audit-conflicting-reading-target.ts
      - name: Audit 2048 deterministic generated sentences
        run: npm run readings:audit
      - name: Trial closed-class reading eligibility against the same seeds
        run: npm run readings:audit -- --policy reviewed-closed --output data/generated/polyphonic-context-reviewed-closed.json
      - name: Trial reviewed lexical roles against the same seeds
        run: npm run readings:audit -- --policy reviewed-roles --output data/generated/polyphonic-context-reviewed-roles.json
      - name: Audit exact host-lexeme boundaries without inferring character readings
        run: npx tsx scripts/audit-lexeme-boundary-readiness.ts
      - name: Probe whole-lexeme reachability with bounded biased sampling
        run: npx tsx scripts/probe-whole-lexeme-reachability.ts --probes 16
      - name: Record exact 東西 sense-context review candidates without declaring reading correctness
        run: npx tsx scripts/audit-dongxi-context.ts --samples-per-reading 24
      - name: Trial reviewed 種 noun/verb reading identity restrictions
        run: npm run readings:audit -- --policy zhong-role-trial --output data/generated/polyphonic-context-zhong-role-trial.json
      - name: Verify 種 opt-in trial has zero unlicensed selection and unrelated seed drift
        run: >-
          npx tsx scripts/compare-zhong-role-trial.ts
          data/generated/polyphonic-context-reviewed-roles.json
          data/generated/polyphonic-context-zhong-role-trial.json
          data/generated/polyphonic-zhong-role-trial-comparison.json
      - name: Trial local 第N行 legal pronunciation during lexical-slot selection
        run: npm run readings:audit -- --policy ordinal-line-trial --output data/generated/polyphonic-context-ordinal-line-trial.json
      - name: Verify 第N行 legal-first redraw changes only ordinal-adjacent lexical slots
        run: >-
          npx tsx scripts/compare-ordinal-line-trial.ts
          data/generated/polyphonic-context-reviewed-roles.json
          data/generated/polyphonic-context-ordinal-line-trial.json
          data/generated/polyphonic-ordinal-line-trial-comparison.json
      - name: Replay scoped 多少種 correction on the same 2048 seeds
        run: npm run readings:audit -- --policy duoshao-zhong-trial --output data/generated/polyphonic-context-duoshao-zhong-trial.json
      - name: Verify no unrelated lexical drift in 多少種 paired comparison
        run: >-
          npx tsx scripts/compare-duoshao-zhong-trial.ts
          data/generated/polyphonic-context-ordinal-line-trial.json
          data/generated/polyphonic-context-duoshao-zhong-trial.json
          data/generated/polyphonic-duoshao-zhong-trial-comparison.json
      - name: Replay MOE-standard 了 pronunciation on same 2048 seeds
        run: npm run readings:audit -- --policy standard-le-trial --output data/generated/polyphonic-context-standard-le-trial.json
      - name: Compare 了 standard-reading identity and single-slot changes
        run: >-
          npx tsx scripts/compare-moe-standard-le.ts
          data/generated/polyphonic-context-duoshao-zhong-trial.json
          data/generated/polyphonic-context-standard-le-trial.json
          data/generated/polyphonic-standard-le-trial-comparison.json
      - name: Replay MOE-standard 比 reading on the same 2048 seeds
        run: npm run readings:audit -- --policy standard-bi-trial --output data/generated/polyphonic-context-standard-bi-trial.json
      - name: Compare 比 standard-reading identities and unchanged legal selections
        run: >-
          npx tsx scripts/compare-moe-standard-bi.ts
          data/generated/polyphonic-context-standard-le-trial.json
          data/generated/polyphonic-context-standard-bi-trial.json
          data/generated/polyphonic-standard-bi-trial-comparison.json
      - name: Replay MOE-standard 得 pronunciation on same 2048 seeds
        run: npm run readings:audit -- --policy standard-de-trial --output data/generated/polyphonic-context-standard-de-trial.json
      - name: Compare 得 standard-reading identity and unchanged legal selections
        run: >-
          npx tsx scripts/compare-moe-standard-de.ts
          data/generated/polyphonic-context-standard-bi-trial.json
          data/generated/polyphonic-context-standard-de-trial.json
          data/generated/polyphonic-standard-de-trial-comparison.json
      - name: Replay MOE-standard 於 reading against the same 2048 seeds
        run: npm run readings:audit -- --policy standard-yu-trial --output data/generated/polyphonic-context-standard-yu-trial.json
      - name: Reject any non-target seed or lexical-slot change in 於 trial
        run: >-
          npx tsx scripts/compare-moe-standard-yu.ts
          data/generated/polyphonic-context-standard-de-trial.json
          data/generated/polyphonic-context-standard-yu-trial.json
          data/generated/polyphonic-standard-yu-trial-comparison.json
      - name: Replay MOE-standard 南 pronunciation against the same 2048 seeds
        run: npm run readings:audit -- --policy standard-nan-trial --output data/generated/polyphonic-context-standard-nan-trial.json
      - name: Reject any non-target seed or lexical-slot change in 南 trial
        run: >-
          npx tsx scripts/compare-moe-standard-nan.ts
          data/generated/polyphonic-context-standard-yu-trial.json
          data/generated/polyphonic-context-standard-nan-trial.json
          data/generated/polyphonic-standard-nan-trial-comparison.json
      - name: Replay MOE-standard 行 pronunciation on the same 2048 seeds
        run: npm run readings:audit -- --policy standard-xing-trial --output data/generated/polyphonic-context-standard-xing-trial.json
      - name: Confirm only the invalid 行 slots changed and no old known bad readings survive
        run: >-
          npx tsx scripts/compare-moe-standard-xing.ts
          data/generated/polyphonic-context-standard-nan-trial.json
          data/generated/polyphonic-context-standard-xing-trial.json
          data/generated/polyphonic-standard-xing-trial-comparison.json
      - name: Replay MOE-standard 過 pronunciation against frozen 2048 seeds
        run: npm run readings:audit -- --policy standard-guo-trial --output data/generated/polyphonic-context-standard-guo-trial.json
      - name: Reject changes outside original 過 lexical slots and all known incorrect readings
        run: >-
          npx tsx scripts/compare-moe-standard-guo.ts
          data/generated/polyphonic-context-standard-xing-trial.json
          data/generated/polyphonic-context-standard-guo-trial.json
          data/generated/polyphonic-standard-guo-trial-comparison.json
      - name: Replay MOE surname-only 那 on the same 2048 seeds
        run: npm run readings:audit -- --policy standard-na-surname-trial --output data/generated/polyphonic-context-standard-na-surname-trial.json
      - name: Reject all off-target seeds or lexical slots for surname-tone 那
        run: >-
          npx tsx scripts/compare-moe-na-surname.ts
          data/generated/polyphonic-context-standard-guo-trial.json
          data/generated/polyphonic-context-standard-na-surname-trial.json
          data/generated/polyphonic-na-surname-trial-comparison.json
      - name: Replay MOE-attested sense/UPOS role batch against same 2048 final seeds
        run: npm run readings:audit -- --policy standard-role-evidence-trial --output data/generated/polyphonic-context-standard-role-evidence-trial.json
      - name: Verify only 16 originally invalid role-based lexical slots changed
        run: >-
          npx tsx scripts/compare-moe-attested-roles.ts
          data/generated/polyphonic-context-standard-na-surname-trial.json
          data/generated/polyphonic-context-standard-role-evidence-trial.json
          data/generated/polyphonic-standard-role-evidence-trial-comparison.json
      - name: Replay MOE reviewed follow-up role pairs across the 2048 exact seeds
        run: npm run readings:audit -- --policy standard-role-followup-trial --output data/generated/polyphonic-context-standard-role-followup-trial.json
      - name: Guard exactly 27 original bad slots in 26 seeds, with no other drift
        run: >-
          npx tsx scripts/compare-moe-role-followup.ts
          data/generated/polyphonic-context-standard-role-evidence-trial.json
          data/generated/polyphonic-context-standard-role-followup-trial.json
          data/generated/polyphonic-standard-role-followup-trial-comparison.json
      - name: Replay third MOE role batch across same 2048 fixed seeds
        run: npm run readings:audit -- --policy standard-role-third-trial --output data/generated/polyphonic-context-standard-role-third-trial.json
      - name: Reject all drift beyond exactly 24 original incorrect slots
        run: >-
          npx tsx scripts/compare-moe-role-third.ts
          data/generated/polyphonic-context-standard-role-followup-trial.json
          data/generated/polyphonic-context-standard-role-third-trial.json
          data/generated/polyphonic-standard-role-third-trial-comparison.json
      - name: Replay fourth MOE role batch across same 2048 fixed seeds
        run: npm run readings:audit -- --policy standard-role-fourth-trial --output data/generated/polyphonic-context-standard-role-fourth-trial.json
      - name: Guard exactly 11 new invalid role slots and zero unrelated changes
        run: >-
          npx tsx scripts/compare-moe-role-fourth.ts
          data/generated/polyphonic-context-standard-role-third-trial.json
          data/generated/polyphonic-context-standard-role-fourth-trial.json
          data/generated/polyphonic-standard-role-fourth-trial-comparison.json
      - name: Replay fifth MOE role batch across same 2048 frozen seeds
        run: npm run readings:audit -- --policy standard-role-fifth-trial --output data/generated/polyphonic-context-standard-role-fifth-trial.json
      - name: Guard exactly seven fifth-batch wrong slots with no unrelated changes
        run: >-
          npx tsx scripts/compare-moe-role-fifth.ts
          data/generated/polyphonic-context-standard-role-fourth-trial.json
          data/generated/polyphonic-context-standard-role-fifth-trial.json
          data/generated/polyphonic-standard-role-fifth-trial-comparison.json
      - name: Replay sixth MOE role batch across same 2048 fixed final seeds
        run: npm run readings:audit -- --policy standard-role-sixth-trial --output data/generated/polyphonic-context-standard-role-sixth-trial.json
      - name: Guard nine wrong lexical slots in eight seeds and zero other drift
        run: >-
          npx tsx scripts/compare-moe-role-sixth.ts
          data/generated/polyphonic-context-standard-role-fifth-trial.json
          data/generated/polyphonic-context-standard-role-sixth-trial.json
          data/generated/polyphonic-standard-role-sixth-trial-comparison.json
      - name: Replay seventh MOE 和 reading-role batch across 2048 frozen seeds
        run: npm run readings:audit -- --policy standard-role-seventh-trial --output data/generated/polyphonic-context-standard-role-seventh-trial.json
      - name: Guard exactly 18 seventh-role slots in 17 seeds and zero other drift
        run: >-
          npx tsx scripts/compare-moe-role-seventh.ts
          data/generated/polyphonic-context-standard-role-sixth-trial.json
          data/generated/polyphonic-context-standard-role-seventh-trial.json
          data/generated/polyphonic-standard-role-seventh-trial-comparison.json
      - name: Replay eighth MOE evidence role batch on same frozen 2048 seeds
        run: npm run readings:audit -- --policy standard-role-eighth-trial --output data/generated/polyphonic-context-standard-role-eighth-trial.json
      - name: Guard seven eighth-batch wrong-role slots and zero other drift
        run: >-
          npx tsx scripts/compare-moe-role-eighth.ts
          data/generated/polyphonic-context-standard-role-seventh-trial.json
          data/generated/polyphonic-context-standard-role-eighth-trial.json
          data/generated/polyphonic-standard-role-eighth-trial-comparison.json
      - name: Replay ninth local ordinal-room reading on same 2048 seeds
        run: npm run readings:audit -- --policy standard-ordinal-room-trial --output data/generated/polyphonic-context-standard-ordinal-room-trial.json
      - name: Guard one 第八間 wrong-reading slot with zero other drift
        run: >-
          npx tsx scripts/compare-moe-ordinal-room.ts
          data/generated/polyphonic-context-standard-role-eighth-trial.json
          data/generated/polyphonic-context-standard-ordinal-room-trial.json
          data/generated/polyphonic-standard-ordinal-room-comparison.json
      - name: Inventory selected final readings against partial MOE projections without guessing correctness
        run: npx tsx scripts/audit-selected-moe-headword-coverage.ts
      - name: Verify exact-seed changes and reviewed-role rejection counts
        run: >-
          npx tsx scripts/compare-polyphonic-role-trial.ts
          data/generated/polyphonic-context-exposure.json
          data/generated/polyphonic-context-reviewed-closed.json
          data/generated/polyphonic-context-reviewed-roles.json
          data/generated/polyphonic-role-trial-comparison.json
      - name: Extract ranked same-UPOS pronunciation review queue
        run: npx tsx scripts/audit-same-upos-polyphones.ts
      - name: Evaluate dictionary-attested same-UPOS pronunciation evidence readiness
        run: npx tsx scripts/audit-same-upos-sense-readiness.ts
      - name: Probe missing reading identities in bounded biased generation
        run: npx tsx scripts/audit-targeted-polyphonic-identities.ts --probes 3
      - name: Prepare annotated review summary
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync, appendFileSync } from 'node:fs';
          const report = JSON.parse(readFileSync('data/generated/polyphonic-context-exposure.json', 'utf8'));
          const gated = JSON.parse(readFileSync('data/generated/polyphonic-context-reviewed-closed.json', 'utf8'));
          const roles = JSON.parse(readFileSync('data/generated/polyphonic-context-reviewed-roles.json', 'utf8'));
          const final = JSON.parse(readFileSync('data/generated/polyphonic-context-standard-ordinal-room-trial.json', 'utf8'));
          const comparison = JSON.parse(readFileSync('data/generated/polyphonic-role-trial-comparison.json', 'utf8'));
          const queue = JSON.parse(readFileSync('data/generated/same-upos-polyphone-review.json', 'utf8'));
          const senseReadiness = JSON.parse(readFileSync('data/generated/same-upos-sense-readiness.json', 'utf8'));
          const targets = JSON.parse(readFileSync('data/generated/polyphonic-targeted-identity-coverage.json', 'utf8'));
          const zhongTrial = JSON.parse(readFileSync('data/generated/polyphonic-zhong-role-trial-comparison.json', 'utf8'));
          const ordinalTrial = JSON.parse(readFileSync('data/generated/polyphonic-ordinal-line-trial-comparison.json', 'utf8'));
          const conflict = JSON.parse(readFileSync('data/generated/conflicting-target-exposure.json', 'utf8'));
          const escape = (value) => String(value).replaceAll('|', '\\|').replaceAll('\n', ' ');
          if (final.readingEligibilityPolicy !== 'standard-ordinal-room-trial'
            || final.sampleCount !== 2048 || final.successfulSentences !== 2048
            || final.failedSentences !== 0 || queue.sourcePolicy !== final.readingEligibilityPolicy
            || queue.sampleCount !== final.sampleCount
            || senseReadiness.sourcePolicy !== queue.sourcePolicy
            || senseReadiness.sampleCount !== queue.sampleCount
            || senseReadiness.unchangedUnreviewedGroups !== queue.unreviewedGroups
            || senseReadiness.unchangedUnreviewedOccurrences !== queue.unreviewedOccurrences
            || senseReadiness.moeAttestedGroups !== queue.moeAttestedReadingGroups
            || senseReadiness.moeAttestedOccurrences !== queue.moeAttestedReadingOccurrences
          ) throw new Error('review queue and sense-readiness audit must describe the same final product exposure');
          const count = Object.entries(final.occurrenceCountByText)
            .sort((a,b) => b[1] - a[1] || a[0].localeCompare(b[0]));
          const lines = [
            '<!-- polyphonic-reading-exposure-report-v1 -->',
            '### Final delivered polyphonic reading exposure: 2,048 deterministic seeds',
            '',
            '**Diagnostic only:** a sampled multireading entry is not necessarily a wrong pronunciation.',
            'Current figures and example contexts are from final standard-ordinal-room-trial output, not historical baselines; generated sentences are not user sessions.',
            '',
            '| Measure | Result |',
            '|---|---:|',
            ...[
              ['Sampled seeds', final.sampleCount],
              ['Successful sentences', final.successfulSentences],
              ['Failed sentences', final.failedSentences],
              ['Multireading forms in practice catalog', final.ambiguousTextCount],
              ['Multireading forms actually sampled', final.observedAmbiguousTextCount],
              ['Sentences containing a multireading form', final.sentencesWithAmbiguousReadings],
              ['Total sampled multireading occurrences', final.polyphonicOccurrences],
            ].map(([key,val]) => `| ${key} | ${val} |`),
            '',
            '#### Historical deterministic controls (not the current final stage)',
            '',
            '| Metric | Original | Closed-class trial | + Reviewed lexical roles |',
            '|---|---:|---:|---:|',
            ...[
              ['Successfully generated', report.successfulSentences, gated.successfulSentences, roles.successfulSentences],
              ['Sentences containing a multireading form', report.sentencesWithAmbiguousReadings, gated.sentencesWithAmbiguousReadings, roles.sentencesWithAmbiguousReadings],
              ['Multireading occurrences', report.polyphonicOccurrences, gated.polyphonicOccurrences, roles.polyphonicOccurrences],
              ['Distinct forms sampled', report.observedAmbiguousTextCount, gated.observedAmbiguousTextCount, roles.observedAmbiguousTextCount],
            ].map(([key, original, trial, role]) => `| ${key} | ${original} | ${trial} | ${role} |`),
            '',
            'Different generation paths are expected after filtering. Do not interpret fewer multireading hits as higher quality by itself.',
            '',
            `Exact seeds with changed candidate identities: closed-class ${comparison.changedSentenceCount.reviewedClosed}; reviewed roles ${comparison.changedSentenceCount.reviewedRoles}.`,
            '',
            '#### Reviewed role rejections (eligible syntactic roles only; including 好/ADJ)',
            '',
            '| Role | Before | After reviewed-role trial |',
            '|---|---:|---:|',
            ...['哪/PRON', '那/DET', '好/ADJ'].map(key => `| ${key} | ${comparison.reviewedRoleMismatchCountByRole.closedClassOnly[key] ?? 0} | ${comparison.reviewedRoleMismatchCountByRole.reviewedRoles[key] ?? 0} |`),
            '',
            '#### Exact reading identity coverage (not correctness)',
            '',
            `Total ambiguous catalog reading identities: ${targets.ambiguousReadingIdentityCount}; unbiased vs biased sampling are intentionally separated.`,
            '',
            '| Coverage label | Identities |',
            '|---|---:|',
            ...Object.entries(targets.statusCounts).map(([key, count]) => `| ${key} | ${count} |`),
            '',
            'Targets not seen in bounded probes remain UNKNOWN, not unreachable. Biased samples are not pronunciation-validity evidence.',
            '',
            '#### Opt-in 種 lexical role trial (never active in product)',
            '',
            `Reviewed NOUN/VERB mismatches: ${zhongTrial.priorDisallowedOccurrences} → ${zhongTrial.trialDisallowedOccurrences}. Changed seeds: ${zhongTrial.alteredSeeds}; unrelated changes: ${zhongTrial.unrelatedAlteredSeeds}.`,
            '',
            '#### Legal pronunciation and target weighting are separate',
            '',
            `In a 1,024-seed restricted lexical fixture, illegal 好/ADJ:ㄏㄠ4 was rejected in ${conflict.counts['legal-weak-tone4'].invalidDrawsCorrected} cases with four-tone weakness, and ${conflict.counts['legal-no-weakness'].invalidDrawsCorrected} cases without weakness.`,
            `Legitimate four-tone exercises: without weakness ${conflict.counts['legal-no-weakness'].validFourthToneCount}, with weakness ${conflict.counts['legal-weak-tone4'].validFourthToneCount}. Already-valid draws changed in neither cohort.`,
            'These are controlled, synthetic samples, not observed learner accuracy or validated natural sentences.',
            '',
            '#### Reviewed 第N行 context at lexical slot',
            '',
            `Disallowed 第N行 readings: ${ordinalTrial.wrongOrdinalLineHitsBefore} → ${ordinalTrial.wrongOrdinalLineHitsAfter}. Changed seed count: ${ordinalTrial.alteredSeeds.length}; changes outside the single ordinal-adjacent lexical slot: ${ordinalTrial.changedSeedsOutsideOrdinalLexicalSlot}. No whole-utterance rejection. A fixed-seed candidate distribution is expected to change when illegal reading weights are removed.`,
            '',
            '#### Final-delivered same-UPOS sense-review queue (not error labels)',
            '',
            `Observed ${queue.unreviewedGroups} unreviewed multi-reading text/UPOS groups, ${queue.unreviewedOccurrences} occurrences; examples need human review.`,
            `Of these, ${queue.moeAttestedReadingGroups} groups (${queue.moeAttestedReadingOccurrences} occurrences) have independently MOE-attested observed headword readings; sentence-specific senses remain unverified. These are still included among unreviewed groups.`,
            '',
            '',
            `For ${senseReadiness.groupsWithIdenticalProfileFunctions} of these ${senseReadiness.moeAttestedGroups} groups, all sampled reading identities have exactly the same aggregate syntax-profile function sets; these cannot disambiguate the selected lexical sense. No per-instance sense label is available in this audit.`,
            '',
            '| Group | Profile function sets across readings | Same across all readings? | Sentence-specific sense |',
            '|---|---:|---|---|',
            ...senseReadiness.groups.map(g => `| ${escape(g.text)} / ${g.upos} | ${g.distinctProfileFunctionSets} | ${g.profileFunctionsAllReadingsIdentical ? 'yes' : 'no'} | not collected |`),
            '',
            '| Written form / UPOS | Occurrences | Observed reading identities | Dictionary sound evidence |',
            '|---|---:|---:|---|',
            ...queue.groups.filter(g => g.kind === 'unreviewed-role-variation')
              .slice(0, 12).map(g => `| ${escape(g.text)} / ${g.upos} | ${g.occurrences} | ${g.selectedReadingEntryIds.length} | ${g.moeAttestedReadings ? '[MOE-listed sounds](' + g.moeAttestedReadings.sourceUrl + '), sense unverified' : 'not independently checked'} |`),
            '',
            '#### Most exposed written forms in the final delivered sample',
            '',
            '| Text | Occurrences | Distinct readings sampled |',
            '|---|---:|---:|',
            ...count.slice(0,25).map(([text,num]) => {
              const ids = new Set(final.hits.filter(hit => hit.text === text).map(hit => hit.selectedEntryId));
              return `| ${escape(text)} | ${num} | ${ids.size} |`;
            }),
            '',
            '#### Final delivered representative contexts (not labeled incorrect)',
            '',
            '| Seed | Sentence | Reading identity | UPOS / functions | Previous / next entry |',
            '|---:|---|---|---|---|',
          ];
          for (const [text] of count.slice(0,12)) {
            const examples = final.hits.filter(hit => hit.text === text);
            const byReading = new Map();
            for (const hit of examples) {
              if (!byReading.has(hit.selectedEntryId)) byReading.set(hit.selectedEntryId, hit);
            }
            for (const hit of [...byReading.values()].slice(0,3)) {
              lines.push(`| ${hit.seedIndex} | ${escape(hit.sentence)} |  ${escape(hit.selectedEntryId)} | ${escape(hit.selectedUpos ?? '∅')} / ${escape(hit.selectedFunctions.join(','))} | ${escape(hit.previousEntryText ?? '∅')} / ${escape(hit.nextEntryText ?? '∅')} |`);
            }
          }
          lines.push('', `Full per-hit JSON is attached to the workflow run; ${final.unsampledAmbiguousTexts.length} multireading written forms were not observed in this finite sample.`, '');
          const markdown = lines.join('\n');
          writeFileSync('polyphonic-audit-comment.md', markdown + '\n');
          if (process.env.GITHUB_STEP_SUMMARY) appendFileSync(process.env.GITHUB_STEP_SUMMARY, markdown + '\n');
          console.log(markdown);
          NODE
