name: tmp integrate negation on BA sampler

on:
  push:
    branches:
      - agent/integrate-ba-negation-v2

permissions:
  contents: write

jobs:
  integrate:
    if: ${{ !contains(github.event.head_commit.message, '[integrated-negation-v2]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Merge negation retirement and resolve combined runtime lock
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          set +e
          git merge --no-commit --no-ff 43b711c6fd135ce27b54927ce07e3bc0a183862e
          merge_status=$?
          set -e

          mapfile -t conflicts < <(git diff --name-only --diff-filter=U | sort)
          printf 'Conflicts:\n'; printf '  %s\n' "${conflicts[@]:-<none>}"
          if [ "${#conflicts[@]}" -ne 1 ] || [ "${conflicts[0]}" != "data/grammar/formal-syntax-runtime-lock.json" ]; then
            echo "Expected exactly the runtime-lock conflict"
            exit 1
          fi
          if [ "$merge_status" -eq 0 ]; then
            echo "Expected a runtime-lock merge conflict"
            exit 1
          fi

          # Git cleanly auto-merges the actual grammar/test changes. Verify both
          # sides survived before resolving the derived lock.
          if ! grep -q 'constituent("predicate", "BAPredicate"' src/syntax/clause-rules.ts; then
            echo "BA predicate routing was lost during auto-merge"
            exit 1
          fi
          if grep -q 'production("clause.negative"' src/syntax/clause-rules.ts; then
            echo "clause.negative survived the retirement merge"
            exit 1
          fi
          if grep -q '"clause.negative"' tests/syntax/clause-rules.test.ts; then
            echo "clause-rules test retained stale negative identity"
            exit 1
          fi
          if grep -q '"clause.negative"' tests/syntax/predicate-ownership.test.ts; then
            echo "predicate ownership test retained stale negative identity"
            exit 1
          fi

          # Runtime lock is derived from the combined executable grammar.
          git checkout --ours -- data/grammar/formal-syntax-runtime-lock.json
          git add -A

          npm ci --include=dev --ignore-scripts
          set +e
          npm run app:catalog > /tmp/catalog-first.log 2>&1
          catalog_status=$?
          set -e
          if [ "$catalog_status" -eq 0 ]; then
            echo "Expected runtime lock to require a combined grammar digest update"
            cat /tmp/catalog-first.log
            exit 1
          fi
          cat /tmp/catalog-first.log

          python - <<'PY'
          import json, re
          from pathlib import Path

          log = Path('/tmp/catalog-first.log').read_text()
          match = re.search(r'expected grammarRulesDigest=([0-9a-f]+), sourceRuleIndexDigest=([0-9a-f]+)', log)
          if not match:
              raise SystemExit('could not extract combined runtime-lock digests')
          grammar, source = match.groups()
          path = Path('data/grammar/formal-syntax-runtime-lock.json')
          lock = json.loads(path.read_text())
          if lock['sourceRuleIndexDigest'] != source:
              raise SystemExit(f'source digest unexpectedly changed: {lock["sourceRuleIndexDigest"]} -> {source}')
          lock['grammarRulesDigest'] = grammar
          path.write_text(json.dumps(lock, ensure_ascii=False, separators=(',', ':')) + '\n')
          print(f'combined grammarRulesDigest={grammar}')
          PY

          npm run app:catalog
          git add -A
          git commit -m "test: integrate negation retirement on BA sampler [integrated-negation-v2]"
          git push origin HEAD:agent/integrate-ba-negation-v2
