name: Attested reading-first pilot

on:
  pull_request:
    paths:
      - ".github/workflows/attested-reading-first-pilot.yml"
      - "research/attested-reading-pilot/**"
      - "scripts/prototype-attested-reading-selector.ts"
      - "tests/readings/attested-reading-pilot.test.ts"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-attested-pilot:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci --include=dev --ignore-scripts
      - name: Verify pinned real corpus cases and phonetic source independence
        run: npx vitest run tests/readings/attested-reading-pilot.test.ts
      - name: Run independent reading-first / learner-weakness A/B
        run: >-
          npx tsx scripts/prototype-attested-reading-selector.ts
          research/attested-reading-pilot/cases.json
          data/generated/attested-reading-weight-only-ab.json
      - name: Compare real-corpus selected token exposure
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from "node:fs";
          const a=JSON.parse(readFileSync("data/generated/attested-reading-weight-only-ab.json","utf8"));
          const lines=[
            "# Real-context pilot: independent MOE readings, then weak-key selection",
            "",
            `- Attested source cases: ${a.datasetCases}`,
            `- Whole-word UD transliteration disagreements with reviewed MOE Pinyin: ${a.sourceTranslitDisagreementCount} (not all errors on the target character)`,
            "- Original UD Translit NEVER used as answer.",
            "- Only the target character is reviewed; complete sentence G2P and naturalness are not scored.",
            "",
            "| Learner weak token | Target case count | Baseline exact probability | Weighted exact probability | Baseline / weighted seeded selections |",
            "|---|---:|---:|---:|---:|",
            ...a.perWeakToken.map(x=>
              `| ${x.targetToken} | ${x.eligibleCases} | ${(x.baselineTargetProbability*100).toFixed(1)}% | ${(x.boostedTargetProbability*100).toFixed(1)}% | ${x.baselineTargetSelections} / ${x.boostedTargetSelections} |`
            ),
            "",
            "**Not production metrics.** Synthetic 12/16 wrong-typing evidence, fixed corpus, read-only toy sampler. No change to shipping lexicon or user progress.",
          ];
          appendFileSync(process.env.GITHUB_STEP_SUMMARY,lines.join("\n")+"\n");
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: attested-reading-first-pilot-ab-json
          path: data/generated/attested-reading-weight-only-ab.json
          retention-days: 30
          if-no-files-found: error
